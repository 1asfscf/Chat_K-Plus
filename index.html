<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>momQ 프리미엄 쇼핑몰</title>
    <style>
        /* 전체 스타일 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Pretendard', sans-serif;
        }
        body {
            background-color: #f9f9f9;
            color: #333;
            text-align: center;
        }

        /* 헤더 */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background-color: white;
            padding: 16px 30px;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.08);
        }
        .header-logo {
            font-size: 24px;
            font-weight: bold;
            color: #004085;
        }
        .header-nav ul {
            list-style: none;
            display: flex;
        }
        .header-nav ul li {
            margin: 0 15px;
        }
        .header-nav ul li a {
            color: #333;
            text-decoration: none;
            font-weight: bold;
            font-size: 15px;
            transition: 0.3s;
        }
        .header-nav ul li a:hover {
            color: #007bff;
        }

        /* 추천 상품 섹션 */
        .products-section {
            margin: 40px auto;
            padding: 30px 10%;
            background: white;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.08);
            border-radius: 15px;
            width: 90%;
            max-width: 1400px;
        }
        .products-section h2 {
            font-size: 24px;
            font-weight: bold;
            color: #004085;
            margin-bottom: 20px;
        }
        .products-container {
            display: flex;
            justify-content: center;
            flex-wrap: nowrap;
            gap: 15px;
            overflow-x: auto;
        }
        .product-box {
            background: white;
            padding: 12px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.12);
            text-align: center;
            border: 1px solid #ddd;
            min-width: 250px;
        }
        .product-box img {
            width: 100%;
            max-width: 220px;
            border-radius: 5px;
            margin-bottom: 10px;
        }
        .product-box h3 {
            font-size: 16px;
            font-weight: bold;
            color: #333;
            margin-bottom: 5px;
        }
        .product-box p {
            font-size: 14px;
            color: #666;
            margin-bottom: 8px;
        }
        .product-box .price {
            font-size: 16px;
            font-weight: bold;
            color: #d43f3f;
        }

        /* 푸터 */
        footer {
            text-align: center;
            padding: 16px;
            background-color: #f1f1f1;
            color: #666;
            font-size: 13px;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <header class="header">

        <nav class="header-nav">
            <ul>
