<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>momQ 프리미엄 쇼핑몰</title>
  <style>
    /* 전체 스타일 */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Pretendard', sans-serif;
    }
    body {
      background-color: #f9f9f9;
      color: #333;
      text-align: center;
    }
    /* 고급스러운 헤더 */
    .header {
      background: linear-gradient(135deg, #141E30, #243B55);
      color: #fff;
      padding: 20px 40px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
    }
    .header-container {
      display: flex;
      justify-content: space-between;
      align-items: center;
      max-width: 1200px;
      margin: 0 auto;
    }
    .header-logo {
      font-size: 28px;
      font-weight: bold;
      letter-spacing: 1px;
    }
    .header-nav ul {
      list-style: none;
      display: flex;
      gap: 20px;
      margin: 0;
      padding: 0;
    }
    .header-nav ul li a {
      color: #fff;
      text-decoration: none;
      font-size: 16px;
      transition: color 0.3s;
      position: relative;
      padding-bottom: 4px;
    }
    .header-nav ul li a:after {
      content: "";
      position: absolute;
      width: 0;
      height: 2px;
      background: #fff;
      left: 0;
      bottom: 0;
      transition: width 0.3s;
    }
    .header-nav ul li a:hover {
      color: #ddd;
    }
    .header-nav ul li a:hover:after {
      width: 100%;
    }
    /* 헤더 아래 배너 이미지 영역 */
    .banner {
      width: 100%;
      overflow: hidden;
      margin: 0 auto;
      /* 고급스러운 테두리와 그림자 효과 */
      border-top: 4px solid #243B55;
      border-bottom: 4px solid #243B55;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
    }
    .banner img {
      width: 100%;
      height: auto;
      display: block;
    }
  </style>
</head>
<body>
  <header class="header">
    <div class="header-container">
      <div class="header-logo">momQ 쇼핑몰</div>
      <nav class="header-nav">
        <ul>
          <li><a href="#">홈</a></li>
          <li><a href="#">제품</a></li>
          <li><a href="#">이벤트</a></li>
          <li><a href="#">커뮤니티</a></li>
          <li><a href="#">문의하기</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <!-- 헤더 아래 고급스러운 배너 이미지 영역 -->
  <section class="banner">
    <img src="https://img.makeshop.co.kr/4/29457/202505/e884ed9ac295c362bcc500ec35759ca6.jpg" alt="프리미엄 배너 이미지">
  </section>
</body>
</html>
