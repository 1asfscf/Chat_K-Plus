<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>momQ 프리미엄 쇼핑몰</title>
  <style>
    /* 헤더 기본 스타일 */
    .header {
      background: linear-gradient(135deg, #141E30, #243B55);
      color: #fff;
      padding: 20px 40px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
    }
    .header-container {
      display: flex;
      justify-content: space-between;
      align-items: center;
      max-width: 1200px;
      margin: 0 auto;
    }
    .header-logo {
      font-size: 28px;
      font-weight: bold;
      letter-spacing: 1px;
    }
    
    /* 네비게이션 메뉴 */
    .header-nav ul {
      list-style: none;
      display: flex;
      gap: 20px;
      margin: 0;
      padding: 0;
    }
    .header-nav ul li a {
      color: #fff;
      text-decoration: none;
      font-size: 16px;
      transition: color 0.3s;
      position: relative;
      padding-bottom: 4px;
    }
    /* 밑줄 애니메이션 효과 */
    .header-nav ul li a:after {
      content: "";
      position: absolute;
      width: 0;
      height: 2px;
      background: #fff;
      left: 0;
      bottom: 0;
      transition: width 0.3s;
    }
    .header-nav ul li a:hover {
      color: #ddd;
    }
    .header-nav ul li a:hover:after {
      width: 100%;
    }
  </style>
</head>
<body>
  <header class="header">
    <div class="header-container">
      <div class="header-logo">momQ 쇼핑몰</div>
      <nav class="header-nav">
        <ul>
          <li><a href="#">홈</a></li>
          <li><a href="#">제품</a></li>
          <li><a href="#">이벤트</a></li>
          <li><a href="#">커뮤니티</a></li>
          <li><a href="#">문의하기</a></li>
        </ul>
      </nav>
    </div>
  </header>
</body>
</html>
