<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=, maximum-scale=1" />
  <title>티빙</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
  <style>
    /* 공통 변수 */
    :root {
      --clr-bg: #0a0a0a;
      --clr-primary: #e50914;
      --clr-text: #eee;
      --header-h-pc: 56px;
      --header-h-mobile: 48px;
      --touch-target: 44px;
      --hamburger-size: 48px;
      --logo-size-pc: 28px;
      --logo-size-mobile: 24px;
      --nav-font: 16px;
      --hover-transition: 0.3s ease;
    }
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0; padding: 0;
    }
    body {
      background: var(--clr-bg);
      color: var(--clr-text);
      font-family: 'Noto Sans KR', sans-serif;
      overflow-x: hidden;
    }

    /* ─────────────── 헤더 ─────────────── */
    header {
      position: fixed; top: 0; left: 0; right: 0;
      height: var(--header-h-pc);
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 16px;
      background: #000; border-bottom: 1px solid #222;
      z-index: 1000;
    }
    .logo {
      font: 900 var(--logo-size-pc)/1 'Noto Sans KR';
      letter-spacing: 4px; color: var(--clr-primary);
      user-select: none; flex-shrink: 0;
    }
    .pc-nav {
      display: flex; gap: 24px; flex: 1; justify-content: center;
    }
    .pc-nav a {
      font: 600 var(--nav-font)/1 'Noto Sans KR';
      color: var(--clr-text);
      position: relative;
      padding: 12px 16px;
      display: flex; align-items: center;
      transition: color var(--hover-transition);
      text-decoration: none; border-radius: 4px;
    }
    @media (hover: hover) and (pointer: fine) {
      .pc-nav a:hover { color: var(--clr-primary); background: rgba(229,9,20,0.1); }
      .pc-nav a.active::after {
        content: ''; position: absolute; bottom: 4px; left:50%; transform: translateX(-50%);
        width:80%; height:2px; background: var(--clr-primary); border-radius:1px;
      }
    }

    /* ─────────────── 본문 ─────────────── */
    main {
      padding: calc(var(--header-h-pc) + 16px) 16px 16px;
      max-width: 1280px; margin: 0 auto;
    }
    .section-title {
      font: 700 18px/1.2 'Noto Sans KR'; margin-bottom: 16px;
    }
    .top20-list {
      display:flex; gap:12px; overflow-x:auto; scroll-behavior:smooth; padding-bottom:12px;
      -webkit-overflow-scrolling: touch; scroll-snap-type: x mandatory;
    }
    .top20-list::-webkit-scrollbar { display: none; }
    .top20-item {
      position: relative; flex:0 0 120px; border-radius:8px; overflow:hidden;
      cursor:pointer; transition:transform var(--hover-transition),box-shadow var(--hover-transition);
      scroll-snap-align:start; -webkit-tap-highlight-color:transparent;
    }
    .top20-item img {
      width:100%; aspect-ratio:2/3; object-fit:cover; display:block;
    }
    @media (hover: hover) and (pointer: fine) {
      .top20-item:hover {
        transform: scale(1.03); box-shadow:0 0 12px var(--clr-primary);
      }
    }
    .rank {
      position:absolute; top:8px; left:8px;
      font:900 20px/1 'Noto Sans KR'; color:#fff; text-shadow:0 0 4px rgba(0,0,0,0.8);
    }
    .label {
      position:absolute; top:8px; right:8px; padding:3px 6px;
      font:700 10px/1 'Noto Sans KR'; border-radius:3px; color:#fff; background:var(--clr-primary);
    }
    .label.age { background:#ff3b3b; right:auto; left:8px; top:36px; }
    .label.only { background:#00a8ff; }

    /* ─────────────── 모바일 전용 ─────────────── */
    @media (pointer: coarse) {
      /* 헤더 높이, 로고 크기 */
      header {
        height: var(--header-h-mobile);
      }
      .logo {
        font-size: var(--logo-size-mobile);
        letter-spacing: 2px;
      }

      /* PC 네비게이션 숨기고 햄버거 표시 */
      .pc-nav { display: none; }
      .hamburger {
        display: block; background:none; border:0; cursor:pointer;
        width:var(--hamburger-size); height:var(--hamburger-size);
        padding:8px; border-radius:4px; flex-shrink:0;
        transition: background var(--hover-transition);
      }
      .hamburger span {
        display:block; width:20px; height:2px; background:#fff; margin:4px auto; transition:0.3s; border-radius:1px;
      }
      @media (hover: none) {
        .hamburger:active { background:rgba(255,255,255,0.1); transform:scale(0.95); }
      }
      @media (hover: hover) {
        .hamburger:hover { background:rgba(255,255,255,0.1); }
      }

      /* 모바일 드로어 */
      .mobile-nav-drawer {
        display:flex; position:fixed; top:0; bottom:0; right:0;
        width:280px; max-width:85%; background:#111;
        transform:translateX(100%); transition:transform .35s ease;
        flex-direction:column; padding:var(--header-h-mobile) 20px 20px;
        overflow-y:auto; z-index:999; -webkit-overflow-scrolling: touch;
      }
      .mobile-nav-drawer a {
        font:600 18px/1.5 'Noto Sans KR'; color:#fff;
        padding:16px 0; text-decoration:none; border-bottom:1px solid #333;
      }
      .mobile-nav-drawer a:active {
        background:rgba(229,9,20,0.1); color:var(--clr-primary); transform:translateX(8px);
      }
      .mobile-nav-drawer.open { transform:translateX(0); }

      /* 하단 메뉴바 */
      .mobile-bottom-nav {
        display:flex; position:fixed; bottom:0; left:0; right:0;
        height:56px; background:#111; border-top:1px solid #222;
        justify-content:space-around; align-items:center;
        padding:4px 0 env(safe-area-inset-bottom); z-index:10000;
      }
      .bottom-nav-btn {
        background:none; border:0; color:#888; font-size:11px;
        display:flex; flex-direction:column; align-items:center;
        padding:6px 8px; border-radius:6px;
        min-width:var(--touch-target); min-height:var(--touch-target);
        transition:all var(--hover-transition);
      }
      .bottom-nav-btn svg { margin-bottom:2px; transition:transform var(--hover-transition); }
      .bottom-nav-btn.active, .bottom-nav-btn:active {
        color:var(--clr-primary); background:rgba(229,9,20,0.1);
      }
      .bottom-nav-btn:active { transform:scale(0.95); }
      .bottom-nav-btn:active svg { transform:scale(1.05); }
    }

    /* ─────────────── 태블릿 이상 (PC 네비게이션 복원) ─────────────── */
    @media (pointer: fine) and (min-width: 768px) {
      .hamburger { display: none; }
      .mobile-nav-drawer, .mobile-bottom-nav { display: none; }
    }
  </style>
</head>
<body>
  <header>
    <button class="hamburger" aria-label="메뉴 열기" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
    <div class="logo" aria-label="티빙 로고">TVING</div>
    <nav class="pc-nav" role="navigation" aria-label="주요 메뉴">
      <a href="#" class="active">실시간</a>
      <a href="#">TV프로그램</a>
      <a href="#">영화</a>
      <a href="#">파라운트+</a>
      <a href="#">키즈</a>
    </nav>
  </header>

  <nav class="mobile-nav-drawer" aria-label="모바일 메뉴">
    <a href="#" class="active">실시간</a>
    <a href="#">TV프로그램</a>
    <a href="#">영화</a>
    <a href="#">파라운트+</a>
    <a href="#">키즈</a>
  </nav>

  <main>
    <section class="top20" aria-label="오늘의 티빙 TOP 20">
      <h2 class="section-title">오늘의 티빙 TOP 20</h2>
      <div class="top20-list">
        <div class="top20-item">
          <span class="rank">1</span>
          <img src="https://img.tving.com/uploaded_images/contents/2024/07/20240724123456_0.jpg" alt="대탈출" loading="lazy" decoding="async">
          <span class="label new">NEW</span>
          <span class="label age">18+</span>
        </div>
        <div class="top20-item">
          <span class="rank">2</span>
          <img src="https://img.tving.com/uploaded_images/contents/2024/07/20240724123556_0.jpg" alt="눈물의 여왕" loading="lazy" decoding="async">
        </div>
        <div class="top20-item">
          <span class="rank">3</span>
          <img src="https://img.tving.com/uploaded_images/contents/2024/07/20240724123656_0.jpg" alt="웨딩 임파서블" loading="lazy" decoding="async">
          <span class="label only">ONLY</span>
        </div>
        <div class="top20-item">
          <span class="rank">4</span>
          <img src="https://img.tving.com/uploaded_images/contents/2024/07/20240724123756_0.jpg" alt="나는 솔로" loading="lazy" decoding="async">
          <span class="label new">NEW</span>
        </div>
        <div class="top20-item">
          <span class="rank">5</span>
          <img src="https://img.tving.com/uploaded_images/contents/2024/07/20240724123856_0.jpg" alt="유퀴즈" loading="lazy" decoding="async">
          <span class="label new">NEW</span>
        </div>
        <div class="top20-item">
          <span class="rank">6</span>
          <img src="https://img.tving.com/uploaded_images/contents/2024/07/20240724123956_0.jpg" alt="한성" loading="lazy" decoding="async">
        </div>
      </div>
    </section>
  </main>

  <nav class="mobile-bottom-nav" role="navigation" aria-label="모바일 하단 메뉴">
    <button class="bottom-nav-btn active" aria-label="홈">
      <svg width="20" height="20" fill="currentColor" viewBox="0 0 24 24"><path d="M3 9.5L12 3l9 6.5V21a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1V9.5z"/></svg>
      <span>홈</span>
    </button>
    <button class="bottom-nav-btn" aria-label="공개예정">
      <svg width="20" height="20" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2zm1 15h-2v-6h2zm0-8h-2V7h2z"/></svg>
      <span>공개예정</span>
    </button>
    <button class="bottom-nav-btn" aria-label="검색">
      <svg width="20" height="20" fill="currentColor" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <span>검색</span>
    </button>
    <button class="bottom-nav-btn" aria-label="기록">
      <svg width="20" height="20" fill="currentColor" viewBox="0 0 24 24"><path d="M3 3h18v2H3zm0 4h18v2H3zm0 4h18v2H3zm0 4h18v2H3zm0 4h18v2H3z"/></svg>
      <span>기록</span>
    </button>
  </nav>

  <script>
    // 모바일 전용 스크립트만 pointer: coarse 디바이스에서 동작
    if (window.matchMedia('(pointer: coarse)').matches) {
      const drawer = document.querySelector('.mobile-nav-drawer');
      const burger = document.querySelector('.hamburger');
      const lines  = burger.querySelectorAll('span');

      burger.addEventListener('click', () => {
        const open = drawer.classList.toggle('open');
        burger.setAttribute('aria-expanded', open);
        lines.forEach((l,i) => {
          l.style.transform = open
            ? ['rotate(45deg) translateY(6px)','scale(0)','rotate(-45deg) translateY(-6px)'][i]
            : '';
        });
      });
      // 외부 클릭·ESC 닫기 로직 생략 가능
    }
  </script>
</body>
</html>
