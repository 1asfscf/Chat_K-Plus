<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>OTT 다시보기 – 티빙 스타일</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    /* ─── Reset & 공통 ─── */
    * { margin:0; padding:0; box-sizing:border-box; }
    html, body { width:100%; background:#000; color:#fff; font-family:'Noto Sans KR',sans-serif; overflow-x:hidden; }
    a, button { background:none; border:none; cursor:pointer; }

    /* ─── 애니메이션 정의 ─── */
    @keyframes fadeUp   { from{opacity:0;transform:translateY(20px)} to{opacity:1;transform:translateY(0)} }
    @keyframes slideDown{ from{opacity:0;transform:translateY(-100%)} to{opacity:1;transform:translateY(0)} }

    /* ─── 헤더 ─── */
    header { position:absolute; top:0; left:0; width:100%; z-index:20; }

    /* PC 전용 헤더 */
    .header-desktop {
      display:flex; align-items:center; padding:16px 5%;
      animation: fadeUp .6s ease-out;
    }
    .header-desktop .logo-text { font-size:32px; font-weight:700; letter-spacing:-1px; }
    .header-desktop nav {
      margin-left:40px; display:flex; gap:24px;
      font-size:14px; font-weight:500;
      overflow-x:auto; scroll-snap-type:x mandatory;
    }
    .header-desktop nav a {
      flex-shrink:0; padding-bottom:4px; color:#fff; text-decoration:none;
      border-bottom:2px solid transparent; transition:.2s; scroll-snap-align:start;
    }
    .header-desktop nav a:hover { color:#e60012; }
    .header-desktop nav a.active { color:#e60012; border-color:#e60012; }

    .header-desktop .header-actions {
      margin-left:auto; display:flex; gap:20px;
    }
    .header-desktop .icon svg { width:20px; height:20px; fill:#fff; transition:fill .2s; }
    .header-desktop .icon:hover svg { fill:#e60012; }
    .header-desktop .profile img { width:32px; height:32px; border-radius:50%; }

    /* 모바일 전용 헤더 */
    .header-mobile {
      display:none; /* 기본 숨김 */
      justify-content:space-between; align-items:center;
      padding:10px 5%; background:rgba(0,0,0,0.8);
      animation: slideDown .4s ease-out;
    }
    .header-mobile .logo-text { font-size:24px; font-weight:700; }
    .header-mobile .mobile-actions { display:flex; gap:16px; align-items:center; }
    .header-mobile .mobile-actions button { display:flex; align-items:center; justify-content:center; }
    .header-mobile .mobile-actions .icon svg { width:24px; height:24px; fill:#fff; transition:fill .2s; }
    .header-mobile .mobile-actions .icon:hover svg { fill:#e60012; }

    /* ─── 배너 / 섹션 / 슬라이더 등 나머지 기존 스타일 유지 ─── */
    .banner { /* ...기존 fadeUp 애니메이션 포함... */ }
    .section, .slider, .slide, .arrow { /* ...생략... */ }

    /* ─── 반응형 ─── */
    @media (max-width:768px) {
      .header-desktop { display:none; }
      .header-mobile  { display:flex; }
      /* 배너, 슬라이더, 폰트, 패딩 등 모바일용 크기로 조정 */
      .banner { margin-top:56px; height:50vh; }
      .banner h1 { font-size:32px; }
      .banner p.tagline { font-size:14px; margin-bottom:16px; }
      .banner .btn { padding:8px 20px; font-size:14px; }

      .section { padding:32px 5%; }
      .section h2 { font-size:22px; margin-bottom:16px; }

      .slider-track { gap:12px; padding-bottom:6px; }
      .slide { flex:0 0 150px; }
      .slide .title { margin-top:6px; font-size:14px; }

      .arrow { width:30px; height:30px; }
      .arrow svg { width:16px; height:16px; }
    }
  </style>
</head>
<body>

  <header>
    <!-- PC 헤더 -->
    <div class="header-desktop">
      <div class="logo-text">TVING</div>
      <nav>
        <a href="#">LIVE</a>
        <a href="#" class="active">다시보기</a>
        <a href="#">테마</a>
        <a href="#">예능</a>
        <a href="#">드라마</a>
        <a href="#">영화</a>
        <a href="#">키즈</a>
      </nav>
      <div class="header-actions">
        <button class="icon search"><!-- svg --></button>
        <button class="icon bookmark"><!-- svg --></button>
        <button class="profile"><img src="img/profile.jpg" alt="프로필"/></button>
      </div>
    </div>

    <!-- 모바일 헤더 -->
    <div class="header-mobile">
      <div class="logo-text">TVING</div>
      <div class="mobile-actions">
        <button class="icon community" aria-label="커뮤니티"><!-- 커뮤니티 svg --></button>
        <button class="icon menu" aria-label="메뉴"><!-- 햄버거 svg --></button>
      </div>
    </div>
  </header>

  <!-- 나머지 배너, 섹션, 슬라이더, 스크립트 등 기존 코드 그대로 -->
  <section class="banner">…</section>
  <section class="section">…</section>
  <script>/* 슬라이더 스크롤 & 페이드업 JS (기존) */</script>
</body>
</html>
