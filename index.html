<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>Spark Chat v6</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <!-- PC 사이드바 -->
    <aside class="sidebar">
      <div class="logo">🔥 Spark</div>
      <button class="new-chat" id="newChatBtn">+ 새 채팅</button>
      <div class="history" id="history"></div>
    </aside>

    <!-- 메인 채팅 영역 -->
    <main class="chat-wrap">
      <header class="chat-header">
        <button class="menu-btn" id="menuBtn">☰</button>
        <h1>Spark</h1>
        <button class="theme-toggle" id="themeToggle">라이트</button>
      </header>

      <!-- V1 예시 화면 - 첫 진입시 노출 -->
      <div class="welcome-screen" id="welcomeScreen">
        <div class="welcome-logo">🔥</div>
        <div class="logo">🔥 Chat K Plus</div>
        <h1>Chat K Plus</h1>
<h2 class="welcome-title" id="welcomeTitle">이용자, Chat K Plus 켜졌다</h2>
        
        <div class="example-grid">
          <div class="example-card" data-prompt="5.18 광주민주화운동 왜곡 사례 5가지 알려줘">
            <div class="icon">📚</div>
            <div class="title">역사 팩트체크</div>
            <div class="desc">5.18 왜곡 패턴 분석해줘</div>
          </div>
          <div class="example-card" data-prompt="깃허브 페이지에서 CSS 깨지는 이유랑 해결법">
            <div class="icon">💻</div>
            <div class="title">개발 디버깅</div>
            <div class="desc">CSS 정렬 버그 잡아줘</div>
          </div>
          <div class="example-card" data-prompt="아이폰 12 Pro에서 클릭 안 되는 이유">
            <div class="icon">📱</div>
            <div class="title">iOS 호환성</div>
            <div class="desc">사파리 터치 버그 해결</div>
          </div>
          <div class="example-card" data-prompt="GPU 덜 먹는 글래스모피즘 CSS 코드 짜줘">
            <div class="icon">⚡</div>
            <div class="title">성능 최적화</div>
            <div class="desc">60fps 나오는 UI 만들어줘</div>
          </div>
        </div>
      </div>

      <!-- 실제 채팅 리스트 - 비워둬야 웰컴화면 뜸 -->
      <div class="chat-list" id="chatList"></div>

      <footer class="input-area">
        <textarea 
          id="userInput" 
          placeholder="Spark에게 물어보세요..." 
          rows="1"></textarea>
        <button id="sendBtn">전송</button>
      </footer>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
