<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>티빙</title>

<!-- 폰트 -->
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">

<style>
/* ─────────────── 변수 • 기본 ─────────────── */
:root{
  --clr-bg:#0a0a0a;
  --clr-primary:#e50914;
  --clr-text:#eee;
  --header-h:56px;
  --nav-gap:30px;
}
@media (max-width:1024px){:root{--nav-gap:18px}}
@media (max-width:600px){:root{--header-h:50px}}

*,
*::before,
*::after{box-sizing:border-box;margin:0;padding:0}

body{
  background:var(--clr-bg);
  color:var(--clr-text);
  font-family:'Noto Sans KR',sans-serif;
  overflow-x:hidden;
}

/* ─────────────── 헤더 ─────────────── */
header{
  position:fixed;top:0;left:0;right:0;
  height:var(--header-h);
  display:flex;align-items:center;gap:40px;
  padding:0 20px 0 32px;
  background:#000;border-bottom:1px solid #222;
  z-index:1000;
}
.logo{
  font:900 28px/1 'Noto Sans KR';
  letter-spacing:4px;
  color:var(--clr-primary);
  user-select:none;
}
.pc-nav{
  display:flex;gap:var(--nav-gap);flex:1;
}
.pc-nav a{
  font:600 16px/1 'Noto Sans KR';
  color:var(--clr-text);
  position:relative;
  padding:8px 0;
  transition:color .3s;
}
.pc-nav a:hover,
.pc-nav a.active{color:var(--clr-primary)}
.pc-nav a.active::after{
  content:'';
  position:absolute;bottom:-6px;left:0;
  width:100%;height:3px;
  background:var(--clr-primary);border-radius:2px;
}

/* ── 햄버거 (모바일) ── */
.hamburger{
  display:none;background:none;border:0;cursor:pointer;padding:8px;
}
.hamburger span{
  display:block;width:24px;height:2px;
  background:#fff;margin:5px 0;transition:.3s;
}

/* ── 모바일 드로어 ── */
.mobile-nav-drawer{
  position:fixed;top:0;bottom:0;right:0;
  width:260px;max-width:80%;
  background:#111;
  transform:translateX(100%);
  transition:transform .35s ease;
  display:flex;flex-direction:column;
  padding:var(--header-h) 24px 24px;
  overflow-y:auto;z-index:999;
}
.mobile-nav-drawer a{
  color:#fff;font:600 1rem/2 'Noto Sans KR';
}
.mobile-nav-drawer.open{transform:translateX(0)}

/* ─────────────── 본문 ─────────────── */
main{
  padding:calc(var(--header-h) + 16px) 40px 40px;
  max-width:1280px;margin:0 auto;
}
.section-title{
  font:700 20px/1 'Noto Sans KR';
  margin-bottom:20px;
}

.top20-list{
  display:flex;gap:16px;
  overflow-x:auto;scroll-behavior:smooth;
  padding-bottom:14px;
}
.top20-list::-webkit-scrollbar{display:none}
.top20-item{
  position:relative;flex:0 0 140px;
  cursor:pointer;border-radius:12px;
  overflow:hidden;
  transition:transform .3s,box-shadow .3s;
}
.top20-item img{
  width:100%;aspect-ratio:2/3;object-fit:cover;display:block;
}
.top20-item:hover{
  transform:scale(1.05);
  box-shadow:0 0 18px var(--clr-primary);
}
.rank{
  position:absolute;top:12px;left:12px;
  font:900 32px/1 'Noto Sans KR';
  color:#fff;text-shadow:0 0 6px rgba(0,0,0,.8);
}
.label{
  position:absolute;top:12px;right:12px;
  padding:3px 8px;font:700 12px/1 'Noto Sans KR';
  border-radius:4px;color:#fff;background:var(--clr-primary);
}
.label.age{background:#ff3b3b;right:auto;left:12px}
.label.only{background:#00a8ff}

/* ─────────────── 하단 메뉴바 (모바일) ─────────────── */
.mobile-bottom-nav{
  position:fixed;bottom:0;left:0;right:0;height:56px;
  background:#111;border-top:1px solid #222;
  display:none;justify-content:space-around;align-items:center;
  padding-bottom:env(safe-area-inset-bottom);
  z-index:10000;
}
.bottom-nav-btn{
  background:none;border:0;color:#888;
  font-size:.75rem;display:flex;flex-direction:column;
  align-items:center;cursor:pointer;transition:color .3s;
}
.bottom-nav-btn svg{margin-bottom:2px}
.bottom-nav-btn.active,
.bottom-nav-btn:hover{color:var(--clr-primary)}

/* ─────────────── 반응형 ─────────────── */
@media (max-width:1024px){
  main{padding:calc(var(--header-h) + 12px) 20px 30px}
  .top20-item{flex-basis:120px}
  .rank{font-size:26px}
}
@media (max-width:768px){
  .pc-nav{display:none}
  .hamburger{display:block}
}
@media (max-width:600px){
  main{padding:calc(var(--header-h) + 12px) 16px calc(56px + env(safe-area-inset-bottom) + 12px)}
  .top20-item{flex-basis:110px}
  .rank{font-size:22px}
  .mobile-bottom-nav{display:flex}
}
</style>
</head>

<body>
<!-- ─────────────── 헤더 ─────────────── -->
<header>
  <button class="hamburger" aria-label="메뉴 열기" aria-expanded="false">
    <span></span><span></span><span></span>
  </button>

  <div class="logo" aria-label="티빙 로고">TVING</div>

  <nav class="pc-nav" role="navigation" aria-label="주요 메뉴">
    <a href="#" class="active">실시간</a>
    <a href="#">TV프로그램</a>
    <a href="#">영화</a>
    <a href="#">파라운트+</a>
    <a href="#">키즈</a>
  </nav>
</header>

<!-- ─────────────── 모바일 메뉴 드로어 ─────────────── -->
<nav class="mobile-nav-drawer" aria-label="모바일 메뉴">
  <a href="#" class="active">실시간</a>
  <a href="#">TV프로그램</a>
  <a href="#">영화</a>
  <a href="#">파라운트+</a>
  <a href="#">키즈</a>
</nav>

<!-- ─────────────── 본문 ─────────────── -->
<main>
  <section class="top20" aria-label="오늘의 티빙 TOP 20">
    <h2 class="section-title">오늘의 티빙 TOP 20</h2>
    <div class="top20-list">
      <div class="top20-item">
        <span class="rank">1</span>
        <img src="https://img.tving.com/uploaded_images/contents/2024/07/20240724123456_0.jpg" alt="대탈출" loading="lazy" decoding="async"/>
        <span class="label new">NEW</span>
        <span class="label age">18+</span>
      </div>
      <div class="top20-item">
        <span class="rank">2</span>
        <img src="https://img.tving.com/uploaded_images/contents/2024/07/20240724123556_0.jpg" alt="눈물의 여왕" loading="lazy" decoding="async"/>
      </div>
      <div class="top20-item">
        <span class="rank">3</span>
        <img src="https://img.tving.com/uploaded_images/contents/2024/07/20240724123656_0.jpg" alt="웨딩 임파서블" loading="lazy" decoding="async"/>
        <span class="label only">ONLY</span>
      </div>
      <!-- 필요에 따라 추가 -->
    </div>
  </section>
</main>

<!-- ─────────────── 모바일 하단 메뉴바 ─────────────── -->
<nav class="mobile-bottom-nav" role="navigation" aria-label="모바일 하단 메뉴">
  <button class="bottom-nav-btn active" aria-label="홈">
    <svg width="24" height="24" fill="currentColor" viewBox="0 0 24 24"><path d="M3 9.5L12 3l9 6.5V21a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1V9.5z"/></svg>
    <span>홈</span>
  </button>
  <button class="bottom-nav-btn" aria-label="공개예정">
    <svg width="24" height="24" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2zm1 15h-2v-6h2zm0-8h-2V7h2z"/></svg>
    <span>공개예정</span>
  </button>
  <button class="bottom-nav-btn" aria-label="검색">
    <svg width="24" height="24" fill="currentColor" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <span>검색</span>
  </button>
  <button class="bottom-nav-btn" aria-label="기록">
    <svg width="24" height="24" fill="currentColor" viewBox="0 0 24 24"><path d="M3 3h18v2H3zm0 4h18v2H3zm0 4h18v2H3zm0 4h18v2H3zm0 4h18v2H3z"/></svg>
    <span>기록</span>
  </button>
</nav>

<!-- ─────────────── 스크립트 ─────────────── -->
<script>
const drawer = document.querySelector('.mobile-nav-drawer');
const burger = document.querySelector('.hamburger');
const lines  = burger.querySelectorAll('span');

burger.addEventListener('click', () => {
  const open = drawer.classList.toggle('open');
  burger.setAttribute('aria-expanded', open);
  lines.forEach((l, i) => l.style.transform = open
    ? ['rotate(45deg) translateY(8px)',
       'scale(0)',
       'rotate(-45deg) translateY(-8px)'][i]
    : ''
  );
});
</script>

</body>
</html>
