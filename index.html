<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>OTT 다시보기</title>
  <style>
    body {
      margin: 0;
      background-color: #000;
      font-family: 'Noto Sans KR', sans-serif;
      color: #fff;
    }

    header {
      padding: 20px 30px;
      font-size: 24px;
      font-weight: 700;
      background-color: #111;
      border-bottom: 1px solid #333;
    }

    .container {
      padding: 30px;
    }

    .section-title {
      font-size: 20px;
      margin: 20px 0 10px;
      font-weight: bold;
    }

    .thumbnails {
      display: flex;
      overflow-x: auto;
      gap: 12px;
    }

    .thumbnail {
      min-width: 180px;
      background-color: #222;
      border-radius: 6px;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.3s;
    }

    .thumbnail:hover {
      transform: scale(1.05);
    }

    .thumbnail img {
      width: 100%;
      display: block;
    }

    .thumb-info {
      padding: 10px;
    }

    .thumb-title {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .thumb-meta {
      font-size: 13px;
      color: #aaa;
    }

    ::-webkit-scrollbar {
      height: 8px;
    }

    ::-webkit-scrollbar-track {
      background: #111;
    }

    ::-webkit-scrollbar-thumb {
      background: #444;
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <header>다시보기</header>
  <div class="container">
    <div class="section-title">최신 에피소드</div>
    <div class="thumbnails">
      <div class="thumbnail">
        <img src="https://via.placeholder.com/180x100.png?text=썸네일1" alt="ep1"/>
        <div class="thumb-info">
          <div class="thumb-title">예능 쇼 시즌2 - EP01</div>
          <div class="thumb-meta">2025.06.24 · 72분</div>
        </div>
      </div>
      <div class="thumbnail">
        <img src="https://via.placeholder.com/180x100.png?text=썸네일2" alt="ep2"/>
        <div class="thumb-info">
          <div class="thumb-title">드라마 밤하늘 - EP10</div>
          <div class="thumb-meta">2025.06.21 · 64분</div>
        </div>
      </div>
      <!-- 원하는 만큼 썸네일 추가 -->
    </div>
  </div>
</body>
</html>
