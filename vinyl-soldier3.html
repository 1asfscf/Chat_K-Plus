<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>바이널 솔져</title>
<style>
:root{--bg:#15171b;--gray:#5a6169;--org:#e8742c;--wh:#f2f2f2}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;background:var(--bg);color:var(--wh);font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;overflow:hidden;overscroll-behavior:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
#lay{position:fixed;inset:0;z-index:5;touch-action:none}
.scr{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--bg);transition:opacity .8s ease;gap:14px}
.scr.off{opacity:0;pointer-events:none}
.rec{width:min(32vh,190px);height:min(32vh,190px);border-radius:50%;background:radial-gradient(circle,var(--org) 0 16%,#0c0d10 17% 19%,#1d2026 20% 36%,#0c0d10 37% 39%,#1d2026 40% 58%,#0c0d10 59% 61%,#1d2026 62% 100%);box-shadow:0 0 0 3px #2b2f36,0 10px 40px #000a;animation:sp 3s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
h1{margin:0;font-size:clamp(20px,6vh,38px);letter-spacing:.18em;font-weight:800}
h1 b{color:var(--org)}
.bar{width:min(60vw,360px);height:8px;background:#2b2f36;border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--org);transition:width .3s}
#lt{font-size:13px;color:#aab0b8;min-height:18px;text-align:center;padding:0 20px}
#st{display:none;padding:13px 50px;font-size:18px;font-weight:800;letter-spacing:.22em;background:var(--org);color:#15171b;border:0;border-radius:6px;animation:pl 1.4s ease-in-out infinite}
@keyframes pl{50%{transform:scale(1.05)}}
#rot{position:fixed;inset:0;z-index:50;background:#15171bf5;display:none;align-items:center;justify-content:center;font-size:18px;text-align:center}
#rot.on{display:flex}
.hud{position:fixed;z-index:10;pointer-events:none}
#sc{left:calc(env(safe-area-inset-left) + 16px);top:12px;font-size:13px;font-weight:700;text-shadow:0 1px 3px #000;line-height:1.5}
#am{left:50%;bottom:3vh;transform:translateX(-50%);font-size:18px;font-weight:800;letter-spacing:.08em;text-shadow:0 1px 3px #000}
#am small{color:var(--org);font-size:12px;margin-left:8px}
#cx{left:50%;top:50%;width:18px;height:18px;margin:-9px 0 0 -9px;border:2px solid #f2f2f2cc;border-radius:50%;box-shadow:0 0 2px #000}
#cx:after{content:"";position:absolute;left:6px;top:6px;width:2px;height:2px;background:var(--org)}
#hm{left:50%;top:50%;width:30px;height:30px;margin:-15px 0 0 -15px;opacity:0}
#hm:before,#hm:after{content:"";position:absolute;left:14px;top:0;width:2px;height:30px;background:var(--org);transform:rotate(45deg)}
#hm:after{transform:rotate(-45deg)}
#hm.on{animation:hk .28s ease-out}
@keyframes hk{0%{opacity:1;transform:scale(.7)}100%{opacity:0;transform:scale(1.25)}}
.b{position:fixed;z-index:12;border-radius:50%;border:2px solid #f2f2f2a0;background:#15171b80;color:var(--wh);font-weight:800;display:flex;align-items:center;justify-content:center;touch-action:none;font-size:13px;letter-spacing:.05em}
.b.on{background:var(--org);color:#15171b;border-color:var(--org)}
#bf{width:21vh;height:21vh;right:calc(env(safe-area-inset-right) + 5vw);bottom:9vh;font-size:16px;border-color:var(--org)}
#bj{width:14vh;height:14vh;right:calc(env(safe-area-inset-right) + 7vw);bottom:34vh}
#br{width:12vh;height:12vh;right:calc(env(safe-area-inset-right) + 5vw + 24vh);bottom:10vh}
#bs{width:14vh;height:14vh;left:calc(env(safe-area-inset-left) + 4vw);bottom:40vh}
#gear{width:9vh;height:9vh;right:calc(env(safe-area-inset-right) + 14px);top:10px;font-size:20px}
#jb,#js{position:fixed;z-index:11;border-radius:50%;pointer-events:none;display:none}
#jb{border:2px solid #f2f2f280;background:#15171b40}
#js{background:#f2f2f2a0}
#pn{position:fixed;z-index:40;top:0;bottom:0;right:0;width:min(58vw,440px);background:#15171bee;border-left:2px solid var(--org);padding:14px 18px;overflow-y:auto;-webkit-overflow-scrolling:touch;transform:translateX(105%);transition:transform .35s ease}
#pn.on{transform:none}
#pn h2{margin:0 0 8px;font-size:16px;letter-spacing:.12em}
.row{display:flex;align-items:center;gap:8px;margin:7px 0;font-size:13px}
.row span{width:84px;flex:none}
.row output{width:44px;text-align:right;color:var(--org);font-weight:700;flex:none}
.row input[type=range]{flex:1;min-width:0;accent-color:#e8742c}
.row input[type=checkbox]{width:20px;height:20px;accent-color:#e8742c}
.pb{display:flex;gap:10px;margin-top:12px}
.pb button{flex:1;padding:11px;border:0;border-radius:6px;font-weight:700;font-size:14px;background:#2b2f36;color:var(--wh)}
.pb button.p{background:var(--org);color:#15171b}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="lay"></div>
<div id="hud" style="display:none">
 <div class="hud" id="sc"></div>
 <div class="hud" id="cx"></div>
 <div class="hud" id="hm"></div>
 <div class="hud" id="am"></div>
 <div id="jb"></div><div id="js"></div>
 <div class="b" id="bf">FIRE</div>
 <div class="b" id="bj">JUMP</div>
 <div class="b" id="br">RELOAD</div>
 <div class="b" id="bs">RUN</div>
 <div class="b" id="gear">⚙</div>
</div>
<div id="pn"></div>
<div id="ld" class="scr">
 <div class="rec"></div>
 <h1>VINYL <b>SOLDIER</b></h1>
 <div class="bar"><i id="bi"></i></div>
 <div id="lt">준비 중…</div>
 <button id="st">START</button>
</div>
<div id="rot">기기를 가로로 돌려 주세요 ↻</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
var $=function(i){return document.getElementById(i)};
var DEF={sens:1,gyro:1,ginv:0,gsens:1,fov:75,gx:.26,gy:-.24,gz:-.55};
var S=Object.assign({},DEF);
try{Object.assign(S,JSON.parse(localStorage.getItem('vs3')||'{}'))}catch(e){}
function save(){try{localStorage.setItem('vs3',JSON.stringify(S))}catch(e){}}
var D2R=Math.PI/180;

/* ---------- 상태 ---------- */
var renderer,scene,camera,gun,flash,tex={},boxes=[],boards=[],hitList=[],decals=[];
var started=false,paused=false,gyroOK=false;
var yaw=0,pitch=0,yawT=0,pitchT=0,roll=0,introT=0,camFov=S.fov+28;
var P={x:0,y:0,z:3,vx:0,vz:0,vy:0,on:true},EYE=1.65,R=.35;
var J={x:0,y:0,id:null,ox:0,oy:0},L={id:null,x:0,y:0};
var firing=false,jumpReq=false,sprintOn=false,reloading=false,reloadT=0;
var ammo=30,MAG=30,shots=0,hits=0,lastShot=0,kick=0,flashT=0,bobT=0;

/* ---------- 텍스처 (고정 팔레트: 차콜·콘크리트 회색·주황·흰색) ---------- */
function mk(w,h,fn){var c=document.createElement('canvas');c.width=w;c.height=h;var x=c.getContext('2d');fn(x,w,h);var t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.anisotropy=4;return t}
function grain(x,w,h,n,a){for(var i=0;i<n;i++){var v=(Math.random()*255)|0;x.fillStyle='rgba('+v+','+v+','+v+','+a+')';var s=1+Math.random()*2;x.fillRect(Math.random()*w,Math.random()*h,s,s)}}
function rep(t,a,b){var q=t.clone();q.needsUpdate=true;q.repeat.set(a,b);return q}

var steps=[
['엔진 불러오는 중…',function(){if(!window.THREE)throw 0}],
['콘크리트 바닥 텍스처…',function(){tex.floor=mk(256,256,function(x,w,h){x.fillStyle='#5a6169';x.fillRect(0,0,w,h);grain(x,w,h,3800,.1);for(var i=0;i<7;i++){x.fillStyle='rgba(0,0,0,.05)';x.beginPath();x.arc(Math.random()*w,Math.random()*h,10+Math.random()*34,0,7);x.fill()}x.strokeStyle='#3d4249';x.lineWidth=4;x.strokeRect(0,0,w,h);x.lineWidth=1.5;x.beginPath();x.moveTo(w/2,0);x.lineTo(w/2,h);x.moveTo(0,h/2);x.lineTo(w,h/2);x.stroke()})}],
['벽면 패널 텍스처…',function(){tex.wall=mk(256,256,function(x,w,h){x.fillStyle='#3a3f46';x.fillRect(0,0,w,h);grain(x,w,h,3000,.08);x.strokeStyle='#2a2e34';x.lineWidth=4;for(var i=0;i<=4;i++){x.beginPath();x.moveTo(i*64,0);x.lineTo(i*64,h-30);x.stroke()}x.fillStyle='#6b727a';for(var i=0;i<4;i++)for(var j=0;j<6;j++){x.beginPath();x.arc(i*64+10,16+j*38,2.2,0,7);x.fill();x.beginPath();x.arc(i*64+54,16+j*38,2.2,0,7);x.fill()}var by=h-28;x.save();x.beginPath();x.rect(0,by,w,28);x.clip();x.fillStyle='#15171b';x.fillRect(0,by,w,28);x.fillStyle='#e8742c';for(var i=-2;i<12;i++){x.beginPath();x.moveTo(i*28,by+28);x.lineTo(i*28+14,by+28);x.lineTo(i*28+42,by);x.lineTo(i*28+28,by);x.fill()}x.restore()})}],
['보급 상자 텍스처…',function(){tex.crate=mk(128,128,function(x,w,h){x.fillStyle='#e8742c';x.fillRect(0,0,w,h);grain(x,w,h,900,.12);x.strokeStyle='#a84d17';x.lineWidth=10;x.strokeRect(5,5,w-10,h-10);x.lineWidth=6;x.beginPath();x.moveTo(8,8);x.lineTo(w-8,h-8);x.moveTo(w-8,8);x.lineTo(8,h-8);x.stroke();x.fillStyle='#f2f2f2';x.font='bold 22px sans-serif';x.textAlign='center';x.fillText('VS',w/2,h/2+8)})}],
['표적 텍스처…',function(){tex.target=mk(256,256,function(x,w,h){x.fillStyle='#f2f2f2';x.fillRect(0,0,w,h);var rr=[124,100,76,52,28],cc=['#15171b','#e8742c','#f2f2f2','#e8742c','#15171b'];for(var i=0;i<5;i++){x.fillStyle=cc[i];x.beginPath();x.arc(128,128,rr[i],0,7);x.fill()}});tex.target.wrapS=tex.target.wrapT=THREE.ClampToEdgeWrapping;
tex.mark=function(t){return mk(128,64,function(x,w,h){x.fillStyle='#f2f2f2';x.font='bold 40px sans-serif';x.textAlign='center';x.fillText(t,w/2,46)})}}],
['훈련장 맵 구성 중…',buildMap],
['총기 모델 조립 중…',buildGun],
['사운드 준비 중…',function(){}]
];

/* ---------- 맵 ---------- */
function buildMap(){
 renderer=new THREE.WebGLRenderer({canvas:$('c'),antialias:true});
 renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
 scene=new THREE.Scene();scene.background=new THREE.Color(0x15171b);scene.fog=new THREE.Fog(0x15171b,22,62);
 camera=new THREE.PerspectiveCamera(S.fov+28,1,.05,120);camera.rotation.order='YXZ';scene.add(camera);
 scene.add(new THREE.HemisphereLight(0xdfe6f0,0x20242a,.95));
 var dl=new THREE.DirectionalLight(0xffffff,.55);dl.position.set(3,8,5);scene.add(dl);
 var L=function(m){return new THREE.MeshLambertMaterial(m)};
 function solid(m){hitList.push(m);scene.add(m)}
 var fl=new THREE.Mesh(new THREE.PlaneGeometry(16,56),L({map:rep(tex.floor,4,14)}));fl.rotation.x=-Math.PI/2;fl.position.set(0,0,-22);solid(fl);
 var cl=new THREE.Mesh(new THREE.PlaneGeometry(16,56),L({color:0x20242a}));cl.rotation.x=Math.PI/2;cl.position.set(0,5,-22);solid(cl);
 function wall(w,x,z,ry){var m=new THREE.Mesh(new THREE.PlaneGeometry(w,5),L({map:rep(tex.wall,w/4,1)}));m.position.set(x,2.5,z);m.rotation.y=ry;solid(m)}
 wall(56,-8,-22,Math.PI/2);wall(56,8,-22,-Math.PI/2);wall(16,0,-50,0);wall(16,0,6,Math.PI);
 var lm=new THREE.MeshBasicMaterial({color:0xf2f2f2});
 [-5,0,5].forEach(function(x){var s=new THREE.Mesh(new THREE.BoxGeometry(.4,.05,52),lm);s.position.set(x,4.95,-22);scene.add(s)});
 /* 거리 표시 */
 [10,20,30,40].forEach(function(d){var st=new THREE.Mesh(new THREE.PlaneGeometry(16,.22),new THREE.MeshBasicMaterial({color:0xe8742c}));st.rotation.x=-Math.PI/2;st.position.set(0,.012,3-d);scene.add(st);
  var lb=new THREE.Mesh(new THREE.PlaneGeometry(1.4,.7),new THREE.MeshBasicMaterial({map:tex.mark(d+'m'),transparent:true,depthWrite:false}));lb.rotation.x=-Math.PI/2;lb.position.set(-6.6,.014,3-d+.6);scene.add(lb)});
 /* 사격 카운터 */
 [-5.5,0,5.5].forEach(function(x){var b=new THREE.Mesh(new THREE.BoxGeometry(4,.95,.5),L({map:rep(tex.floor,1,.25)}));b.position.set(x,.475,-1);solid(b);addBox(x,-1,4,.5,.95);
  var tp=new THREE.Mesh(new THREE.BoxGeometry(4.04,.06,.54),L({color:0xe8742c}));tp.position.set(x,.98,-1);scene.add(tp)});
 /* 상자 */
 [[-4,-12,1.2],[3.5,-16,1.2],[-2.5,-22,1.3],[-2.5,-22,1.3,1.3],[5,-27,1.4],[-5.5,-31,1.6],[1,-37,1.3],[1,-37,1.3,1.3]].forEach(function(c){var s=c[2],y=c[3]||0;var m=new THREE.Mesh(new THREE.BoxGeometry(s,s,s),L({map:tex.crate}));m.position.set(c[0],y+s/2,c[1]);solid(m);addBox(c[0],c[1],s,s,y+s)});
 /* 표적 */
 [[-4,-9],[4,-9],[0,-15],[-6,-21],[6,-21],[-2,-28],[3,-28],[-5,-35],[5,-35],[0,-43]].forEach(function(p){addTarget(p[0],p[1],null)});
 [[-14.5,0,5,1.1,0],[-25,0,6,1.6,1.7],[-39,0,6,2.2,3.1]].forEach(function(m){addTarget(m[1],m[0],{cx:m[1],amp:m[2],sp:m[3],ph:m[4]})});
 hitList=hitList.concat(boards);
 resize();
}
function addBox(x,z,w,d,h){boxes.push({x0:x-w/2,x1:x+w/2,z0:z-d/2,z1:z+d/2,h:h})}
function addTarget(x,z,mv){
 var g=new THREE.Group();g.position.set(x,0,z);
 var post=new THREE.Mesh(new THREE.CylinderGeometry(.04,.04,1.2,8),new THREE.MeshLambertMaterial({color:0x2b2f36}));post.position.y=.6;g.add(post);
 var edge=new THREE.MeshLambertMaterial({color:0x15171b});
 var face=new THREE.MeshLambertMaterial({map:tex.target});
 var bd=new THREE.Mesh(new THREE.CylinderGeometry(.46,.46,.06,32),[edge,face,face]);bd.rotation.x=Math.PI/2;bd.position.y=1.5;
 bd.userData={board:true,g:g};g.userData={down:false,downT:0,mv:mv};g.add(bd);scene.add(g);boards.push(bd);
}

/* ---------- 총기 ---------- */
function buildGun(){
 gun=new THREE.Group();
 var m1=new THREE.MeshLambertMaterial({color:0x2b2f36}),m2=new THREE.MeshLambertMaterial({color:0x5a6169}),m3=new THREE.MeshLambertMaterial({color:0xe8742c});
 function add(g,m,x,y,z){var o=new THREE.Mesh(g,m);o.position.set(x,y,z);gun.add(o);return o}
 add(new THREE.BoxGeometry(.07,.1,.42),m1,0,0,0);
 add(new THREE.BoxGeometry(.055,.065,.3),m2,0,.025,-.34);
 add(new THREE.CylinderGeometry(.013,.013,.3,10),m2,0,.03,-.62).rotation.x=Math.PI/2;
 add(new THREE.BoxGeometry(.06,.14,.07),m1,0,-.11,.1).rotation.x=.25;
 add(new THREE.BoxGeometry(.045,.16,.075),m1,0,-.12,-.1);
 add(new THREE.BoxGeometry(.074,.012,.2),m3,0,.056,-.02);
 add(new THREE.BoxGeometry(.012,.03,.012),m3,0,.08,.14);
 add(new THREE.BoxGeometry(.012,.04,.012),m3,0,.065,-.7);
 flash=new THREE.Mesh(new THREE.PlaneGeometry(.2,.2),new THREE.MeshBasicMaterial({color:0xe8742c,transparent:true,opacity:.9,depthWrite:false}));
 flash.position.set(0,.03,-.8);flash.visible=false;gun.add(flash);
 camera.add(gun);
}

/* ---------- 사운드 ---------- */
var AC,NB;
function audioInit(){try{AC=new (window.AudioContext||window.webkitAudioContext)();var l=(AC.sampleRate*.25)|0;NB=AC.createBuffer(1,l,AC.sampleRate);var d=NB.getChannelData(0);for(var i=0;i<l;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/l,3)}catch(e){AC=null}}
function sfxShot(){if(!AC)return;var s=AC.createBufferSource();s.buffer=NB;var f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=2400;var g=AC.createGain();g.gain.value=.32;s.connect(f);f.connect(g);g.connect(AC.destination);s.start();tone(150,.1,.4,40)}
function tone(f0,dur,vol,f1){if(!AC)return;var o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime;o.frequency.setValueAtTime(f0,t);if(f1)o.frequency.exponentialRampToValueAtTime(f1,t+dur);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(g);g.connect(AC.destination);o.start();o.stop(t+dur+.02)}

/* ---------- 전투 ---------- */
var rc;
function tryFire(t){
 if(reloading)return;
 if(ammo<=0){reload();return}
 if(t-lastShot<.095)return;
 lastShot=t;ammo--;shots++;kick=1;flashT=.05;sfxShot();
 pitchT+=.006;yawT+=(Math.random()-.5)*.005;
 rc=rc||new THREE.Raycaster();camera.updateMatrixWorld(true);
 rc.setFromCamera({x:0,y:0},camera);
 var hs=rc.intersectObjects(hitList,false),h=null;
 for(var i=0;i<hs.length;i++){var o=hs[i].object;if(o.userData.board&&o.userData.g.userData.down)continue;h=hs[i];break}
 if(h){
  var o=h.object;
  if(o.userData.board){var g=o.userData.g;g.userData.down=true;g.userData.downT=0;hits++;var hm=$('hm');hm.classList.remove('on');void hm.offsetWidth;hm.classList.add('on');tone(1000,.09,.25)}
  else{var n=h.face.normal.clone().transformDirection(o.matrixWorld);var d=new THREE.Mesh(new THREE.CircleGeometry(.045,8),new THREE.MeshBasicMaterial({color:0x0a0a0a,transparent:true,opacity:.7,depthWrite:false,polygonOffset:true,polygonOffsetFactor:-2}));d.position.copy(h.point).addScaledVector(n,.01);d.lookAt(h.point.clone().add(n));scene.add(d);decals.push(d);if(decals.length>40){var q=decals.shift();scene.remove(q)}}
 }
 if(ammo===0)reload();
}
function reload(){if(reloading||ammo===MAG)return;reloading=true;reloadT=0;tone(500,.05,.2);}

/* ---------- 업데이트 ---------- */
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function update(dt,t){
 if(!paused){
  introT=Math.min(1.6,introT+dt);
  var k=1-Math.exp(-28*dt);pitchT=clamp(pitchT,-1.4,1.4);
  yaw+=(yawT-yaw)*k;pitch+=(pitchT-pitch)*k;
  var jm=Math.min(1,Math.hypot(J.x,J.y)),sp=0,tx=0,tz=0;
  if(jm>.08){var fx=-J.y,rx=J.x,dx=-Math.sin(yaw)*fx+Math.cos(yaw)*rx,dz=-Math.cos(yaw)*fx-Math.sin(yaw)*rx,ln=Math.hypot(dx,dz)||1;sp=(sprintOn?8.6:4.8)*jm;tx=dx/ln*sp;tz=dz/ln*sp}
  var ac=1-Math.exp(-(P.on?14:3)*dt);P.vx+=(tx-P.vx)*ac;P.vz+=(tz-P.vz)*ac;
  if(jumpReq&&P.on){P.vy=5.6;P.on=false}jumpReq=false;
  P.vy-=15*dt;
  move('x',P.vx*dt);move('z',P.vz*dt);
  P.y+=P.vy*dt;
  var gy=0;for(var i=0;i<boxes.length;i++){var b=boxes[i];if(P.y>=b.h-.15&&P.x>b.x0-R&&P.x<b.x1+R&&P.z>b.z0-R&&P.z<b.z1+R)gy=Math.max(gy,b.h)}
  if(P.y<=gy&&P.vy<=0){P.y=gy;P.vy=0;P.on=true}else if(P.y>gy+.02)P.on=false;
  var moving=jm>.08&&P.on;
  bobT+=(moving?(sprintOn?13:9):0)*dt;
  P.bx=moving?Math.cos(bobT)*.018:0;P.by=moving?Math.abs(Math.sin(bobT))*.045:0;
  roll+=(-J.x*.018-roll)*(1-Math.exp(-8*dt));
  if(firing)tryFire(t);
  if(reloading){reloadT+=dt;if(reloadT>=1.3){reloading=false;ammo=MAG;tone(380,.06,.2)}}
  kick*=Math.exp(-16*dt);if(flashT>0){flashT-=dt;flash.visible=flashT>0}else flash.visible=false;
  for(var i=0;i<boards.length;i++){var g=boards[i].userData.g,u=g.userData;
   if(u.down){u.downT+=dt;var a=u.downT<.25?u.downT/.25:1;if(u.downT>2.5)a=1-Math.min(1,(u.downT-2.5)/.3);g.rotation.x=-a*1.45;if(u.downT>2.8){u.down=false;g.rotation.x=0}}
   else if(u.mv){g.position.x=u.mv.cx+Math.sin(t*u.mv.sp+u.mv.ph)*u.mv.amp}}
  if(!sprintOn&&$('bs').classList.contains('on'))$('bs').classList.remove('on');
  hud();
 }
 var e=1-Math.pow(1-introT/1.6,3);
 camera.position.set(P.x+(P.bx||0),P.y+EYE+(P.by||0)+(1-e)*.6,P.z);
 camera.rotation.set(pitch,yaw+(1-e)*.9,roll);
 var ft=S.fov+(sprintOn&&Math.hypot(P.vx,P.vz)>5?7:0)+(1-e)*28;camFov+=(ft-camFov)*(1-Math.exp(-8*dt));
 if(Math.abs(camera.fov-camFov)>.02){camera.fov=camFov;camera.updateProjectionMatrix()}
 var sy=clamp(-(yawT-yaw)*.8,-.12,.12),sx=clamp(-(pitchT-pitch)*.8,-.12,.12);
 gun.position.set(S.gx+Math.cos(bobT)*.006,S.gy+(P.by||0)*.25+(reloading?-.08:0),S.gz+kick*.05);
 gun.rotation.set(sx+kick*.05+(reloading?-.5:0),sy,0);
}
function move(ax,d){
 P[ax]+=d;
 for(var i=0;i<boxes.length;i++){var b=boxes[i];if(P.y>=b.h-.15)continue;
  if(P.x>b.x0-R&&P.x<b.x1+R&&P.z>b.z0-R&&P.z<b.z1+R){if(ax==='x')P.x=d>0?b.x0-R:b.x1+R;else P.z=d>0?b.z0-R:b.z1+R}}
 P.x=clamp(P.x,-8+R,8-R);P.z=clamp(P.z,-50+R,6-R);
}
function hud(){
 $('sc').innerHTML='명중 '+hits+'<br>정확도 '+(shots?Math.round(hits/shots*100)+'%':'--');
 $('am').innerHTML=(reloading?'재장전 중…':ammo+' / ∞')+'<small>'+(sprintOn?'RUN':'WALK')+'</small>';
}

/* ---------- 입력 ---------- */
var lay=$('lay');
function showJoy(on){$('jb').style.display=$('js').style.display=on?'block':'none'}
function joyMove(t){
 var rad=Math.min(innerHeight*.11,70),dx=t.clientX-J.ox,dy=t.clientY-J.oy,m=Math.hypot(dx,dy);
 if(m>rad){dx*=rad/m;dy*=rad/m}
 J.x=dx/rad;J.y=dy/rad;
 var bs=rad*2,jb=$('jb'),js=$('js'),ss=rad*.9;
 jb.style.cssText='display:block;width:'+bs+'px;height:'+bs+'px;left:'+(J.ox-rad)+'px;top:'+(J.oy-rad)+'px';
 js.style.cssText='display:block;width:'+ss+'px;height:'+ss+'px;left:'+(J.ox+dx-ss/2)+'px;top:'+(J.oy+dy-ss/2)+'px';
}
lay.addEventListener('touchstart',function(e){e.preventDefault();if(!started||paused)return;
 for(var i=0;i<e.changedTouches.length;i++){var t=e.changedTouches[i];
  if(t.clientX<innerWidth*.45){if(J.id===null){J.id=t.identifier;J.ox=t.clientX;J.oy=t.clientY;joyMove(t)}}
  else if(L.id===null){L.id=t.identifier;L.x=t.clientX;L.y=t.clientY}}},{passive:false});
lay.addEventListener('touchmove',function(e){e.preventDefault();if(!started||paused)return;
 for(var i=0;i<e.changedTouches.length;i++){var t=e.changedTouches[i];
  if(t.identifier===J.id)joyMove(t);
  else if(t.identifier===L.id){var s=.0048*S.sens;yawT-=(t.clientX-L.x)*s;pitchT-=(t.clientY-L.y)*s;L.x=t.clientX;L.y=t.clientY}}},{passive:false});
function endT(e){for(var i=0;i<e.changedTouches.length;i++){var t=e.changedTouches[i];
 if(t.identifier===J.id){J.id=null;J.x=J.y=0;showJoy(false);sprintOn=false}
 if(t.identifier===L.id)L.id=null}}
lay.addEventListener('touchend',endT);lay.addEventListener('touchcancel',endT);
function bind(id,dn,up){var el=$(id);el.addEventListener('touchstart',function(e){e.preventDefault();e.stopPropagation();dn()},{passive:false});
 ['touchend','touchcancel'].forEach(function(n){el.addEventListener(n,function(e){e.preventDefault();if(up)up()},{passive:false})})}
bind('bf',function(){if(paused)return;firing=true;$('bf').classList.add('on')},function(){firing=false;$('bf').classList.remove('on')});
bind('bj',function(){if(!paused)jumpReq=true});
bind('br',function(){if(!paused)reload()});
bind('bs',function(){if(paused)return;sprintOn=!sprintOn;$('bs').classList.toggle('on',sprintOn)});
bind('gear',function(){setPause(!paused)});
document.addEventListener('gesturestart',function(e){e.preventDefault()});

/* 자이로 */
var lastM=0;
function onMotion(e){
 if(!started||paused||!S.gyro)return;var r=e.rotationRate;if(!r)return;
 var n=performance.now(),dt=Math.min(.05,(n-lastM)/1000);lastM=n;if(dt<=0)return;
 var ang=(screen.orientation&&screen.orientation.angle!=null)?screen.orientation.angle:(window.orientation||0),s;
 if(ang===90)s=1;else if(ang===270||ang===-90)s=-1;else return;
 if(S.ginv)s=-s;
 var by=r.beta||0,gp=r.gamma||0;if(Math.abs(by)<.6)by=0;if(Math.abs(gp)<.6)gp=0;
 yawT+=s*by*D2R*dt*S.gsens;pitchT+=s*(-gp)*D2R*dt*S.gsens;
}

/* ---------- 설정창 ---------- */
var ROWS=[['sens','시점 감도',.3,2.5,.05],['gsens','자이로 감도',.3,3,.05],['fov','시야각',60,100,1],['gx','총기 좌우',0,.5,.01],['gy','총기 상하',-.45,-.1,.01],['gz','총기 앞뒤',-.9,-.3,.01]];
function buildPanel(){
 var h='<h2>설정</h2><div class="row"><span>자이로 사용</span><input type="checkbox" id="k_gyro"></div><div class="row"><span>자이로 반전</span><input type="checkbox" id="k_ginv"></div>';
 ROWS.forEach(function(r){h+='<div class="row"><span>'+r[1]+'</span><input type="range" id="k_'+r[0]+'" min="'+r[2]+'" max="'+r[3]+'" step="'+r[4]+'"><output id="o_'+r[0]+'"></output></div>'});
 h+='<div class="pb"><button id="k_def">기본값</button><button class="p" id="k_ok">계속하기</button></div>';
 $('pn').innerHTML=h;sync();
 ROWS.forEach(function(r){$('k_'+r[0]).addEventListener('input',function(e){S[r[0]]=parseFloat(e.target.value);$('o_'+r[0]).textContent=S[r[0]];save()})});
 $('k_gyro').addEventListener('change',function(e){S.gyro=e.target.checked?1:0;save()});
 $('k_ginv').addEventListener('change',function(e){S.ginv=e.target.checked?1:0;save()});
 $('k_def').addEventListener('click',function(){Object.assign(S,DEF);save();sync()});
 $('k_ok').addEventListener('click',function(){setPause(false)});
}
function sync(){ROWS.forEach(function(r){$('k_'+r[0]).value=S[r[0]];$('o_'+r[0]).textContent=S[r[0]]});$('k_gyro').checked=!!S.gyro;$('k_ginv').checked=!!S.ginv}
function setPause(p){paused=p;$('pn').classList.toggle('on',p);if(p){firing=false;J.id=null;J.x=J.y=0;L.id=null;showJoy(false);$('bf').classList.remove('on')}}

/* ---------- 시작 ---------- */
function resize(){
 if(renderer){renderer.setSize(innerWidth,innerHeight,false);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix()}
 $('rot').classList.toggle('on',innerHeight>innerWidth);
}
window.addEventListener('resize',resize);window.addEventListener('orientationchange',function(){setTimeout(resize,200)});
var last=performance.now();
function loop(now){requestAnimationFrame(loop);var dt=Math.min(.05,(now-last)/1000);last=now;if(started)update(dt,now/1000);renderer.render(scene,camera)}
async function start(){
 audioInit();
 try{if(window.DeviceMotionEvent&&typeof DeviceMotionEvent.requestPermission==='function'){gyroOK=(await DeviceMotionEvent.requestPermission())==='granted'}else gyroOK=!!window.DeviceMotionEvent}catch(e){gyroOK=false}
 if(!gyroOK)S.gyro=0;
 window.addEventListener('devicemotion',onMotion);
 try{var el=document.documentElement;if(el.requestFullscreen)await el.requestFullscreen();else if(el.webkitRequestFullscreen)el.webkitRequestFullscreen()}catch(e){}
 try{await screen.orientation.lock('landscape')}catch(e){}
 buildPanel();$('hud').style.display='block';resize();
 started=true;introT=0;last=performance.now();
 $('ld').classList.add('off');
}
$('st').addEventListener('click',start);
async function load(){
 var bar=$('bi'),lt=$('lt');
 try{
  for(var i=0;i<steps.length;i++){lt.textContent=steps[i][0];await new Promise(function(r){setTimeout(r,340)});steps[i][1]();bar.style.width=((i+1)/steps.length*100)+'%'}
  await new Promise(function(r){setTimeout(r,350)});
  lt.textContent='준비 완료 · 기기를 가로로 들고 시작하세요';$('st').style.display='block';
  requestAnimationFrame(loop);
 }catch(e){lt.textContent='불러오기에 실패했어요. 인터넷 연결을 확인하고 새로고침해 주세요.'}
}
resize();load();
})();
</script>
