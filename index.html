<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>티빙 스타일 OTT 다시보기</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap');

  * {
    margin: 0; padding: 0; box-sizing: border-box;
  }
  body {
    background-color: #0a0a0a;
    color: #fff;
    font-family: 'Noto Sans KR', sans-serif;
    overflow-x: hidden;
  }
  a {
    color: inherit;
    text-decoration: none;
  }
  button {
    cursor: pointer;
    border: none;
    background: none;
    color: inherit;
  }

  /* 상단 네비게이션 */
  header {
    position: fixed;
    top: 0; left: 0; right: 0;
    height: 60px;
    background: linear-gradient(to bottom, rgba(0,0,0,0.9), transparent);
    display: flex;
    align-items: center;
    padding: 0 40px;
    z-index: 1000;
  }
  .logo {
    font-weight: 900;
    font-size: 28px;
    letter-spacing: 4px;
    margin-right: 50px;
  }
  nav {
    display: flex;
    gap: 40px;
    flex-grow: 1;
  }
  nav a {
    font-size: 15px;
    font-weight: 600;
    padding: 8px 0;
    position: relative;
    color: #e5e5e5;
    transition: color 0.3s;
  }
  nav a:hover,
  nav a.active {
    color: #ff1e1e;
  }
  nav a.active::after {
    content: '';
    position: absolute;
    bottom: -8px;
    left: 0;
    width: 100%;
    height: 3px;
    background: #ff1e1e;
    border-radius: 2px;
  }
  .search-icon {
    width: 22px;
    height: 22px;
    fill: #fff;
    cursor: pointer;
  }

  /* 슬라이드 영역 */
  .slider {
    margin-top: 60px;
    position: relative;
    width: 100%;
    height: 480px;
    overflow: hidden;
    background: #000;
  }
  .slides {
    display: flex;
    width: 300%;
    height: 100%;
    transition: transform 1s ease-in-out;
  }
  .slide {
    position: relative;
    width: 100%;
    flex-shrink: 0;
    height: 100%;
    background-size: cover;
    background-position: center;
  }
  .slide::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(to top, rgba(0,0,0,0.85) 25%, transparent 75%);
    z-index: 1;
  }
  .slide-content {
    position: absolute;
    bottom: 60px;
    left: 60px;
    z-index: 2;
    max-width: 450px;
  }
  .slide-title {
    font-size: 42px;
    font-weight: 900;
    margin-bottom: 12px;
    letter-spacing: 1.5px;
  }
  .slide-subtitle {
    font-size: 17px;
    margin-bottom: 25px;
    color: #ddd;
    line-height: 1.3;
  }
  .btn-detail {
    background-color: rgba(255,255,255,0.15);
    border: 1.5px solid #fff;
    color: #fff;
    padding: 12px 28px;
    font-weight: 700;
    border-radius: 5px;
    transition: background-color 0.3s, border-color 0.3s;
  }
  .btn-detail:hover {
    background-color: #ff1e1e;
    border-color: #ff1e1e;
  }

  /* 슬라이드 화살표 */
  .arrow {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    width: 45px;
    height: 70px;
    background: rgba(0,0,0,0.5);
    color: #fff;
    font-size: 36px;
    line-height: 70px;
    text-align: center;
    cursor: pointer;
    z-index: 10;
    user-select: none;
    border-radius: 5px;
    transition: background 0.3s;
  }
  .arrow:hover {
    background: rgba(255,30,30,0.8);
  }
  .arrow.left {
    left: 25px;
  }
  .arrow.right {
    right: 25px;
  }

  /* 슬라이드 점(dot) */
  .dots {
    position: absolute;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 14px;
    z-index: 10;
  }
  .dot {
    width: 14px;
    height: 14px;
    background: rgba(255,255,255,0.3);
    border-radius: 50%;
    cursor: pointer;
    transition: background 0.3s;
  }
  .dot.active {
    background: #ff1e1e;
  }

  /* 콘텐츠 섹션 */
  .content-section {
    margin: 50px 60px 100px;
  }
  .section-title {
    font-size: 22px;
    font-weight: 700;
    margin-bottom: 28px;
  }
  .content-list {
    display: flex;
    gap: 20px;
    overflow-x: auto;
    padding-bottom: 12px;
  }
  .content-item {
    min-width: 150px;
    flex-shrink: 0;
    cursor: pointer;
    position: relative;
  }
  .content-item img {
    width: 100%;
    border-radius: 8px;
    display: block;
    object-fit: cover;
    aspect-ratio: 2/3;
  }
  .content-label {
    position: absolute;
    bottom: 40px;
    left: 10px;
    background: #ff1e1e;
    color: #fff;
    font-size: 11px;
    font-weight: 700;
    padding: 3px 7px;
    border-radius: 3px;
    letter-spacing: 0.5px;
    user-select: none;
  }
  .content-title {
    margin-top: 10px;
    font-size: 14px;
    font-weight: 700;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .content-subtitle {
    font-size: 12px;
    color: #aaa;
    margin-top: 3px;
  }

  /* 스크롤바 숨기기 */
  .content-list::-webkit-scrollbar {
    display: none;
  }
  .content-list {
    -ms-overflow-style: none;
    scrollbar-width: none;
  }
</style>
</head>
<body>

<header>
  <div class="logo">TVING</div>
  <nav>
    <a href="#" class="active">실시간</a>
    <a href="#">TV프로그램</a>
    <a href="#">영화</a>
    <a href="#">티빙룸</a>
  </nav>
  <svg class="search-icon" viewBox="0 0 24 24" aria-label="검색">
    <path d="M21 21l-4.35-4.35M10 18a8 8 0 1 0 0-16 8 8 0 0 0 0 16z" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
</header>

<section class="slider" aria-label="메인 슬라이드">
  <div class="slides">
    <div class="slide" style="background-image: url('https://img.tving.com/uploaded_images/contents/2022/10/20221020105128_0.jpg');" role="group" aria-roledescription="slide" aria-label="지리산">
      <div class="slide-content">
        <div class="slide-title">지리산</div>
        <div class="slide-subtitle">하늘과 만나는 곳, 여수저 지속의 경계</div>
        <button class="btn-detail" aria-label="지리산 자세히보기">자세히보기</button>
      </div>
    </div>
    <div class="slide" style="background-image: url('https://img.tving.com/uploaded_images/contents/2023/01/20230110123456_0.jpg');" role="group" aria-roledescription="slide" aria-label="두 번째 슬라이드">
      <div class="slide-content">
        <div class="slide-title">두 번째 슬라이드</div>
        <div class="slide-subtitle">설명 문구가 들어갑니다</div>
        <button class="btn-detail" aria-label="두 번째 슬라이드 자세히보기">자세히보기</button>
      </div>
    </div>
    <div class="slide" style="background-image: url('https://img.tving.com/uploaded_images/contents/2023/02/20230210123456_0.jpg');" role="group" aria-roledescription="slide" aria-label="세 번째 슬라이드">
      <div class="slide-content">
        <div class="slide-title">세 번째 슬라이드</div>
        <div class="slide-subtitle">추가 설명 문구</div>
        <button class="btn-detail" aria-label="세 번째 슬라이드 자세히보기">자세히보기</button>
      </div>
    </div>
  </div>
  <div class="arrow left" role="button" aria-label="이전 슬라이드" tabindex="0">&#10094;</div>
  <div class="arrow right" role="button" aria-label="다음 슬라이드" tabindex="0">&#10095;</div>
  <div class="dots" role="tablist" aria-label="슬라이드 선택">
    <div class="dot active" data-index="0" role="tab" tabindex="0" aria-selected="true" aria-controls="slide1"></div>
    <div class="dot" data-index="1" role="tab" tabindex="-1" aria-selected="false" aria-controls="slide2"></div>
    <div class="dot" data-index="2" role="tab" tabindex="-1" aria-selected="false" aria-controls="slide3"></div>
  </div>
</section>

<section class="content-section" aria-label="티빙에서 꼭 봐야하는 콘텐츠">
  <h2 class="section-title">티빙에서 꼭 봐야하는 콘텐츠</h2>
  <div class="content-list">
    <div class="content-item" tabindex="0">
      <img src="https://img.tving.com/uploaded_images/contents/2023/01/20230110123456_0.jpg" alt="해피니스" />
      <div class="content-label">T ORIGINAL</div>
      <div class="content-title">해피니스</div>
      <div class="content-subtitle">무삭제판</div>
    </div>
    <div class="content-item" tabindex="0">
      <img src="https://img.tving.com/uploaded_images/contents/2023/02/20230210123456_0.jpg" alt="러브캐처 인 서울" />
      <div class="content-label">T ORIGINAL</div>
      <div class="content-title">러브캐처 인 서울</div>
      <div class="content-subtitle"></div>
    </div>
    <div class="content-item" tabindex="0">
      <img src="https://img.tving.com/uploaded_images/contents/2023/03/20230310123456_0.jpg" alt="술꾼도시여자들" />
      <div class="content-label">T ORIGINAL</div>
      <div class="content-title">술꾼도시여자들</div>
      <div class="content-subtitle"></div>
    </div>
    <div class="content-item" tabindex="0">
      <img src="https://img.tving.com/uploaded_images/contents/2023/04/20230410123456_0.jpg" alt="어른연습생" />
      <div class="content-label">T ORIGINAL</div>
      <div class="content-title">어른연습생</div>
      <div class="content-subtitle"></div>
    </div>
    <div class="content-item" tabindex="0">
      <img src="https://img.tving.com/uploaded_images/contents/2023/05/20230510123456_0.jpg" alt="가상세계지만 스타가 되고 싶어" />
      <div class="content-label">T ORIGINAL</div>
      <div class="content-title">가상세계지만 스타가 되고 싶어</div>
      <div class="content-subtitle"></div>
    </div>
    <div class="content-item" tabindex="0">
      <img src="https://img.tving.com/uploaded_images/contents/2023/06/20230610123456_0.jpg" alt="EMERGENCY" />
      <div class="content-label">T ORIGINAL</div>
      <div class="content-title">EMERGENCY</div>
      <div class="content-subtitle></div>
    </div>
  </div>
</section>

<script>
  const slides = document.querySelector('.slides');
  const dots = document.querySelectorAll('.dot');
  const leftArrow = document.querySelector('.arrow.left');
  const rightArrow = document.querySelector('.arrow.right');
  const totalSlides = dots.length;
  let currentIndex = 0;
  let slideInterval;

  function goToSlide(index) {
    if(index < 0) index = totalSlides - 1;
    if(index >= totalSlides) index = 0;
    slides.style.transform = `translateX(-${index * 100}%)`;
    dots.forEach((dot, i) => {
      dot.classList.toggle('active', i === index);
      dot.setAttribute('aria-selected', i === index);
      dot.tabIndex = i === index ? 0 : -1;
    });
    currentIndex = index;
  }

  function nextSlide() {
    goToSlide(currentIndex + 1);
  }

  function prevSlide() {
    goToSlide(currentIndex - 1);
  }

  function startAutoSlide() {
    slideInterval = setInterval(nextSlide, 5000);
  }

  function stopAutoSlide() {
    clearInterval(slideInterval);
  }

  dots.forEach(dot => {
    dot.addEventListener('click', () => {
      goToSlide(parseInt(dot.dataset.index));
      stopAutoSlide();
      startAutoSlide();
    });
    dot.addEventListener('keydown', e => {
      if(e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        goToSlide(parseInt(dot.dataset.index));
        stopAutoSlide();
        startAutoSlide();
      }
    });
  });

  rightArrow.addEventListener('click', () => {
    nextSlide();
    stopAutoSlide();
    startAutoSlide();
  });
  rightArrow.addEventListener('keydown', e => {
    if(e.key === 'Enter' || e.key === ' ') {
      e.preventDefault();
      nextSlide();
      stopAutoSlide();
      startAutoSlide();
    }
  });

  leftArrow.addEventListener('click', () => {
    prevSlide();
    stopAutoSlide();
    startAutoSlide();
  });
  leftArrow.addEventListener('keydown', e => {
    if(e.key === 'Enter' || e.key === ' ') {
      e.preventDefault();
      prevSlide();
      stopAutoSlide();
      startAutoSlide();
    }
  });

  // 초기 실행
  goToSlide(0);
  startAutoSlide();
</script>

</body>
</html>
