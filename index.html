<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Got - Intelligent Assistant</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <div class="app">
        <!-- 오버레이 -->
        <div class="sidebar-overlay" id="sidebarOverlay"></div>

        <!-- 사이드바 -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="logo">
                    <div class="logo-icon">
                        <svg viewBox="0 0 32 32" fill="none">
                            <rect width="32" height="32" rx="8" fill="url(#logoGrad)"/>
                            <path d="M10 16L14 20L22 12" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
                            <defs>
                                <linearGradient id="logoGrad" x1="0" y1="0" x2="32" y2="32">
                                    <stop offset="0%" stop-color="#6366f1"/>
                                    <stop offset="100%" stop-color="#8b5cf6"/>
                                </linearGradient>
                            </defs>
                        </svg>
                    </div>
                    <span class="logo-text">Chat Got</span>
                </div>
                <button class="sidebar-close" id="sidebarClose">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <button class="new-chat-btn" id="newChatBtn">
                <i class="fa-solid fa-pen-to-square"></i>
                <span>New conversation</span>
                <kbd>⌘N</kbd>
            </button>

            <div class="chat-history-label">Recent chats</div>
            
            <div class="chat-list" id="chatList"></div>

            <div class="sidebar-footer">
                <div class="sidebar-footer-actions">
                    <button class="footer-btn" id="clearBtn">
                        <i class="fa-solid fa-trash-can"></i>
                        <span>Clear all</span>
                    </button>
                    <button class="footer-btn">
                        <i class="fa-solid fa-gear"></i>
                        <span>Settings</span>
                    </button>
                </div>
                <div class="user-card">
                    <div class="user-avatar">
                        <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Ccircle cx='20' cy='15' r='8' fill='%23cbd5e1'/%3E%3Cpath d='M8 36c0-6.627 5.373-12 12-12s12 5.373 12 12' fill='%23cbd5e1'/%3E%3C/svg%3E" alt="User">
                    </div>
                    <div class="user-info">
                        <span class="user-name">Guest User</span>
                        <span class="user-plan">Free Plan</span>
                    </div>
                </div>
            </div>
        </aside>

        <!-- 메인 -->
        <main class="main">
            <!-- 헤더 -->
            <header class="header">
                <button class="header-btn menu-btn" id="menuBtn">
                    <i class="fa-solid fa-bars-staggered"></i>
                </button>
                <div class="header-center">
                    <div class="model-indicator">
                        <span class="model-dot"></span>
                        <span class="model-name">Chat Got</span>
                        <span class="model-version">v2.0</span>
                    </div>
                </div>
                <div class="header-right">
                    <button class="header-btn" title="Share">
                        <i class="fa-solid fa-share-nodes"></i>
                    </button>
                    <button class="header-btn" title="Export">
                        <i class="fa-solid fa-download"></i>
                    </button>
                </div>
            </header>

            <!-- 채팅 영역 -->
            <div class="chat-area" id="chatArea">
                <div class="chat-scroll" id="chatScroll">
                    <!-- 웰컴 -->
                    <div class="welcome-section" id="welcomeSection">
                        <div class="welcome-icon">
                            <div class="icon-ring"></div>
                            <i class="fa-solid fa-wand-magic-sparkles"></i>
                        </div>
                        <h1 class="welcome-heading">What can I help with?</h1>
                        <p class="welcome-sub">Ask anything, explore ideas, or get creative</p>
                        
                        <div class="suggestions-container">
                            <div class="suggestions-grid">
                                <button class="suggestion-card" data-query="Explain how machine learning works in simple terms">
                                    <div class="suggestion-icon" style="background: #eef2ff; color: #6366f1;">
                                        <i class="fa-solid fa-brain"></i>
                                    </div>
                                    <div class="suggestion-content">
                                        <span class="suggestion-title">Explain Machine Learning</span>
                                        <span class="suggestion-desc">In simple terms with examples</span>
                                    </div>
                                </button>
                                <button class="suggestion-card" data-query="Write a Python function to sort a list of dictionaries by a specific key">
                                    <div class="suggestion-icon" style="background: #fef3c7; color: #f59e0b;">
                                        <i class="fa-solid fa-code"></i>
                                    </div>
                                    <div class="suggestion-content">
                                        <span class="suggestion-title">Code a sorting function</span>
                                        <span class="suggestion-desc">Python programming help</span>
                                    </div>
                                </button>
                                <button class="suggestion-card" data-query="How can I improve my productivity and time management?">
                                    <div class="suggestion-icon" style="background: #fce7f3; color: #ec4899;">
                                        <i class="fa-solid fa-bolt"></i>
                                    </div>
                                    <div class="suggestion-content">
                                        <span class="suggestion-title">Boost productivity</span>
                                        <span class="suggestion-desc">Tips and strategies</span>
                                    </div>
                                </button>
                                <button class="suggestion-card" data-query="What are the best practices for writing clean, maintainable code?">
                                    <div class="suggestion-icon" style="background: #d1fae5; color: #10b981;">
                                        <i class="fa-solid fa-feather"></i>
                                    </div>
                                    <div class="suggestion-content">
                                        <span class="suggestion-title">Clean code practices</span>
                                        <span class="suggestion-desc">Better software development</span>
                                    </div>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 입력 영역 -->
            <div class="input-section">
                <div class="input-container">
                    <div class="input-wrapper" id="inputWrapper">
                        <button class="input-action" title="Attach files">
                            <i class="fa-solid fa-plus"></i>
                        </button>
                        <textarea 
                            id="userInput" 
                            placeholder="Ask anything..." 
                            rows="1"
                            maxlength="10000"
                        ></textarea>
                        <div class="input-right-actions">
                            <span class="char-count" id="charCount">0/10000</span>
                            <button class="send-button" id="sendBtn" disabled>
                                <i class="fa-solid fa-arrow-up"></i>
                            </button>
                        </div>
                    </div>
                </div>
                <p class="input-notice">
                    <i class="fa-solid fa-shield-halved"></i>
                    Chat Got may display inaccurate info. Verify important information.
                </p>
            </div>
        </main>
    </div>

    <script src="knowledge.js"></script>
    <script src="script.js"></script>
</body>
</html>
