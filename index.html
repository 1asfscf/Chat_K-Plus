<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MomQ 웹사이트</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f9f9f9;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #fff;
            padding: 20px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
        }

        nav ul {
            list-style: none;
            display: flex;
            gap: 20px;
        }

        .user-menu span {
            margin-left: 20px;
        }

        .banner {
            position: relative;
            text-align: center;
            color: white;
        }

        .banner img {
            width: 100%;
            height: auto;
        }

        .promo-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: rgba(0, 0, 0, 0.5);
            padding: 20px;
        }

        .products {
            padding: 20px;
        }

        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
        }

        .product-item {
            background-color: white;
            border: 1px solid #ddd;
            border-radius: 5px;
            padding: 10px;
            text-align: center;
        }

        footer {
            background-color: #fff;
            padding: 10px;
            text-align: center;
        }

        .footer-links span {
            margin: 0 10px;
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">momQ</div>
        <nav>
            <ul>
                <li>베스트</li>
                <li>치(하)기스데이</li>
                <li>샘플/이벤트</li>
                <li>브랜드</li>
                <li>커뮤니티</li>
                <li>기획전</li>
            </ul>
        </nav>
        <div class="user-menu">
            <span>회원가입</span>
            <span>로그인</span>
            <span>장바구니</span>
        </div>
    </header>

    <main>
        <section class="banner">
            <img src="banner-image.jpg" alt="프로모션 배너">
            <div class="promo-text">
                <h1>물가 역주행! 초특가 육아템 균일가전</h1>
                <p>#4,900원~ #아이간식 #식기류</p>
                <button>자세히 보기</button>
            </div>
        </section>

        <section class="products">
            <h2>추천 상품</h2>
            <div class="product-grid">
                <div class="product-item">
                    <img src="product1.jpg" alt="상품 1">
                    <p>상품 이름 1</p>
                    <span>₩4,900</span>
                </div>
                <div class="product-item">
                    <img src="product2.jpg" alt="상품 2">
                    <p>상품 이름 2</p>
                    <span>₩5,900</span>
                </div>
                <div class="product-item">
                    <img src="product3.jpg" alt="상품 3">
                    <p>상품 이름 3</p>
                    <span>₩6,900</span>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <div class="footer-links">
            <span>웰컴혜택</span>
            <span>허그박스</span>
            <span>맘큐라이브</span>
            <span>커뮤니티</span>
            <span>샘플신청</span>
            <span>데일리픽</span>
            <span>프리미엄</span>
            <span>육아정보</span>
        </div>
    </footer>
</body>
</html>
