<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChatGPT Style Chatbot</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@48,400,0,0" />
    <style>
        /* 기본 스타일 및 ChatGPT 다크 테마 적용 */
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap');
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', 'Noto Sans KR', sans-serif;
        }
        body {
            background-color: #343541; /* ChatGPT 배경색 */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        /* 챗봇 전체 컨테이너 */
        .chat-container {
            width: 100%;
            max-width: 820px; /* 넓은 채팅창 구현 */
            height: 95vh;
            background-color: #343541;
            display: flex;
            flex-direction: column;
            border-radius: 8px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
            overflow: hidden;
        }

        /* 대화 로그 */
        .chat-log {
            flex-grow: 1;
            overflow-y: auto;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        /* 스크롤바 디자인 */
        .chat-log::-webkit-scrollbar {
            width: 8px;
        }
        .chat-log::-webkit-scrollbar-track {
            background: #202123;
        }
        .chat-log::-webkit-scrollbar-thumb {
            background: #555;
            border-radius: 4px;
        }

        /* 메시지 공통 스타일 */
        .message {
            display: flex;
            align-items: flex-start;
            gap: 16px;
            padding: 16px;
            border-radius: 8px;
            line-height: 1.6;
            color: #d1d5db; /* 밝은 회색 텍스트 */
            max-width: 95%;
        }
        .message.user {
            background-color: transparent; /* 사용자 메시지 배경 */
            align-self: flex-start;
        }
        .message.bot {
            background-color: #444654; /* 봇 메시지 배경 (구분) */
            align-self: flex-start;
        }
        
        .message .avatar {
            width: 30px;
            height: 30px;
            border-radius: 4px;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-shrink: 0;
            font-weight: bold;
        }
        .message.user .avatar {
            background-color: #19c37d; /* 사용자 아바타 색상 */
        }
        .message.bot .avatar {
            background-color: #9b59b6; /* 봇 아바타 색상 */
        }
        
        .message .content {
            padding-top: 4px;
            white-space: pre-wrap; /* 줄바꿈 유지 */
        }

        /* 코드 블록 스타일 */
        .message pre {
            background-color: #202123; /* 코드 블록 배경 */
            color: #d1d5db;
            padding: 16px;
            border-radius: 6px;
            overflow-x: auto;
            margin-top: 12px;
            position: relative;
        }
        .message code {
            font-family: 'Consolas', 'Monaco', 'Andale Mono', 'Ubuntu Mono', monospace;
            font-size: 0.9em;
        }
        .copy-btn {
            position: absolute;
            top: 8px;
            right: 8px;
            background: #555;
            color: white;
            border: none;
            padding: 4px 8px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            opacity: 0;
            transition: opacity 0.2s;
        }
        .message pre:hover .copy-btn {
            opacity: 1;
        }

        /* 입력창 영역 */
        .chat-input-area {
            padding: 24px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }
        .chat-input-wrapper {
            position: relative;
        }
        .chat-input-area textarea {
            width: 100%;
            background-color: #40414f; /* 입력창 배경 */
            color: #fff;
            border-radius: 8px;
            padding: 14px 50px 14px 16px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            resize: none;
            font-size: 1rem;
            line-height: 1.5;
            max-height: 200px;
        }
        .chat-input-area textarea:focus {
            outline: none;
            border-color: #565869;
        }
        .chat-input-area button {
            position: absolute;
            right: 10px;
            bottom: 10px;
            background: none;
            border: none;
            color: #8e8ea0;
            cursor: pointer;
            padding: 5px;
            border-radius: 4px;
        }
        .chat-input-area button:hover {
            background-color: #565869;
        }
        .chat-input-area .material-symbols-outlined {
            font-size: 24px;
        }
    </style>
</head>
<body>

    <div class="chat-container">
        <div class="chat-log" id="chat-log">
            <!-- 초기 메시지 -->
            <div class="message bot">
                <div class="avatar">AI</div>
                <div class="content">안녕하세요! ChatGPT 스타일로 디자인된 AI 챗봇입니다. 무엇이든 물어보세요.</div>
            </div>
        </div>
        <div class="chat-input-area">
            <div class="chat-input-wrapper">
                <textarea id="chat-input" placeholder="메시지를 입력하세요..." rows="1"></textarea>
                <button id="send-btn"><span class="material-symbols-outlined">send</span></button>
            </div>
        </div>
    </div>

    <script>
        const chatLog = document.getElementById('chat-log');
        const chatInput = document.getElementById('chat-input');
        const sendBtn = document.getElementById('send-btn');
        
        // API 키를 여기에 입력하세요. 실제 서비스에서는 서버 측에서 안전하게 관리해야 합니다.
        const API_KEY = "YOUR_OPENAI_API_KEY";

        const sendMessage = async () => {
            const messageText = chatInput.value.trim();
            if (messageText === '' || API_KEY === "YOUR_OPENAI_API_KEY") {
                if(API_KEY === "YOUR_OPENAI_API_KEY") alert("OpenAI API 키를 스크립트에 입력해주세요.");
                return;
            }

            appendMessage('user', messageText);
            chatInput.value = '';
            chatInput.style.height = 'auto';

            const thinkingMessage = appendMessage('bot', 'Thinking...');

            try {
                const response = await fetch("https://api.openai.com/v1/chat/completions", {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${API_KEY}`
                    },
                    body: JSON.stringify({
                        model: 'gpt-3.5-turbo',
                        messages: [{ role: 'user', content: messageText }]
                    })
                });

                if (!response.ok) {
                    throw new Error(`API 요청 오류: ${response.statusText}`);
                }

                const data = await response.json();
                const botResponse = data.choices[0].message.content;
                thinkingMessage.querySelector('.content').innerHTML = formatCodeBlock(botResponse);

            } catch (error) {
                thinkingMessage.querySelector('.content').textContent = `오류가 발생했습니다: ${error.message}`;
            }
            
            chatLog.scrollTop = chatLog.scrollHeight;
        };

        const appendMessage = (sender, text) => {
            const messageDiv = document.createElement('div');
            messageDiv.classList.add('message', sender);

            const avatar = document.createElement('div');
            avatar.classList.add('avatar');
            avatar.textContent = sender === 'user' ? 'You' : 'AI';

            const contentDiv = document.createElement('div');
            contentDiv.classList.add('content');
            contentDiv.textContent = text;

            messageDiv.appendChild(avatar);
            messageDiv.appendChild(contentDiv);
            chatLog.appendChild(messageDiv);
            chatLog.scrollTop = chatLog.scrollHeight;
            return messageDiv;
        };
        
        // 코드 블록을 HTML로 변환하고 복사 버튼 추가
        const formatCodeBlock = (text) => {
            return text.replace(/``````/g, (match, lang, code) => {
                const escapedCode = code.replace(/</g, "&lt;").replace(/>/g, "&gt;");
                return `<pre><button class="copy-btn">Copy</button><code class="language-${lang}">${escapedCode.trim()}</code></pre>`;
            });
        };
        
        // 동적 코드 복사 이벤트 리스너
        chatLog.addEventListener('click', (e) => {
            if (e.target.classList.contains('copy-btn')) {
                const pre = e.target.parentElement;
                const code = pre.querySelector('code').innerText;
                navigator.clipboard.writeText(code).then(() => {
                    e.target.textContent = 'Copied!';
                    setTimeout(() => { e.target.textContent = 'Copy'; }, 2000);
                });
            }
        });
        
        sendBtn.addEventListener('click', sendMessage);
        chatInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        // 텍스트 입력창 높이 자동 조절
        chatInput.addEventListener('input', () => {
            chatInput.style.height = 'auto';
            chatInput.style.height = (chatInput.scrollHeight) + 'px';
        });

    </script>
</body>
</html>
