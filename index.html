<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meta AI</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="flex h-dvh flex-col bg-[#1a1a1a]">
    <div class="relative min-h-0 flex-1">
      <div class="absolute inset-0 flex items-center justify-center" id="loadingSpinner">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" 
             class="animate-spin size-8 text-white">
          <path d="M12 2.75A9.25 9.25 0 0 1 21.25 12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          <path d="M21.25 12A9.25 9.25 0 0 1 12 21.25" stroke="currentColor" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
          <path d="M12 21.25A9.25 9.25 0 0 1 2.75 12" stroke="currentColor" stroke-width="2" stroke-linecap="round" opacity="0.3"/>
        </svg>
      </div>
      <iframe id="artifactFrame" sandbox="allow-scripts allow-forms allow-same-origin" 
              class="h-full w-full border-0" style="background-color:#ffffff; opacity:0" 
              title="공유 아티팩트"></iframe>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
