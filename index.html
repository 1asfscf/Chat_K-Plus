<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <!-- 모바일 꽉 채우기 핵심 설정! -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Chat K plus</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- 앱 전체 래퍼 (여기엔 헤더 없음! JS가 알아서 넣게 함) -->
    <div id="app-wrapper">

        <!-- 홈 화면 (초기 화면) -->
        <div id="home-screen">
            
            <!-- 1. 로고 및 타이틀 -->
            <div id="home-header">
                <div id="logo">▲</div>
                <h1>무엇을 도와드릴까요?</h1>
            </div>

            <!-- 2. 검색 입력 영역 -->
            <div id="search-area">
                <input type="text" id="search-input" placeholder="검색을 입력하세요.">
                <button id="search-btn">Search</button>
            </div>

            <!-- 3. 예시 질문 버튼 영역 -->
            <div id="example-questions">
                <span class="question-tag" data-query="아바타 2가 뭐죠?">아바타 2가 뭐죠?</span>
                <span class="question-tag" data-query="정치">정치</span>
                <span class="question-tag" data-query="사회/정치2">사회/정치2</span>
                <span class="question-tag" data-query="너에 대하여서">너에 대하여서</span>
            </div>

            <!-- 4. 하단 경고문 -->
            <footer id="home-footer">
                <p>⚠️ 해당 <strong>Chat K plus</strong>는 실수할 수 있습니다.</p>
            </footer>

        </div>

        <!-- 챗팅 화면 (JS가 헤더랑 채팅방 구조를 이 안에 조립할 거임) -->
        <div id="chat-screen" class="hidden">
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
