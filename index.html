<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>티빙</title>

<!-- 폰트 -->
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">

<style>
/* ─────────────── 모바일 최적화 변수 ─────────────── */
:root {
  --clr-bg: #0a0a0a;
  --clr-primary: #e50914;
  --clr-text: #eee;
  /* 모바일 표준에 맞춘 고정 크기 */
  --header-h: 48px;                    /* 모바일 표준 헤더 높이 */
  --touch-target: 44px;                /* iOS/Android 표준 터치 타겟 */
  --hamburger-size: 48px;              /* 햄버거 버튼 최적 크기 */
  --logo-size: 24px;                   /* 로고 텍스트 크기 */
  --nav-font: 16px;                    /* 네비게이션 폰트 크기 */
  --hover-transition: 0.3s ease;
}

*,
*::before,
*::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  background: var(--clr-bg);
  color: var(--clr-text);
  font-family: 'Noto Sans KR', sans-serif;
  overflow-x: hidden;
  -webkit-overflow-scrolling: touch;
  touch-action: manipulation;
}

/* ─────────────── 고정 크기 헤더 ─────────────── */
header {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  height: var(--header-h);              /* 고정 높이 48px */
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 16px;
  background: #000;
  border-bottom: 1px solid #222;
  z-index: 1000;
}

.logo {
  font: 900 var(--logo-size)/1 'Noto Sans KR';
  letter-spacing: 2px;
  color: var(--clr-primary);
  user-select: none;
  height: var(--touch-target);
  display: flex;
  align-items: center;
  flex-shrink: 0;
}

/* PC 네비게이션 - 태블릿 이상에서만 표시 */
.pc-nav {
  display: none;
  gap: 24px;
  flex: 1;
  justify-content: center;
}

.pc-nav a {
  font: 600 var(--nav-font)/1 'Noto Sans KR';
  color: var(--clr-text);
  position: relative;
  padding: 12px 16px;
  height: var(--touch-target);
  display: flex;
  align-items: center;
  transition: color var(--hover-transition);
  text-decoration: none;
  border-radius: 4px;
}

/* 호버 효과 - 마우스 디바이스에서만 */
@media (hover: hover) and (pointer: fine) {
  .pc-nav a:hover {
    color: var(--clr-primary);
    background: rgba(229, 9, 20, 0.1);
  }
  
  .pc-nav a.active::after {
    content: '';
    position: absolute;
    bottom: 4px;
    left: 50%;
    transform: translateX(-50%);
    width: 80%;
    height: 2px;
    background: var(--clr-primary);
    border-radius: 1px;
  }
}

/* 터치 디바이스 피드백 */
@media (hover: none) and (pointer: coarse) {
  .pc-nav a:active {
    color: var(--clr-primary);
    background: rgba(229, 9, 20, 0.2);
    transform: scale(0.98);
  }
  
  .pc-nav a.active {
    color: var(--clr-primary);
    background: rgba(229, 9, 20, 0.15);
  }
}

/* ── 햄버거 메뉴 (모바일) ── */
.hamburger {
  display: block;
  background: none;
  border: 0;
  cursor: pointer;
  padding: 8px;
  width: var(--hamburger-size);
  height: var(--hamburger-size);
  border-radius: 4px;
  transition: background var(--hover-transition);
  flex-shrink: 0;
}

.hamburger span {
  display: block;
  width: 20px;
  height: 2px;
  background: #fff;
  margin: 4px auto;
  transition: 0.3s;
  border-radius: 1px;
}

/* 햄버거 피드백 */
@media (hover: none) and (pointer: coarse) {
  .hamburger:active {
    background: rgba(255, 255, 255, 0.1);
    transform: scale(0.95);
  }
}

@media (hover: hover) and (pointer: fine) {
  .hamburger:hover {
    background: rgba(255, 255, 255, 0.1);
  }
}

/* ── 모바일 드로어 ── */
.mobile-nav-drawer {
  position: fixed;
  top: 0;
  bottom: 0;
  right: 0;
  width: 280px;
  max-width: 85%;
  background: #111;
  transform: translateX(100%);
  transition: transform 0.35s ease;
  display: flex;
  flex-direction: column;
  padding: var(--header-h) 20px 20px;
  overflow-y: auto;
  z-index: 999;
  -webkit-overflow-scrolling: touch;
}

.mobile-nav-drawer a {
  color: #fff;
  font: 600 18px/1.5 'Noto Sans KR';
  padding: 16px 0;
  text-decoration: none;
  border-bottom: 1px solid #333;
  min-height: var(--touch-target);
  display: flex;
  align-items: center;
  transition: all var(--hover-transition);
}

.mobile-nav-drawer a:active {
  background: rgba(229, 9, 20, 0.1);
  color: var(--clr-primary);
  transform: translateX(8px);
}

.mobile-nav-drawer.open {
  transform: translateX(0);
}

/* ─────────────── 본문 ─────────────── */
main {
  padding: calc(var(--header-h) + 16px) 16px 16px;
  max-width: 1280px;
  margin: 0 auto;
}

.section-title {
  font: 700 18px/1.2 'Noto Sans KR';
  margin-bottom: 16px;
}

.top20-list {
  display: flex;
  gap: 12px;
  overflow-x: auto;
  scroll-behavior: smooth;
  padding-bottom: 12px;
  -webkit-overflow-scrolling: touch;
  scroll-snap-type: x mandatory;
}

.top20-list::-webkit-scrollbar {
  display: none;
}

.top20-item {
  position: relative;
  flex: 0 0 120px;
  cursor: pointer;
  border-radius: 8px;
  overflow: hidden;
  transition: transform var(--hover-transition), box-shadow var(--hover-transition);
  scroll-snap-align: start;
  -webkit-tap-highlight-color: transparent;
}

.top20-item img {
  width: 100%;
  aspect-ratio: 2/3;
  object-fit: cover;
  display: block;
}

/* 호버 효과 - 마우스 디바이스만 */
@media (hover: hover) and (pointer: fine) {
  .top20-item:hover {
    transform: scale(1.03);
    box-shadow: 0 0 12px var(--clr-primary);
  }
}

/* 터치 피드백 */
@media (hover: none) and (pointer: coarse) {
  .top20-item:active {
    transform: scale(0.98);
    box-shadow: 0 0 8px rgba(229, 9, 20, 0.5);
  }
}

.rank {
  position: absolute;
  top: 8px;
  left: 8px;
  font: 900 20px/1 'Noto Sans KR';
  color: #fff;
  text-shadow: 0 0 4px rgba(0, 0, 0, 0.8);
}

.label {
  position: absolute;
  top: 8px;
  right: 8px;
  padding: 3px 6px;
  font: 700 10px/1 'Noto Sans KR';
  border-radius: 3px;
  color: #fff;
  background: var(--clr-primary);
  min-height: 18px;
  display: flex;
  align-items: center;
}

.label.age {
  background: #ff3b3b;
  right: auto;
  left: 8px;
  top: 36px;
}

.label.only {
  background: #00a8ff;
}

/* ─────────────── 하단 메뉴바 (모바일) ─────────────── */
.mobile-bottom-nav {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  height: 56px;                         /* 고정 높이 */
  background: #111;
  border-top: 1px solid #222;
  display: flex;
  justify-content: space-around;
  align-items: center;
  padding: 4px 0 env(safe-area-inset-bottom);
  z-index: 10000;
}

.bottom-nav-btn {
  background: none;
  border: 0;
  color: #888;
  font-size: 11px;
  display: flex;
  flex-direction: column;
  align-items: center;
  cursor: pointer;
  transition: all var(--hover-transition);
  padding: 6px 8px;
  border-radius: 6px;
  min-width: var(--touch-target);
  min-height: var(--touch-target);
  -webkit-tap-highlight-color: transparent;
}

.bottom-nav-btn svg {
  margin-bottom: 2px;
  transition: transform var(--hover-transition);
}

.bottom-nav-btn.active,
.bottom-nav-btn:active {
  color: var(--clr-primary);
  background: rgba(229, 9, 20, 0.1);
}

.bottom-nav-btn:active {
  transform: scale(0.95);
}

.bottom-nav-btn:active svg {
  transform: scale(1.05);
}

/* ─────────────── 반응형 최적화 ─────────────── */

/* 태블릿 이상 - PC 네비게이션 표시 */
@media (min-width: 768px) {
  .pc-nav {
    display: flex;
  }
  
  .hamburger {
    display: none;
  }
  
  .mobile-bottom-nav {
    display: none;
  }
  
  main {
    padding: calc(var(--header-h) + 20px) 24px 20px;
  }
  
  .top20-item {
    flex: 0 0 140px;
  }
  
  .rank {
    font-size: 24px;
  }
}

/* 작은 모바일 디바이스 */
@media (max-width: 380px) {
  .logo {
    font-size: 20px;
    letter-spacing: 1px;
  }
  
  .top20-item {
    flex: 0 0 100px;
  }
  
  .rank {
    font-size: 16px;
  }
  
  main {
    padding-bottom: calc(56px + env(safe-area-inset-bottom) + 16px);
  }
}

/* 접근성 - 모션 감소 선호 */
@media (prefers-reduced-motion: reduce) {
  * {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
  
  .mobile-nav-drawer {
    transition: none;
  }
}

/* 포커스 스타일링 */
.top20-item:focus {
  outline: 2px solid var(--clr-primary);
  outline-offset: 2px;
}

@media (hover: none) and (pointer: coarse) {
  .top20-item:focus {
    outline-width: 3px;
  }
}
</style>
</head>

<body>
<!-- ─────────────── 헤더 ─────────────── -->
<header>
  <button class="hamburger" aria-label="메뉴 열기" aria-expanded="false">
    <span></span><span></span><span></span>
  </button>

  <div class="logo" aria-label="티빙 로고">TVING</div>

  <nav class="pc-nav" role="navigation" aria-label="주요 메뉴">
    <a href="#" class="active">실시간</a>
    <a href="#">TV프로그램</a>
    <a href="#">영화</a>

    <a href="#">키즈</a>

</header>

<!-- ─────────────── 모바일 메뉴 드로어 ─────────────── -->
<nav class="mobile-nav-drawer" aria-label="모바일 메뉴">
  <a href="#" class="active">실시간</a>
  <a href="#">TV프로그램</a>
  <a href="#">영화</a>
  <a href="#">파라운트+</a>
  <a href="#">키즈</a>
</nav>

<!-- ─────────────── 본문 ─────────────── -->
<main>
  <section class="top20" aria-label="오늘의 티빙 TOP 20">
    <h2 class="section-title">오늘의 티빙 TOP 20</h2>
    <div class="top20-list">
      <div class="top20-item" tabindex="0" role="button" aria-label="대탈출 보기">
        <span class="rank">1</span>

        <img src="https://img.tving.com/uploaded_images/contents/2024/07/20240724123656_0.jpg" 
             alt="웨딩 임파서블" loading="lazy" decoding="async"/>
        <span class="label only">ONLY</span>
      </div>
      <div class="top20-item" tabindex="0" role="button" aria-label="나는 솔로 보기">
        <span class="rank">4</span>
        <img src="https://img.tving.com/uploaded_images/contents/2024/07/20240724123756_0.jpg" 
             alt="나는 솔로" loading="lazy" decoding="async"/>

      </div>
      <div class="top20-item" tabindex="0" role="button" aria-label="유퀴즈 보기">
        <span class="rank">5</span>
        <img src="https://img.tving.com/uploaded_images/contents/2024/07/20240724123856_0.jpg" 
             alt="유퀴즈" loading="lazy" decoding="async"/>
        <span class="label new">NEW</span>
      </div>
      <div class="top20-item" tabindex="0" role="button" aria-label="한성 보기">
        <span class="rank">6</span>
        <img src="https://img.tving.com/uploaded_images/contents/2024/07/20240724123956_0.jpg" 
             alt="한성" loading="lazy" decoding="async"/>
      </div>
    </div>
  </section>
</main>

<!-- ─────────────── 모바일 하단 메뉴바 ─────────────── -->
<nav class="mobile-bottom-nav" role="navigation" aria-label="모바일 하단 메뉴">
  <button class="bottom-nav-btn active" aria-label="홈">
    <svg width="20" height="20" fill="currentColor" viewBox="0 0 24 24">
      <path d="M3 9.5L12 3l9 6.5V21a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1V9.5z"/>

    <svg width="20" height="20" fill="currentColor" viewBox="0 0 24 24">
      <path d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2zm1 15h-2v-6h2zm0-8h-2V7h2z"/>
    </svg>
    <span>공개예정</span>
  </button>
  <button class="bottom-nav-btn" aria-label="검색">
    <svg width="20" height="20" fill="currentColor" viewBox="0 0 24 24">
      <circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
    </svg>
    <span>검색</span>
  </button>
  <button class="bottom-nav-btn" aria-label="기록">
    <svg width="20" height="20" fill="currentColor" viewBox="0 0 24 24">
      <path d="M3 3h18v2H3zm0 4h18v2H3zm0 4h18v2H3zm0 4h18v2H3zm0 4h18v2H3z"/>
    </svg>
    <span>기록</span>
  </button>
</nav>

<!-- ─────────────── 향상된 스크립트 ─────────────── -->
<script>
// 모바일 친화적 UI 관리 클래스
class MobileFriendlyUI {
  constructor() {
    this.setupMobileNavigation();
    this.optimizeScrolling();
    this.enhanceAccessibility();
    this.handleOrientationChanges();
  }

  // 모바일 네비게이션 설정
  setupMobileNavigation() {
    const drawer = document.querySelector('.mobile-nav-drawer');
    const burger = document.querySelector('.hamburger');
    const lines = burger?.querySelectorAll('span');

    if (!drawer || !burger || !lines) return;

    // 햄버거 메뉴 토글
    burger.addEventListener('click', () => {
      const isOpen = drawer.classList.toggle('open');
      burger.setAttribute('aria-expanded', isOpen.toString());
      
      lines.forEach((line, index) => {
        line.style.transform = isOpen ? [
          'rotate(45deg) translateY(6px)',
          'scale(0)',
          'rotate(-45deg) translateY(-6px)'
        ][index] : '';
      });
    });

    // 외부 클릭 시 닫기
    document.addEventListener('click', (e) => {
      if (!drawer.contains(e.target) && !burger.contains(e.target)) {
        if (drawer.classList.contains('open')) {
          drawer.classList.remove('open');
          burger.setAttribute('aria-expanded', 'false');
          lines.forEach(line => line.style.transform = '');
        }
      }
    });

    // ESC 키로 닫기
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && drawer.classList.contains('open')) {
        drawer.classList.remove('open');
        burger.setAttribute('aria-expanded', 'false');
        lines.forEach(line => line.style.transform = '');
        burger.focus();
      }
    });
  }

  // 스크롤 최적화
  optimizeScrolling() {
    const scrollContainer = document.querySelector('.top20-list');
    if (!scrollContainer) return;

    // 터치 디바이스에서 스크롤 성능 향상
    let scrollTimeout;
    scrollContainer.addEventListener('scroll', () => {
      clearTimeout(scrollTimeout);
      scrollContainer.style.scrollBehavior = 'auto';
      
      scrollTimeout = setTimeout(() => {
        scrollContainer.style.scrollBehavior = 'smooth';
      }, 150);
    }, { passive: true });
  }

  // 접근성 향상
  enhanceAccessibility() {
    // 키보드 네비게이션 개선
    document.querySelectorAll('.top20-item').forEach((item, index) => {
      item.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          item.click();
        }
        
        if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') {
          e.preventDefault();
          const direction = e.key === 'ArrowRight' ? 1 : -1;
          const items = document.querySelectorAll('.top20-item');
          const nextIndex = Math.max(0, Math.min(items.length - 1, index + direction));
          items[nextIndex].focus();
        }
      });
    });
  }

  // 화면 회전 처리
  handleOrientationChanges() {
    window.addEventListener('orientationchange', () => {
      setTimeout(() => {
        // 뷰포트 메타 태그 재설정
        const viewport = document.querySelector('meta[name=viewport]');
        if (viewport) {
          viewport.content = 'width=device-width, initial-scale=1, maximum-scale=1';
        }
      }, 500);
    });
  }
}

// 페이지 로드 시 초기화
document.addEventListener('DOMContentLoaded', () => {
  new MobileFriendlyUI();
});
</script>

</body>
</html>
