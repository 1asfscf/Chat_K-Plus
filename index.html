<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>티빙</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<header>
  <!-- PC 헤더 -->
  <div class="header-pc">
    <div class="logo" aria-label="티빙 로고">TVING</div>
    <nav class="nav-pc" role="navigation" aria-label="주요 메뉴">
      <a href="#" class="active">실시간</a>
      <a href="#">TV프로그램</a>
      <a href="#">영화</a>
      <a href="#">파라운트+</a>
      <a href="#">키즈</a>
    </nav>
    <div class="header-icons">
      <button class="icon-btn" aria-label="캐스트 연결">
        <!-- SVG 아이콘 -->
      </button>
      <button class="icon-btn" aria-label="장바구니">
        <!-- SVG 아이콘 -->
      </button>
    </div>
  </div>

  <!-- 모바일 헤더 -->
  <div class="header-mobile" aria-label="모바일 헤더">
    <button class="hamburger-btn" aria-label="메뉴 열기" aria-expanded="false" aria-controls="mobile-menu">
      <span></span><span></span><span></span>
    </button>
    <div class="logo" aria-label="티빙 로고">TVING</div>
    <button class="icon-btn" aria-label="검색">
      <!-- 검색 SVG 아이콘 -->
    </button>
  </div>

  <!-- 모바일 메뉴 -->
  <nav id="mobile-menu" class="mobile-menu" aria-label="모바일 메뉴" hidden>
    <a href="#" class="active">실시간</a>
    <a href="#">TV프로그램</a>
    <a href="#">영화</a>
    <a href="#">파라운트+</a>
    <a href="#">키즈</a>
  </nav>
</header>

<main>
  <!-- 공통 콘텐츠 영역 -->
  <section class="top20" aria-label="오늘의 티빙 TOP 20">
    <h2 class="section-title">오늘의 티빙 TOP 20</h2>
    <div class="top20-list">
      <!-- 콘텐츠 아이템들 -->
    </div>
  </section>

  <section class="free-section" aria-label="누구나 무료">
    <h2 class="section-title">누구나 무료</h2>
    <div class="free-list">
      <!-- 콘텐츠 아이템들 -->
    </div>
  </section>
</main>

<!-- 모바일 하단 메뉴바 -->
<nav class="mobile-bottom-nav" role="navigation" aria-label="모바일 하단 메뉴">
  <button class="bottom-nav-btn active" aria-label="홈">
    <!-- 홈 아이콘 SVG -->
    <span>홈</span>
  </button>
  <button class="bottom-nav-btn" aria-label="공개예정">
    <!-- 공개예정 아이콘 SVG -->
    <span>공개예정</span>
  </button>
  <button class="bottom-nav-btn" aria-label="검색">
    <!-- 검색 아이콘 SVG -->
    <span>검색</span>
  </button>
  <button class="bottom-nav-btn" aria-label="기록">
    <!-- 기록 아이콘 SVG -->
    <span>기록</span>
  </button>
</nav>

<script src="script.js"></script>
</body>
</html>
