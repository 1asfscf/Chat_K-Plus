<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>프로필 페이지 - momQ</title>
  <style>
    /* Global Reset */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Arial', sans-serif;
      background: linear-gradient(135deg, #f8f9fa, #e9ecef);
      color: #333;
      min-height: 100vh;
    }
    /* Header */
    header {
      background: #fff;
      padding: 15px 20px;
      border-bottom: 1px solid #ccc;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    header .logo {
      font-size: 1.8rem;
      font-weight: bold;
      text-decoration: none;
      color: #007aff;
    }
    /* Main Container */
    .main-container {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 40px 20px;
    }
    /* Profile Card */
    .profile-card {
      background: #fff;
      width: 100%;
      max-width: 600px;
      border-radius: 12px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
      padding: 30px 40px;
    }
    .profile-header {
      display: flex;
      align-items: center;
      margin-bottom: 20px;
    }
    .profile-header img {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      border: 3px solid #007aff;
      object-fit: cover;
      margin-right: 20px;
    }
    .profile-header .basic-info {
      display: flex;
      flex-direction: column;
    }
    .profile-header h1 {
      font-size: 2rem;
      color: #007aff;
      margin-bottom: 5px;
    }
    .profile-header p {
      font-size: 1rem;
      color: #666;
    }
    /* 프로필 상세 정보 */
    .profile-details {
      margin-bottom: 20px;
    }
    .profile-details ul {
      list-style: none;
      line-height: 1.8;
    }
    .profile-details li strong {
      display: inline-block;
      width: 80px;
    }
    /* 탭 네비게이션 */
    .profile-tabs {
      display: flex;
      justify-content: space-around;
      border-bottom: 1px solid #ccc;
      margin-bottom: 20px;
    }
    .profile-tabs button {
      background: none;
      border: none;
      padding: 10px 20px;
      font-size: 1rem;
      cursor: pointer;
      color: #666;
    }
    .profile-tabs button.active {
      color: #007aff;
      border-bottom: 3px solid #007aff;
      font-weight: bold;
    }
    /* 탭 컨텐츠 영역 */
    .tab-content {
      display: none;
      animation: fadeIn 0.3s ease-in-out;
    }
    .tab-content.active {
      display: block;
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    /* 반응형 처리 */
    @media (max-width: 768px) {
      .profile-card {
        padding: 20px;
      }
      .profile-header {
        flex-direction: column;
      }
      .profile-header img {
        margin-bottom: 15px;
      }
    }
  </style>
</head>
<body>
  <!-- Header -->
  <header>
    <a href="index.html" class="logo">momQ</a>
    <!-- 필요시 추가 내비게이션 메뉴 -->
  </header>
  
  <!-- Main Container -->
  <main class="main-container">
    <div class="profile-card">
      <div class="profile-header">
        <img src="https://via.placeholder.com/150" alt="프로필 사진" />
        <div class="basic-info">
          <h1>Demo</h1>
          <p>@demo</p>
        </div>
      </div>
      
      <div class="profile-details">
        <ul>
          <li><strong>이름:</strong> Demo User</li>
          <li><strong>이메일:</strong> demo@example.com</li>
          <li><strong>가입일:</strong> 2023-01-01</li>
        </ul>
      </div>
      
      <!-- 탭 내비게이션 -->
      <div class="profile-tabs">
        <button class="tab-button active" data-tab="activity">활동</button>
        <button class="tab-button" data-tab="settings">설정</button>
        <button class="tab-button" data-tab="notifications">알림</button>
      </div>
      
      <!-- 탭 컨텐츠 -->
      <div class="profile-tab-content">
        <div id="activity" class="tab-content active">
          <p>최근 활동 내역이 여기에 표시됩니다. (예: 리뷰 작성, 상품 구매 등)</p>
        </div>
        <div id="settings" class="tab-content">
          <p>여기서는 계정 설정 및 비밀번호 변경 등 개인 정보를 수정할 수 있습니다.</p>
        </div>
        <div id="notifications" class="tab-content">
          <p>알림 센터: 새 소식이나 업데이트를 확인할 수 있습니다.</p>
        </div>
      </div>
    </div>
  </main>
  
  <!-- 탭 전환 스크립트 -->
  <script>
    const tabButtons = document.querySelectorAll('.tab-button');
    const tabContents = document.querySelectorAll('.tab-content');
    
    tabButtons.forEach(button => {
      button.addEventListener('click', () => {
        // 모든 탭 버튼과 컨텐츠에서 활성화 클래스 제거
        tabButtons.forEach(btn => btn.classList.remove('active'));
        tabContents.forEach(content => content.classList.remove('active'));
        // 선택한 탭 버튼과 해당 컨텐츠 활성화
        button.classList.add('active');
        document.getElementById(button.getAttribute('data-tab')).classList.add('active');
      });
    });
  </script>
</body>
</html>
