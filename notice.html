<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>공지사항 - momQ</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    /* 전체 리셋 및 기본 스타일 */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: Arial, sans-serif;
      background: #f7f7f7;
      color: #333;
    }
    /* 헤더 영역 (notice.html 기본 헤더) */
    header {
      display: flex;
      align-items: center;
      padding: 10px 20px;
      background: #fff;
      border-bottom: 1px solid #e5e5e5;
    }
    .logo {
      font-size: 24px;
      font-weight: bold;
      color: #333;
      text-decoration: none;
    }
    /* 탭 네비게이션 */
    nav.tabs {
      display: flex;
      justify-content: center;
      margin: 20px 0;
    }
    nav.tabs a {
      text-decoration: none;
      color: #666;
      padding: 10px 20px;
      margin: 0 5px;
      border-bottom: 2px solid transparent;
      transition: all 0.3s;
      font-weight: bold;
    }
    nav.tabs a.active {
      border-color: #333;
      color: #333;
    }
    /* 검색바 */
    .search-container {
      display: flex;
      justify-content: center;
      margin: 0 auto 20px;
      max-width: 600px;
    }
    .search-container input[type="text"] {
      flex: 1;
      padding: 10px 15px;
      border: 1px solid #ccc;
      border-radius: 3px 0 0 3px;
      font-size: 16px;
      outline: none;
    }
    .search-container button {
      padding: 10px 15px;
      border: 1px solid #ccc;
      border-left: none;
      background: #333;
      color: #fff;
      border-radius: 0 3px 3px 0;
      cursor: pointer;
      font-size: 16px;
      transition: background 0.3s;
    }
    .search-container button:hover {
      background: #555;
    }
    /* 공지사항 목록 (제공해주신 코드 그대로 적용) */
    section.notice-list {
      max-width: 800px;
      margin: 0 auto 40px;
      background: #fff;
      border: 1px solid #e5e5e5;
      border-radius: 5px;
      overflow: hidden;
    }
    .notice-header,
    .notice-item {
      display: flex;
      padding: 15px;
      align-items: center;
      border-bottom: 1px solid #e5e5e5;
    }
    .notice-header {
      background: #f0f0f0;
      font-weight: bold;
    }
    .notice-header div {
      flex: 1;
      text-align: center;
    }
    .notice-header .title-header {
      flex: 3;
      text-align: left;
      padding-left: 20px;
    }
    .notice-item div {
      flex: 1;
      text-align: center;
    }
    .notice-item .title {
      flex: 3;
      text-align: left;
      padding-left: 20px;
    }
    .notice-item span.label {
      background: #333;
      color: #fff;
      padding: 2px 6px;
      font-size: 12px;
      border-radius: 3px;
      margin-right: 5px;
    }
    .notice-item:hover {
      background: #fafafa;
    }
    /* 링크 스타일: 항목 전체를 링크로 감쌈 */
    .notice-link {
      text-decoration: none;
      color: inherit;
      display: block;
    }
    @media (max-width:600px) {
      .notice-header,
      .notice-item {
        flex-direction: column;
        align-items: flex-start;
      }
      .notice-header div,
      .notice-item div {
        text-align: left;
        width: 100%;
      }
      .notice-header .title-header,
      .notice-item .title {
        padding-left: 20px;
      }
    }
  </style>
</head>
<body>
  <!-- 상단 헤더 -->
  <header>
    <a href="index.html" class="logo">momQ</a>
  </header>
  
  <!-- 탭 네비게이션 -->
  <nav class="tabs">
    <a href="faq.html">FAQ</a>
    <a href="inquiry.html">1:1 문의</a>
    <a href="notice.html" class="active">공지사항</a>
  </nav>
  
  <!-- 검색바 -->
  <div class="search-container">
    <input type="text" placeholder="공지사항 검색..." />
    <button type="button">🔍</button>
  </div>
  
  <!-- 공지사항 목록 -->
  <section class="notice-list">
    <!-- 목록 헤더 -->
    <div class="notice-header">
      <div class="title-header">제목</div>
      <div>등록일</div>
    </div>
    
    <!-- 1번째 공지사항 항목: 클릭 시 notice_detail.html 로 이동 -->
    <a href="notice_detail.html" class="notice-link">
      <div class="notice-item">
        <div class="title">
          <span class="label">공지</span>
          택배사 변경 안내
        </div>
        <div>2024.12.05</div>
      </div>
    </a>
    
    <!-- 2번째 공지사항 항목: 클릭 시 notice_detail2.html 로 이동 -->
    <a href="notice_detail2.html" class="notice-link">
      <div class="notice-item">
        <div class="title">
          <span class="label">공지</span>
          포인트 사용 정책 변경 안내
        </div>
        <div>2024.12.02</div>
      </div>
    </a>
    
    <!-- 3번째 공지사항 항목: 클릭 시 notice_detail3.html 로 이동 -->
    <a href="notice_detail3.html" class="notice-link">
      <div class="notice-item">
        <div class="title">
          <span class="label">공지</span>
          momQ 시스템 업그레이드 안내
        </div>
        <div>2024.12.10</div>
      </div>
    </a>
  </section>
</body>
</html>
