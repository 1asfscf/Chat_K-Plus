<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>바이널 솔져 1V</title>
<style>
:root{--bg:#15171b;--gray:#5a6169;--org:#e8742c;--wh:#f2f2f2}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;background:var(--bg);color:var(--wh);font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;overflow:hidden;overscroll-behavior:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
#lay{position:fixed;inset:0;z-index:5;touch-action:none}
small{font-size:10px;letter-spacing:.2em;color:#aab0b8;font-weight:700}
.scr{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--bg);transition:opacity .8s ease;gap:12px}
.scr.off{opacity:0;pointer-events:none}
.rec{width:min(30vh,180px);height:min(30vh,180px);border-radius:50%;background:radial-gradient(circle,var(--org) 0 16%,#0c0d10 17% 19%,#1d2026 20% 36%,#0c0d10 37% 39%,#1d2026 40% 58%,#0c0d10 59% 61%,#1d2026 62% 100%);box-shadow:0 0 0 3px #2b2f36,0 10px 40px #000a;animation:sp 3s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
h1{margin:0;font-size:clamp(20px,6vh,38px);letter-spacing:.18em;font-weight:800}
h1 b{color:var(--org)}
.bar{width:min(60vw,360px);height:8px;background:#2b2f36;border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--org);transition:width .3s}
#lt{font-size:13px;color:#aab0b8;min-height:18px;text-align:center;padding:0 20px}
#st{display:none;padding:12px 50px;font-size:18px;font-weight:800;letter-spacing:.22em;background:var(--org);color:var(--bg);border:0;border-radius:6px;animation:pl 1.4s ease-in-out infinite}
@keyframes pl{50%{transform:scale(1.05)}}
#rot{position:fixed;inset:0;z-index:60;background:#15171bf5;display:none;align-items:center;justify-content:center;font-size:18px;text-align:center}
#rot.on{display:flex}
.hud{position:fixed;z-index:10;pointer-events:none}
.glass{background:#15171b99;border-left:3px solid var(--org);border-radius:4px;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
#sc{left:calc(env(safe-area-inset-left) + 14px);top:10px;padding:5px 14px 6px 10px;min-width:108px}
#sc small,#tp small{display:block}
#sc b{display:block;font-size:clamp(20px,6.4vh,30px);line-height:1.1;font-variant-numeric:tabular-nums}
#sc span{font-size:11px;color:#aab0b8}
#tp{left:50%;top:10px;transform:translateX(-50%);display:none;text-align:center;padding:4px 24px 5px;border-left:0;border-bottom:3px solid var(--org)}
#tp.on{display:block}
#tp b{display:block;font-size:clamp(22px,7vh,32px);line-height:1.1;letter-spacing:.06em;font-variant-numeric:tabular-nums}
#tp.low b{color:var(--org);animation:bl .6s steps(2) infinite}
@keyframes bl{50%{color:var(--wh)}}
#cd{top:8px;left:50%;transform:translateX(-50%);width:min(18vh,84px);height:min(18vh,84px);border-radius:50%;padding:5px;display:none;background:conic-gradient(#e8742c 360deg,#2b2f36 0)}
#cd.on{display:block}
#cd i{display:flex;width:100%;height:100%;border-radius:50%;background:#15171bf0;align-items:center;justify-content:center;font-style:normal;font-weight:800;font-size:min(9vh,42px)}
#cd i.pu{animation:cdp .5s ease-out}
@keyframes cdp{from{transform:scale(1.5);opacity:.4}to{transform:none;opacity:1}}
#msg{left:50%;top:40%;transform:translate(-50%,-50%);font-size:min(14vh,64px);font-weight:900;letter-spacing:.2em;color:var(--org);opacity:0;text-shadow:0 2px 10px #000;white-space:nowrap}
#msg.on{animation:mg 1s ease-out}
@keyframes mg{0%{opacity:0;transform:translate(-50%,-50%) scale(1.6)}20%{opacity:1;transform:translate(-50%,-50%) scale(1)}70%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) scale(1)}}
#cx{left:50%;top:50%;width:0;height:0;--sp:7px}
#cx i{position:absolute;background:var(--wh);box-shadow:0 0 2px #000}
#cx .t1{left:-1px;top:calc(var(--sp) * -1 - 9px);width:2px;height:9px}
#cx .t2{left:-1px;top:var(--sp);width:2px;height:9px}
#cx .t3{top:-1px;left:calc(var(--sp) * -1 - 9px);width:9px;height:2px}
#cx .t4{top:-1px;left:var(--sp);width:9px;height:2px}
#cx .o{left:-1.5px;top:-1.5px;width:3px;height:3px;border-radius:50%;background:var(--org)}
#cx.k i:not(.o){display:none}
#hm{left:50%;top:50%;width:30px;height:30px;margin:-15px 0 0 -15px;opacity:0}
#hm:before,#hm:after{content:"";position:absolute;left:14px;top:0;width:2px;height:30px;background:var(--org);transform:rotate(45deg)}
#hm:after{transform:rotate(-45deg)}
#hm.on{animation:hk .28s ease-out}
@keyframes hk{0%{opacity:1;transform:scale(.7)}100%{opacity:0;transform:scale(1.25)}}
.pp{position:fixed;left:50%;top:50%;z-index:14;pointer-events:none;color:var(--org);font-weight:800;font-size:16px;text-shadow:0 1px 3px #000;white-space:nowrap;animation:pp .75s ease-out forwards}
@keyframes pp{from{transform:translate(22px,-6px);opacity:1}to{transform:translate(22px,-48px);opacity:0}}
#am{left:50%;bottom:2.5vh;transform:translateX(-50%);text-align:center;padding:5px 18px 6px;min-width:140px;border-left:0;border-bottom:3px solid var(--org)}
#h_w{font-size:10px;letter-spacing:.2em;color:#aab0b8;font-weight:700}
#h_a{font-size:clamp(20px,6.2vh,30px);font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums}
#h_a em{font-style:normal;font-size:.45em;color:var(--org);margin-left:8px;letter-spacing:.1em}
#h_p{height:3px;background:#2b2f36;margin-top:4px;border-radius:2px;overflow:hidden}
#h_pb{display:block;height:100%;width:100%;background:var(--org)}
.b{position:fixed;z-index:12;border-radius:50%;border:2px solid #f2f2f2a0;background:#15171b80;color:var(--wh);font-weight:800;display:flex;align-items:center;justify-content:center;touch-action:none;font-size:clamp(9px,2.8vh,12px);letter-spacing:.05em}
.b.on{background:var(--org);color:var(--bg);border-color:var(--org)}
#bf{width:21vh;height:21vh;right:calc(env(safe-area-inset-right) + 5vw);bottom:9vh;font-size:clamp(12px,4vh,17px);border-color:var(--org)}
#bj{width:14vh;height:14vh;right:calc(env(safe-area-inset-right) + 7vw);bottom:34vh}
#br{width:12vh;height:12vh;right:calc(env(safe-area-inset-right) + 5vw + 24vh);bottom:10vh}
#bsw{width:12vh;height:12vh;right:calc(env(safe-area-inset-right) + 5vw + 24vh);bottom:25vh}
#bs{width:14vh;height:14vh;left:calc(env(safe-area-inset-left) + 4vw);bottom:40vh}
#gear{width:9vh;height:9vh;right:calc(env(safe-area-inset-right) + 14px);top:10px;font-size:20px}
#jb,#js{position:fixed;z-index:11;border-radius:50%;pointer-events:none;display:none}
#jb{border:2px solid #f2f2f280;background:#15171b40}
#js{background:#f2f2f2a0}
#pn{position:fixed;z-index:40;top:0;bottom:0;right:0;width:min(58vw,440px);background:#15171bee;border-left:2px solid var(--org);padding:14px 18px;overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;transform:translateX(105%);transition:transform .35s ease}
#pn.on{transform:none}
#pn h2{margin:0 0 8px;font-size:16px;letter-spacing:.12em}
.row{display:flex;align-items:center;gap:8px;margin:7px 0;font-size:13px}
.row span{width:84px;flex:none}
.row output{width:44px;text-align:right;color:var(--org);font-weight:700;flex:none}
.row input[type=range]{flex:1;min-width:0;accent-color:#e8742c}
.row input[type=checkbox]{width:20px;height:20px;accent-color:#e8742c}
.pb{display:flex;gap:10px;margin-top:12px}
.pb button{flex:1;padding:11px;border:0;border-radius:6px;font-weight:700;font-size:14px;background:#2b2f36;color:var(--wh)}
.pb button.p{background:var(--org);color:var(--bg)}
#res{position:fixed;z-index:35;left:50%;top:50%;transform:translate(-50%,-50%);width:min(88vw,580px);background:#15171bf4;border:2px solid var(--org);border-radius:10px;padding:12px 18px 14px;transition:opacity .4s}
#res.off{opacity:0;pointer-events:none}
.rh{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.rh b{letter-spacing:.3em;font-size:14px}
#r_new{display:none;font-size:11px;font-weight:800;letter-spacing:.12em;background:var(--org);color:var(--bg);padding:3px 8px;border-radius:3px}
.rb{display:flex;gap:18px;align-items:center}
.rsc{flex:1;text-align:center}
.rsc b{display:block;font-size:clamp(38px,15vh,72px);line-height:1;color:var(--org);font-variant-numeric:tabular-nums}
.rg{flex:1.2;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.rg div{background:#2b2f3699;padding:6px 10px;border-radius:5px}
.rg small{display:block}
.rg b{font-size:clamp(14px,4.4vh,20px);font-variant-numeric:tabular-nums}
#r_retry{display:block;width:100%;margin-top:12px;padding:12px;border:0;border-radius:6px;font-size:15px;font-weight:800;letter-spacing:.12em;background:var(--org);color:var(--bg)}
#r_retry:disabled{background:#2b2f36;color:#8d949c}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="lay"></div>
<div id="hud" style="display:none">
 <div class="hud glass" id="sc"><small>SCORE</small><b id="h_sc">0</b><span id="h_st">명중 0 · 0%</span></div>
 <div class="hud glass" id="tp"><small>TIME</small><b id="h_t">1:00</b></div>
 <div class="hud" id="cd"><i id="cdn">5</i></div>
 <div class="hud" id="msg"></div>
 <div class="hud" id="cx"><i class="t1"></i><i class="t2"></i><i class="t3"></i><i class="t4"></i><i class="o"></i></div>
 <div class="hud" id="hm"></div>
 <div class="hud glass" id="am"><div id="h_w">VS-30 RIFLE</div><div id="h_a">30</div><div id="h_p"><i id="h_pb"></i></div></div>
 <div id="jb"></div><div id="js"></div>
 <div class="b" id="bf">FIRE</div>
 <div class="b" id="bj">JUMP</div>
 <div class="b" id="br">RELOAD</div>
 <div class="b" id="bsw">SWAP</div>
 <div class="b" id="bs">RUN</div>
 <div class="b" id="gear">⚙</div>
</div>
<div id="res" class="off">
 <div class="rh"><b>RESULT</b><span id="r_new">NEW RECORD</span></div>
 <div class="rb">
  <div class="rsc"><small>SCORE</small><b id="r_sc">0</b></div>
  <div class="rg">
   <div><small>명중 / 발사</small><b id="r_hit">0 / 0</b></div>
   <div><small>정확도</small><b id="r_acc">0%</b></div>
   <div><small>칼 처치</small><b id="r_kn">0</b></div>
   <div><small>최고 기록</small><b id="r_best">0</b></div>
  </div>
 </div>
 <button id="r_retry" disabled>다시 도전 (10)</button>
</div>
<div id="pn"></div>
<div id="ld" class="scr">
 <div class="rec"></div>
 <h1>VINYL <b>SOLDIER</b></h1>
 <div class="bar"><i id="bi"></i></div>
 <div id="lt">준비 중…</div>
 <button id="st">START</button>
</div>
<div id="rot">기기를 가로로 돌려 주세요 ↻</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* ==== core ==== */
(function(){
var V=window.VS=window.VS||{};
V.$=function(i){return document.getElementById(i)};
V.clamp=function(v,a,b){return Math.max(a,Math.min(b,v))};
V.D2R=Math.PI/180;
/* 조정하기 쉬운 값들 */
V.CFG={ROUND:60,COUNT:5,RETRY_WAIT:10,EYE:1.65,R:.35,MAG:30,WALK:4.8,RUN:8.6,RESPAWN:2.6,KNIFE_RANGE:2.5};
V.DEF={sens:1,gsens:1,gyro:1,ginvX:0,ginvY:0,fov:75,gx:.26,gy:-.24,gz:-.55};
V.S=Object.assign({},V.DEF);
try{Object.assign(V.S,JSON.parse(localStorage.getItem('vs_v1')||'{}'))}catch(e){}
V.save=function(){try{localStorage.setItem('vs_v1',JSON.stringify(V.S))}catch(e){}};
V.best=function(){try{return +localStorage.getItem('vs_best')||0}catch(e){return 0}};
V.setBest=function(n){try{localStorage.setItem('vs_best',n)}catch(e){}};
V.G={
 mode:'loading',paused:false,left:0,lastN:0,
 yaw:0,yawT:0,pitch:0,pitchT:0,roll:0,introT:0,camFov:103,
 P:{x:0,y:0,z:3,vx:0,vz:0,vy:0,on:true,bx:0,by:0},
 J:{x:0,y:0,id:null,ox:0,oy:0},L:{id:null,x:0,y:0},
 firing:false,jumpReq:false,sprintOn:false,runBlend:0,bobT:0,mv:0,
 score:0,shots:0,hits:0,knife:0,resultAt:0
};
V.objs={boxes:[],boards:[],hitList:[],decals:[]};
})();

/* ==== tex ==== */
(function(){
var V=window.VS,T=V.tex={};
function mk(w,h,fn,noRepeat){
 var c=document.createElement('canvas');c.width=w;c.height=h;
 var x=c.getContext('2d');fn(x,w,h);
 var t=new THREE.CanvasTexture(c);
 if(!noRepeat)t.wrapS=t.wrapT=THREE.RepeatWrapping;
 t.anisotropy=4;return t;
}
function grain(x,w,h,n,a){for(var i=0;i<n;i++){var v=(Math.random()*255)|0;x.fillStyle='rgba('+v+','+v+','+v+','+a+')';var s=1+Math.random()*2;x.fillRect(Math.random()*w,Math.random()*h,s,s)}}
V.rep=function(t,a,b){var q=t.clone();q.needsUpdate=true;q.repeat.set(a,b);return q};
V.texFloor=function(){T.floor=mk(256,256,function(x,w,h){
 x.fillStyle='#5a6169';x.fillRect(0,0,w,h);grain(x,w,h,3800,.1);
 for(var i=0;i<7;i++){x.fillStyle='rgba(0,0,0,.05)';x.beginPath();x.arc(Math.random()*w,Math.random()*h,10+Math.random()*34,0,7);x.fill()}
 x.strokeStyle='#3d4249';x.lineWidth=4;x.strokeRect(0,0,w,h);
 x.lineWidth=1.5;x.beginPath();x.moveTo(w/2,0);x.lineTo(w/2,h);x.moveTo(0,h/2);x.lineTo(w,h/2);x.stroke();
})};
V.texWall=function(){T.wall=mk(256,256,function(x,w,h){
 x.fillStyle='#3a3f46';x.fillRect(0,0,w,h);grain(x,w,h,3000,.08);
 x.strokeStyle='#2a2e34';x.lineWidth=4;
 for(var i=0;i<=4;i++){x.beginPath();x.moveTo(i*64,0);x.lineTo(i*64,h-30);x.stroke()}
 x.fillStyle='#6b727a';
 for(var i=0;i<4;i++)for(var j=0;j<6;j++){x.beginPath();x.arc(i*64+10,16+j*38,2.2,0,7);x.fill();x.beginPath();x.arc(i*64+54,16+j*38,2.2,0,7);x.fill()}
 var by=h-28;x.save();x.beginPath();x.rect(0,by,w,28);x.clip();
 x.fillStyle='#15171b';x.fillRect(0,by,w,28);x.fillStyle='#e8742c';
 for(var i=-2;i<12;i++){x.beginPath();x.moveTo(i*28,by+28);x.lineTo(i*28+14,by+28);x.lineTo(i*28+42,by);x.lineTo(i*28+28,by);x.fill()}
 x.restore();
})};
V.texCrate=function(){T.crate=mk(128,128,function(x,w,h){
 x.fillStyle='#e8742c';x.fillRect(0,0,w,h);grain(x,w,h,900,.12);
 x.strokeStyle='#a84d17';x.lineWidth=10;x.strokeRect(5,5,w-10,h-10);
 x.lineWidth=6;x.beginPath();x.moveTo(8,8);x.lineTo(w-8,h-8);x.moveTo(w-8,8);x.lineTo(8,h-8);x.stroke();
 x.fillStyle='#f2f2f2';x.font='bold 22px sans-serif';x.textAlign='center';x.fillText('VS',w/2,h/2+8);
})};
V.texTarget=function(){T.target=mk(256,256,function(x,w,h){
 x.fillStyle='#f2f2f2';x.fillRect(0,0,w,h);
 var rr=[124,100,76,52,28],cc=['#15171b','#e8742c','#f2f2f2','#e8742c','#15171b'];
 for(var i=0;i<5;i++){x.fillStyle=cc[i];x.beginPath();x.arc(128,128,rr[i],0,7);x.fill()}
},true)};
V.texMark=function(t){return mk(128,64,function(x,w,h){x.fillStyle='#f2f2f2';x.font='bold 40px sans-serif';x.textAlign='center';x.fillText(t,w/2,46)},true)};
V.texLogo=function(){T.logo=mk(512,256,function(x,w,h){
 x.fillStyle='#0c0d10';x.beginPath();x.arc(128,128,112,0,7);x.fill();
 x.strokeStyle='#2b2f36';x.lineWidth=2;
 for(var r=40;r<110;r+=10){x.beginPath();x.arc(128,128,r,0,7);x.stroke()}
 x.fillStyle='#e8742c';x.beginPath();x.arc(128,128,32,0,7);x.fill();
 x.fillStyle='#15171b';x.beginPath();x.arc(128,128,5,0,7);x.fill();
 x.textAlign='left';x.font='bold 46px sans-serif';
 x.fillStyle='#f2f2f2';x.fillText('VINYL',262,120);
 x.fillStyle='#e8742c';x.fillText('SOLDIER',262,172);
},true)};
})();

/* ==== map ==== */
(function(){
var V=window.VS,O=V.objs;
function lam(o){return new THREE.MeshLambertMaterial(o)}
function solid(m){O.hitList.push(m);V.scene.add(m)}
V.addBox=function(x,z,w,d,h){O.boxes.push({x0:x-w/2,x1:x+w/2,z0:z-d/2,z1:z+d/2,h:h})};
V.initRenderer=function(){
 V.renderer=new THREE.WebGLRenderer({canvas:V.$('c'),antialias:true});
 V.renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
 V.scene=new THREE.Scene();
 V.scene.background=new THREE.Color(0x15171b);
 V.scene.fog=new THREE.Fog(0x15171b,22,62);
 V.camera=new THREE.PerspectiveCamera(V.S.fov+28,1,.05,120);
 V.camera.rotation.order='YXZ';
 V.scene.add(V.camera);
 V.scene.add(new THREE.HemisphereLight(0xdfe6f0,0x20242a,.95));
 var dl=new THREE.DirectionalLight(0xffffff,.55);dl.position.set(3,8,5);V.scene.add(dl);
 V.resize();
};
V.resize=function(){
 if(V.renderer){V.renderer.setSize(innerWidth,innerHeight,false);V.camera.aspect=innerWidth/innerHeight;V.camera.updateProjectionMatrix()}
 V.$('rot').classList.toggle('on',innerHeight>innerWidth);
};
function addTarget(x,z,mv){
 var g=new THREE.Group();g.position.set(x,0,z);
 var post=new THREE.Mesh(new THREE.CylinderGeometry(.04,.04,1.2,8),lam({color:0x2b2f36}));
 post.position.y=.6;g.add(post);
 var edge=lam({color:0x15171b}),face=lam({map:V.tex.target});
 var bd=new THREE.Mesh(new THREE.CylinderGeometry(.46,.46,.06,32),[edge,face,face]);
 bd.rotation.x=Math.PI/2;bd.position.y=1.5;
 bd.userData={board:true,g:g};
 g.userData={down:false,downT:0,mv:mv||null};
 g.add(bd);V.scene.add(g);
 O.boards.push(bd);O.hitList.push(bd);
}
V.buildMap=function(){
 var T=V.tex,rep=V.rep;
 var fl=new THREE.Mesh(new THREE.PlaneGeometry(16,56),lam({map:rep(T.floor,4,14)}));
 fl.rotation.x=-Math.PI/2;fl.position.set(0,0,-22);solid(fl);
 var cl=new THREE.Mesh(new THREE.PlaneGeometry(16,56),lam({color:0x20242a}));
 cl.rotation.x=Math.PI/2;cl.position.set(0,5,-22);solid(cl);
 function wall(w,x,z,ry){
  var m=new THREE.Mesh(new THREE.PlaneGeometry(w,5),lam({map:rep(T.wall,w/4,1)}));
  m.position.set(x,2.5,z);m.rotation.y=ry;solid(m);
 }
 wall(56,-8,-22,Math.PI/2);wall(56,8,-22,-Math.PI/2);wall(16,0,-50,0);wall(16,0,6,Math.PI);
 /* 안쪽 끝 벽 로고 */
 var lg=new THREE.Mesh(new THREE.PlaneGeometry(8,4),new THREE.MeshBasicMaterial({map:T.logo,transparent:true,depthWrite:false}));
 lg.position.set(0,3,-49.9);V.scene.add(lg);
 /* 천장 조명 */
 var lm=new THREE.MeshBasicMaterial({color:0xf2f2f2});
 [-5,0,5].forEach(function(x){var s=new THREE.Mesh(new THREE.BoxGeometry(.4,.05,52),lm);s.position.set(x,4.95,-22);V.scene.add(s)});
 /* 거리 표시 */

(function(){

  AC=new (window.AudioContext||window.webkitAudioContext)();
  var l=(AC.sampleRate*.25)|0;NB=AC.createBuffer(1,l,AC.sampleRate);
  var d=NB.getChannelData(0);for(var i=0;i<l;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/l,3);
 }catch(e){AC=null}
};
function tone(f0,dur,vol,f1,type){
 if(!AC)return;
 var o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime;
 if(type)o.type=type;
 o.frequency.setValueAtTime(f0,t);
 if(f1)o.frequency.exponentialRampToValueAtTime(f1,t+dur);
 g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);
 o.connect(g);g.connect(AC.destination);o.start();o.stop(t+dur+.02);
}
V.sfx={
 shot:function(){
  if(!AC)return;
  var s=AC.createBufferSource();s.buffer=NB;
  var f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=2400;
  var g=AC.createGain();g.gain.value=.32;
  s.connect(f);f.connect(g);g.connect(AC.destination);s.start();
  tone(150,.1,.4,40);
 },
 hit:function(){tone(1000,.09,.25)},
 slash:function(){tone(900,.14,.14,180,'sawtooth')},
 stab:function(){tone(260,.12,.3,90,'square')},

(function(){

 P[ax]+=d;

  var b=O.boxes[i];if(P.y>=b.h-.15)continue;
  if(P.x>b.x0-C.R&&P.x<b.x1+C.R&&P.z>b.z0-C.R&&P.z<b.z1+C.R){
   if(ax==='x')P.x=d>0?b.x0-C.R:b.x1+C.R;else P.z=d>0?b.z0-C.R:b.z1+C.R;
  }

V.updatePlayer=function(dt){
 var J=G.J,play=G.mode==='play';
 var k=1-Math.exp(-28*dt);
 G.pitchT=clamp(G.pitchT,-1.4,1.4);
 G.yaw+=(G.yawT-G.yaw)*k;G.pitch+=(G.pitchT-G.pitch)*k;
 var jm=play?Math.min(1,Math.hypot(J.x,J.y)):0,tx=0,tz=0;
 if(jm>.08){
  var fx=-J.y,rx=J.x,dx=-Math.sin(G.yaw)*fx+Math.cos(G.yaw)*rx,dz=-Math.cos(G.yaw)*fx-Math.sin(G.yaw)*rx,ln=Math.hypot(dx,dz)||1;
  var sp=(G.sprintOn?C.RUN:C.WALK)*jm;tx=dx/ln*sp;tz=dz/ln*sp;
 }
 var ac=1-Math.exp(-(P.on?14:3)*dt);
 P.vx+=(tx-P.vx)*ac;P.vz+=(tz-P.vz)*ac;
 if(G.jumpReq&&P.on&&play){P.vy=5.6;P.on=false}
 G.jumpReq=false;
 P.vy-=15*dt;
 move('x',P.vx*dt);move('z',P.vz*dt);
 P.y+=P.vy*dt;
 var gy=0;
 for(var i=0;i<O.boxes.length;i++){

 }
 if(P.y<=gy&&P.vy<=0){P.y=gy;P.vy=0;P.on=true}else if(P.y>gy+.02)P.on=false;
 var spd=Math.hypot(P.vx,P.vz);

 G.bobT+=(moving?(G.sprintOn?13:9):0)*dt;
 P.bx=moving?Math.cos(G.bobT)*.018:0;P.by=moving?Math.abs(Math.sin(G.bobT))*.045:0;
 var rt=(G.sprintOn&&jm>.08)?1:0;

 rc.setFromCamera({x:0,y:0},V.camera);
 rc.far=far;
 var hs=rc.intersectObjects(O.hitList,false);

 for(var i=0;i<hs.length;i++){
  var o=hs[i].object;

V.tryFire=function(t){

 if(G.runBlend>.5)return;
 if(W.ammo<=0){V.reload();return}
 if(t-W.lastShot<.095)return;
 W.lastShot=t;W.ammo--;G.shots++;W.kick=1;W.flashT=.05;V.sfx.shot();

   knock(o);G.hits++;
   var lp=o.worldToLocal(h.point.clone()),r=Math.hypot(lp.x,lp.z),pts=10;
   if(r<.1)pts=25;else if(r<.2)pts=15;
   G.score+=pts;pop('+'+pts);hitMark();V.sfx.hit();
  }else{
   var n=h.face.normal.clone().transformDirection(o.matrixWorld);
   var d=new THREE.Mesh(new THREE.CircleGeometry(.045,8),new THREE.MeshBasicMaterial({color:0x0a0a0a,transparent:true,opacity:.7,depthWrite:false,polygonOffset:true,polygonOffsetFactor:-2}));
   d.position.copy(h.point).addScaledVector(n,.01);d.lookAt(h.point.clone().add(n));

bind('bj',function(){if(V.live()&&G.mode==='play')G.jumpReq=true});
bind('br',function(){if(V.live())V.reload()});
bind('bsw',function(){if(V.live())V.swapTo(W.cur==='rifle'?'knife':'rifle')});
bind('bs',function(){if(V.live())G.sprintOn=!G.sprintOn});
bind('gear',function(){if(G.mode==='countdown'||G.mode==='play')V.setPause(!G.paused)});
document.addEventListener('gesturestart',function(e){e.preventDefault()});
/* 자이로 */
var lastM=0;
V.onMotion=function(e){
 if(!V.live()||!S.gyro)return;
 var r=e.rotationRate;if(!r)return;
 var n=performance.now(),dt=Math.min(.05,(n-lastM)/1000);lastM=n;if(dt<=0)return;
 var ang=(screen.orientation&&screen.orientation.angle!=null)?screen.orientation.angle:(window.orientation||0),s;
 if(ang===90)s=1;else if(ang===270||ang===-90)s=-1;else return;
 var by=r.beta||0,gp=r.gamma||0;
 if(Math.abs(by)<.6)by=0;if(Math.abs(gp)<.6)gp=0;
 var sx=S.ginvX?-s:s,sy=S.ginvY?-s:s;
 G.yawT+=sx*by*V.D2R*dt*S.gsens;
 G.pitchT+=sy*(-gp)*V.D2R*dt*S.gsens;
};
})();

/* ==== settings ==== */
(function(){
var V=window.VS,G=V.G,S=V.S,$=V.$;
var ROWS=[['sens','시점 감도',.3,2.5,.05],['gsens','자이로 감도',.3,3,.05],['fov','시야각',60,100,1],['gx','총기 좌우',0,.5,.01],['gy','총기 상하',-.45,-.1,.01],['gz','총기 앞뒤',-.9,-.3,.01]];
V.buildPanel=function(){
 var h='<h2>설정</h2>'+
 '<div class="row"><span>자이로 사용</span><input type="checkbox" id="k_gyro"></div>'+
 '<div class="row"><span>자이로 좌우반전</span><input type="checkbox" id="k_ginvX"></div>'+
 '<div class="row"><span>자이로 상하반전</span><input type="checkbox" id="k_ginvY"></div>';
 ROWS.forEach(function(r){h+='<div class="row"><span>'+r[1]+'</span><input type="range" id="k_'+r[0]+'" min="'+r[2]+'" max="'+r[3]+'" step="'+r[4]+'"><output id="o_'+r[0]+'"></output></div>'});
 h+='<div class="pb"><button id="k_def">기본값</button><button class="p" id="k_ok">계속하기</button></div>';
 $('pn').innerHTML=h;sync();
 ROWS.forEach(function(r){$('k_'+r[0]).addEventListener('input',function(e){S[r[0]]=parseFloat(e.target.value);$('o_'+r[0]).textContent=S[r[0]];V.save()})});
 ['gyro','ginvX','ginvY'].forEach(function(k){$('k_'+k).addEventListener('change',function(e){S[k]=e.target.checked?1:0;V.save()})});
 $('k_def').addEventListener('click',function(){Object.assign(S,V.DEF);V.save();sync()});
 $('k_ok').addEventListener('click',function(){V.setPause(false)});
};
function sync(){
 ROWS.forEach(function(r){$('k_'+r[0]).value=S[r[0]];$('o_'+r[0]).textContent=S[r[0]]});
 ['gyro','ginvX','ginvY'].forEach(function(k){$('k_'+k).checked=!!S[k]});
}
V.setPause=function(p){
 G.paused=p;$('pn').classList.toggle('on',p);
 if(p)V.releaseInput();
};
})();

/* ==== main ==== */
(function(){
var V=window.VS,G=V.G,C=V.CFG,S=V.S,W=V.W,$=V.$,O=V.objs;
var steps=[
 ['엔진 불러오는 중…',function(){if(!window.THREE)throw new Error('three')}],
 ['렌더러 초기화…',function(){V.initRenderer()}],
 ['콘크리트 바닥 텍스처…',function(){V.texFloor()}],
 ['벽면 패널 텍스처…',function(){V.texWall()}],
 ['보급 상자 · 표적 텍스처…',function(){V.texCrate();V.texTarget();V.texLogo()}],
 ['훈련장 맵 구성 중…',function(){V.buildMap()}],
 ['무기 모델 조립 중…',function(){V.buildWeapons()}],
 ['사운드 준비 중…',function(){}]
];
var last=performance.now(),msgT=null,retryT=null;
function flash(txt){var m=$('msg');m.textContent=txt;m.classList.remove('on');void m.offsetWidth;m.classList.add('on')}
function resetRound(){
 G.score=0;G.shots=0;G.hits=0;G.knife=0;
 W.ammo=C.MAG;W.reloading=false;W.slashT=0;W.swapT=0;W.kick=0;
 W.cur='rifle';W.pend=null;V.rifle.visible=true;V.knife.visible=false;
 var P=G.P;P.x=0;P.y=0;P.z=3;P.vx=P.vz=P.vy=0;P.on=true;
 G.yaw=G.yawT=0;G.pitch=G.pitchT=0;G.sprintOn=false;G.runBlend=0;
 O.boards.forEach(function(b){var g=b.userData.g;g.userData.down=false;g.rotation.x=0});
 O.decals.forEach(function(d){V.scene.remove(d)});O.decals.length=0;
 G.introT=0;
}
function beginCountdown(){
 resetRound();
 $('res').classList.add('off');
 G.mode='countdown';G.left=C.COUNT;G.lastN=C.COUNT;
}
function endRound(){
 G.mode='ending';V.releaseInput();V.sfx.end();flash('TIME UP');
 setTimeout(showResult,1400);
}
function showResult(){
 G.mode='result';
 var acc=G.shots?Math.round(G.hits/G.shots*100):0,best=V.best(),nw=G.score>best;
 if(nw){V.setBest(G.score);best=G.score}
 $('r_sc').textContent=G.score;
 $('r_hit').textContent=G.hits+' / '+G.shots;
 $('r_acc').textContent=acc+'%';
 $('r_kn').textContent=G.knife;
 $('r_best').textContent=best;
 $('r_new').style.display=nw?'block':'none';
 $('res').classList.remove('off');
 var btn=$('r_retry'),w=C.RETRY_WAIT;
 G.resultAt=performance.now();
 btn.disabled=true;btn.textContent='다시 도전 ('+w+')';
 clearInterval(retryT);
 retryT=setInterval(function(){
  w--;
  if(w>0)btn.textContent='다시 도전 ('+w+')';
  else{clearInterval(retryT);btn.disabled=false;btn.textContent='다시 도전'}
 },1000);
}
$('r_retry').addEventListener('click',function(){
 if(performance.now()-G.resultAt<C.RETRY_WAIT*1000-200)return; /* 10초 제한 */
 beginCountdown();
});
function tick(dt,now){
 if(G.mode==='countdown'||G.mode==='play'||G.mode==='ending'){
  if(!G.paused){
   if(G.mode==='countdown'){
    G.left-=dt;
    var n=Math.max(1,Math.ceil(G.left));
    if(n!==G.lastN){G.lastN=n;V.sfx.beep()}
    if(G.left<=0){G.mode='play';G.left=C.ROUND;V.sfx.go();flash('START')}
   }else if(G.mode==='play'){
    G.left-=dt;
    if(G.left<=0){G.left=0;endRound()}
   }
  }
 }
 var active=!G.paused&&G.mode!=='loading';
 if(active){
  V.updatePlayer(dt);
  V.updateCombat(dt,now);
  V.updateTargets(dt,now);
  V.poseWeapon(dt);
  V.updateHud();
 }
 V.updateCamera(dt);
}
function loop(now){
 requestAnimationFrame(loop);
 var dt=Math.min(.05,(now-last)/1000);last=now;
 if(G.mode!=='loading')tick(dt,now/1000);
 V.renderer.render(V.scene,V.camera);
}
async function start(){
 V.audioInit();
 var ok=false;
 try{
  if(window.DeviceMotionEvent&&typeof DeviceMotionEvent.requestPermission==='function')ok=(await DeviceMotionEvent.requestPermission())==='granted';
  else ok=!!window.DeviceMotionEvent;
 }catch(e){ok=false}
 if(!ok)S.gyro=0;
 window.addEventListener('devicemotion',V.onMotion);
 try{var el=document.documentElement;if(el.requestFullscreen)await el.requestFullscreen();else if(el.webkitRequestFullscreen)el.webkitRequestFullscreen()}catch(e){}
 try{await screen.orientation.lock('landscape')}catch(e){}
 V.buildPanel();
 $('hud').style.display='block';
 V.resize();last=performance.now();
 beginCountdown();
 $('ld').classList.add('off');
}
$('st').addEventListener('click',start);
document.addEventListener('visibilitychange',function(){if(document.hidden&&(G.mode==='play'||G.mode==='countdown'))V.setPause(true)});
window.addEventListener('resize',V.resize);
window.addEventListener('orientationchange',function(){setTimeout(V.resize,200)});
async function load(){
 var bar=$('bi'),lt=$('lt');
 $('rot').classList.toggle('on',innerHeight>innerWidth);
 try{
  for(var i=0;i<steps.length;i++){
   lt.textContent=steps[i][0];
   await new Promise(function(r){setTimeout(r,340)});
   steps[i][1]();
   bar.style.width=((i+1)/steps.length*100)+'%';
  }
  await new Promise(function(r){setTimeout(r,350)});
  lt.textContent='준비 완료 · 기기를 가로로 들고 시작하세요';
  $('st').style.display='block';
  G.mode='ready';
  requestAnimationFrame(loop);
 }catch(e){lt.textContent='불러오기에 실패했어요. 인터넷 연결을 확인하고 새로고침해 주세요.'}
}
load();
})();
</script>
</body>
</html>
