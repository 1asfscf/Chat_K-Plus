<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>momQ 프리미엄 쇼핑몰</title>
  <style>
    /* 기본 리셋 및 기본 폰트 */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Pretendard', sans-serif;
      background-color: #f9f9f9;
      color: #333;
      text-align: center;
    }
    a {
      text-decoration: none;
      color: inherit;
    }
    /* ==========================
         헤더 영역 (index.html)
         ========================== */
    .header {
      background: linear-gradient(135deg, #141E30, #243B55);
      padding: 20px 40px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
    }
    .header-container {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .header-logo {
      font-size: 32px;
      font-weight: bold;
      letter-spacing: 2px;
      color: #E74C3C; /* 프리미엄 빨간색 */
      text-shadow: 1px 1px 3px rgba(0,0,0,0.3);
    }
    .header-nav ul {
      list-style: none;
      display: flex;
      gap: 20px;
    }
    .header-nav ul li a {
      font-size: 16px;
      color: #fff;
      padding-bottom: 4px;
      position: relative;
      transition: color 0.3s;
    }
    .header-nav ul li a:after {
      content: "";
      position: absolute;
      left: 0;
      bottom: 0;
      width: 0;
      height: 2px;
      background: #fff;
      transition: width 0.3s;
    }
    .header-nav ul li a:hover {
      color: #ddd;
    }
    .header-nav ul li a:hover:after {
      width: 100%;
    }
    
    /* ==========================
         슬라이드 영역
         ========================== */
    .slider {
      width: 100%;
      max-width: 1400px;
      margin: 20px auto;
      overflow: hidden;
      position: relative;
      border: 4px solid #243B55;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
    }
    .slider img {
      width: 100%;
      height: auto;
      display: block;
      opacity: 1;
      transition: opacity 1s ease-in-out;
    }
    
    /* ==========================
         맘큐 판매 베스트 섹션
         ========================== */
    .best-sellers {
      max-width: 1400px;
      margin: 40px auto;
      padding: 20px;
    }
    .best-sellers h2 {
      font-size: 28px;
      margin-bottom: 20px;
      padding-bottom: 10px;
      border-bottom: 2px solid #E74C3C;
      color: #141E30;
    }
    .products-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 20px;
    }
    .product-card {
      background: #fff;
      border: 1px solid #eee;
      border-radius: 8px;
      padding: 15px;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .product-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 4px 15px rgba(0,0,0,0.15);
    }
    .product-card img {
      width: 100%;
      border-radius: 5px;
      margin-bottom: 10px;
    }
    .product-card h3 {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 5px;
      color: #333;
    }
    .product-card p.price {
      font-size: 16px;
      font-weight: bold;
      color: #E74C3C;
    }
    .product-card p.price small {
      font-size: 14px;
      text-decoration: line-through;
      color: #999;
      margin-left: 5px;
    }
    
    /* ==========================
         기존 콘텐츠 영역 (예: 버튼, 추천상품 등)
         ========================== */
    .content {
      padding: 20px;
    }
    
    /* ==========================
         푸터 영역
         ========================== */
    footer {
      text-align: center;
      padding: 20px;
      background: #fff;
      margin-top: 30px;
      box-shadow: 0 -2px 5px rgba(0,0,0,0.05);
      font-size: 14px;
      color: #777;
    }
  </style>
</head>
<body>
  <!-- 헤더 영역 (로고 클릭 시 index.html로 이동) -->
  <header class="header">
    <div class="header-container">
      <a href="index.html" class="header-logo">momQ</a>
      <nav class="header-nav">
        <ul>
          <li><a href="index.html">홈</a></li>
          <li><a href="#">제품</a></li>
          <li><a href="#">이벤트</a></li>
          <li><a href="community.html">커뮤니티</a></li>
          <li><a href="#">문의하기</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <!-- 슬라이드 영역 (5초마다 이미지 전환) -->
  <section class="slider">
    <img id="slider-image" src="https://img.makeshop.co.kr/4/29457/202505/e884ed9ac295c362bcc500ec35759ca6.jpg" alt="슬라이드 이미지">
  </section>

  <!-- 맘큐 판매 베스트 섹션 -->
  <section class="best-sellers">
    <h2>맘큐 판매 베스트</h2>
    <div class="products-container">
      <div class="product-card">
        <img src="https://cdn5-aka.makeshop.co.kr/shopimages/2020nemomq/001004006440.jpg?1742963527" alt="상품 1">
        <h3>상품명 A</h3>
        <p class="price">108,900원 <small>172,000원</small></p>
      </div>
      <div class="product-card">
        <img src="https://cdn5-aka.makeshop.co.kr/shopimages/2020nemomq/001004006440.jpg?1742963527" alt="상품 2">
        <h3>상품명 B</h3>
        <p class="price">95,000원 <small>120,000원</small></p>
      </div>
      <div class="product-card">
        <img src="https://cdn5-aka.makeshop.co.kr/shopimages/2020nemomq/001004006440.jpg?1742963527" alt="상품 3">
        <h3>상품명 C</h3>
        <p class="price">75,900원 <small>100,000원</small></p>
      </div>
      <!-- 추가 상품 카드가 필요하면 여기에 계속 추가 -->
    </div>
  </section>

  <!-- 기존 index.html의 나머지 콘텐츠 영역 (버튼, 추천상품, 기타) -->
  <div class="content">
    <p>여기에 기존 index.html의 콘텐츠가 들어갑니다.</p>
  </div>

  <footer>
    © 2025 momQ 스타일. 모든 권리 보유.
  </footer>

  <script>
    // 슬라이드 이미지 배열 (기존 이미지와 새로 제시 받은 이미지)
    const images = [
      "https://img.makeshop.co.kr/4/29457/202505/e884ed9ac295c362bcc500ec35759ca6.jpg",
      "https://img.makeshop.co.kr/4/29457/202505/65ab5e1d661a882151f87e4ab7a9748e.jpg"
    ];
    let currentIndex = 0;
    const sliderImage = document.getElementById("slider-image");

    setInterval(() => {
      currentIndex = (currentIndex + 1) % images.length;
      sliderImage.style.opacity = 0;
      setTimeout(() => {
        sliderImage.src = images[currentIndex];
        sliderImage.style.opacity = 1;
      }, 500);
    }, 5000);
  </script>
</body>
</html>
