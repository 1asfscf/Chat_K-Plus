<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>momQ 홈</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <header>
        <div class="header-left">
            <div class="menu-icon">☰</div>
            <a href="index.html" class="logo">momQ</a>
            <a href="notice.html" class="header-notice-link">공지사항</a>
        </div>
        <div class="header-right">
            <div class="search-bar">
                <input type="text" placeholder="검색" />
                <button type="button">🔍</button>
            </div>
            <div class="icons">
                <span class="icon chat-icon">💬</span>
                <span class="icon cart-icon"> 🛒<small class="badge">0</small> </span>
                <span class="icon profile-icon">👤</span>
            </div>
        </div>
    </header>

    <!-- 슬라이드 이미지 영역 -->
    <div class="slider">
        <img class="header-banner active" src="https://img.makeshop.co.kr/4/29457/202504/be565292ad4c3d90c670a84df580d0f5.png" alt="momQ 홍보 이미지">
        <img class="header-banner" src="https://img.makeshop.co.kr/4/29457/202505/e884ed9ac295c362bcc500ec35759ca6.jpg" alt="momQ 추가 이미지">
        <img class="header-banner" src="https://img.makeshop.co.kr/4/29457/202505/7ae639373d3457aa3329bceecb8697fb.jpg" alt="momQ 세 번째 이미지">
    </div>

    <!-- 로그인 모달 -->
    <div id="loginModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <div class="modal-body">
                <h2>로그인</h2>
                <form action="#" method="post">
                    <input type="text" id="username" placeholder="아이디" required />
                    <input type="password" id="password" placeholder="비밀번호" required />
                    <button type="submit">로그인</button>
                </form>
            </div>
        </div>
    </div>

    <!-- 외부 JavaScript 파일 연결 -->
    <script src="script.js" defer></script>
</body>
</html>
