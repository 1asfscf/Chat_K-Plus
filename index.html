<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Chat k plus</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        
        <!-- ========== 검색 화면 ========== -->
        <div id="search-view">
            <div class="search-content">
                <div class="logo">✦</div>
                <h1 class="title">Chat k plus</h1>
                
                <div class="search-container">
                    <input 
                        type="text" 
                        id="queryInput" 
                        class="search-input" 
                        placeholder="무엇이든 물어보세요"
                        autocomplete="off"
                    >
                    <button id="searchBtn" class="search-btn" disabled>검색</button>
                </div>

                <div class="examples">
                    <p class="examples-title">예시 질문</p>
                    <div class="button-group">
                        <button class="example-btn">아바타 2가 뭐죠?</button>
                        <button class="example-btn">정치</button>
                        <button class="example-btn">사회/정치2</button>
                        <button class="example-btn">너에 대해서</button>
                    </div>
                </div>
            </div>

            <footer class="app-footer">
                <p>Chat K plus 은 실수할 수 있습니다.</p>
            </footer>
        </div>

                <!-- ========== 채팅 화면 ========== -->
        <div id="chat-view" class="hidden">
            <header class="chat-header">
                <button id="backBtn" class="back-btn">← 뒤로</button>
            </header>

            <div id="chat-box" class="chat-box">
                <!-- 메시지가 여기 추가됨 -->
            </div>

            <footer class="chat-footer">
                <button id="timetableBtn" class="tool-btn" title="시간표">📅</button>
                <textarea 
                    id="chatInput" 
                    class="chat-input" 
                    placeholder="메시지를 입력하세요..."
                    rows="1"
                ></textarea>
                <button id="sendBtn" class="send-btn" disabled>↑</button>
            </footer>
        </div>

    </div> <!-- app-container 끝 -->

    <!-- 링크 경고 모달 -->
    <div id="linkModal" class="modal hidden">
        <div class="modal-backdrop"></div>
        <div class="modal-content">
            <div class="modal-icon">⚠️</div>
            <h3>외부 사이트로 이동</h3>
            <p id="modalUrl" class="modal-url"></p>
            <p class="modal-desc">Chat K plus는 외부 사이트의 내용을 보증하지 않습니다.</p>
            <div class="modal-buttons">
                <button id="modalCancel" class="modal-btn cancel">취소</button>
                <button id="modalGo" class="modal-btn go">이동</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
