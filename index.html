<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TVING 클론</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
</head>
<body>

<header>
  <div class="logo">TVING</div>
  <nav>
    <a href="#" class="active">드라마</a>
    <a href="#">예능</a>
    <a href="#">영화</a>
    <a href="#">스포츠</a>
    <a href="#">애니</a>
    <a href="#">뉴스</a>
    <a href="#">라이브</a>
  </nav>
  <button class="login-btn">로그인</button>
</header>

<section class="banner">
  <div class="banner-text">
    <span class="label">V ORIGINAL</span>
    <h1>대탈출 더 스토리</h1>
    <p>새로운 탈출러들과 함께 스케일업!<br>차원이 다른 서스펜스 어드벤처!</p>
    <button class="cta">자세히 보기</button>
  </div>
</section>

<section class="categories">
  <div class="card"><img src="https://cdn.imweb.me/thumbnail/20220420/d49d76368207e.png" alt="대탈출"><span>대탈출</span></div>
  <div class="card"><img src="https://cdn.imweb.me/thumbnail/20220420/d49d76368207e.png" alt="팬텀중계"><span>팬텀중계</span></div>
  <div class="card"><img src="https://cdn.imweb.me/thumbnail/20220420/d49d76368207e.png" alt="UFC"><span>UFC</span></div>
</section>

<div class="modal hidden">
  <div class="modal-content">
    <h2>로그인</h2>
    <button class="sns-btn kakao">카카오로 로그인</button>
    <button class="sns-btn naver">네이버로 로그인</button>
    <button class="sns-btn apple">Apple로 로그인</button>
    <button class="close-btn">닫기</button>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
