<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat GOL 페이지</title>
</head>
<body>

    <div class="container">
        <!-- 1. 로고 섹션 -->
        <header class="logo-section">
            <div class="logo">▲</div>
        </header>

        <!-- 2. 제목 섹션 -->
        <main class="main-content">
            <h1>무엇을 도와드릴까요?</h1>

            <!-- 3. 검색창 섹션 -->
            <div class="search-box">
                <input type="text" placeholder="질문을 입력하세요.">
                <button class="search-btn">
                    <span class="icon">🔍</span> Search
                </button>
            </div>

            <!-- 4. 예시 질문 섹션 -->
            <section class="example-questions">
                <h3>예시질문</h3>
                <div class="question-list">
                    <button class="question-item">아바타 2가 뭐죠?</button>
                    <button class="question-item">정치</button>
                    <button class="question-item">사회/정치2</button>
                    <button class="question-item">너에 대해서</button>
                </div>
            </section>
        </main>

        <!-- 5. 하단 안내 문구 -->
        <footer class="footer">
            <p>해당 Chat GOL (는) 실수 할수 있습니다.</p>
        </footer>
    </div>

</body>
</html>
