<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DeepSeek Chat</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="app-container">
        <!-- 사이드바 -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <button class="new-chat-btn" id="newChatBtn">
                    <i class="fas fa-plus"></i>
                    <span>새 대화</span>
                </button>
            </div>
            
            <div class="chat-history" id="chatHistory">
                <div class="history-item active" data-chat-id="1">
                    <i class="fas fa-comment"></i>
                    <span>딥시크와의 대화</span>
                </div>
            </div>

            <div class="sidebar-footer">
                <div class="user-info">
                    <div class="avatar">D</div>
                    <span>DeepSeek User</span>
                </div>
            </div>
        </aside>

        <!-- 메인 채팅 영역 -->
        <main class="main-content">
            <!-- 상단바 -->
            <header class="chat-header">
                <button class="menu-toggle" id="menuToggle">
                    <i class="fas fa-bars"></i>
                </button>
                <div class="model-selector">
                    <span class="model-name">DeepSeek-V3</span>
                    <i class="fas fa-chevron-down"></i>
                </div>
            </header>

            <!-- 메시지 영역 -->
            <div class="messages-container" id="messagesContainer">
                <div class="welcome-message">
                    <div class="welcome-icon">
                        <i class="fas fa-robot"></i>
                    </div>
                    <h2>안녕하세요! DeepSeek입니다.</h2>
                    <p class="welcome-subtitle">무엇을 도와드릴까요?</p>
                    
                    <div class="suggestion-grid">
                        <button class="suggestion-card">
                            <i class="fas fa-lightbulb"></i>
                            <span>창의적인 아이디어 브레인스토밍</span>
                        </button>
                        <button class="suggestion-card">
                            <i class="fas fa-code"></i>
                            <span>코드 리뷰 및 디버깅</span>
                        </button>
                        <button class="suggestion-card">
                            <i class="fas fa-pen-fancy"></i>
                            <span>글쓰기 도움</span>
                        </button>
                        <button class="suggestion-card">
                            <i class="fas fa-brain"></i>
                            <span>복잡한 문제 해결</span>
                        </button>
                    </div>
                </div>
            </div>

            <!-- 입력 영역 -->
            <div class="input-container">
                <div class="input-wrapper">
                    <textarea 
                        id="messageInput" 
                        placeholder="메시지를 입력하세요..." 
                        rows="1"
                        maxlength="4000"
                    ></textarea>
                    <button class="send-btn" id="sendBtn">
                        <i class="fas fa-arrow-up"></i>
                    </button>
                </div>
                <p class="input-footer">
                    DeepSeek는 실수를 할 수 있습니다. 중요한 정보는 확인해주세요.
                </p>
            </div>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
