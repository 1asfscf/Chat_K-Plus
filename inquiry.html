<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>1:1 문의 - momQ</title>
  <style>
    /* 기본 리셋 */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: Arial, sans-serif;
      background: #fdfdfd;
      color: #333;
      line-height: 1.6;
    }
    /* 헤더 스타일 */
    header {
      background: #fff;
      padding: 20px;
      border-bottom: 1px solid #e5e5e5;
      display: flex;
      align-items: center;
    }
    header a.logo {
      font-size: 24px;
      font-weight: bold;
      color: #333;
      text-decoration: none;
    }
    /* 네비게이션 탭 */
    .tabs {
      display: flex;
      justify-content: center;
      margin: 20px 0;
      border-bottom: 1px solid #e5e5e5;
    }
    .tabs a {
      text-decoration: none;
      color: #666;
      padding: 10px 20px;
      margin: 0 5px;
      border-bottom: 2px solid transparent;
      transition: border-color 0.3s, color 0.3s;
      font-weight: bold;
    }
    .tabs a.active {
      border-color: #333;
      color: #333;
    }
    /* Container for inquiry table */
    .container {
      max-width: 900px;
      margin: 20px auto;
      padding: 20px;
      background: #fff;
      border: 1px solid #e5e5e5;
      border-radius: 5px;
    }
    /* Inquiry table styles */
    table.inquiry-table {
      width: 100%;
      border-collapse: collapse;
    }
    table.inquiry-table thead th {
      background: #f0f0f0;
      padding: 12px;
      border: 1px solid #e5e5e5;
      text-align: center;
      font-weight: bold;
    }
    table.inquiry-table tbody td {
      padding: 12px;
      border: 1px solid #e5e5e5;
      text-align: center;
    }
    table.inquiry-table tbody tr.empty td {
      text-align: center;
      color: #777;
    }
    /* Button container */
    .button-container {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-top: 20px;
    }
    .btn {
      display: inline-block;
      background-color: #333;
      color: #fff;
      padding: 10px 20px;
      text-decoration: none;
      border-radius: 5px;
      transition: background 0.3s;
      font-size: 16px;
    }
    .btn:hover {
      background-color: #555;
    }
    /* 반응형 처리 */
    @media (max-width: 600px) {
      .tabs {
        flex-direction: column;
      }
      .button-container {
        flex-direction: column;
      }
    }
  </style>
</head>
<body>
  <!-- 헤더: 로고 클릭 시 index.html로 이동 -->
  <header>
    <a href="index.html" class="logo">momQ</a>
  </header>
  
  <!-- 네비게이션 탭 -->
  <nav class="tabs">
    <a href="faq.html">FAQ</a>
    <a href="inquiry.html" class="active">1:1 문의</a>
    <a href="notice.html">공지사항</a>
  </nav>
  
  <!-- 문의 목록 컨테이너 -->
  <div class="container">
    <table class="inquiry-table">
      <thead>
        <tr>
          <th>번호</th>
          <th>분류</th>
          <th>문의 내용</th>
          <th>등록일</th>
          <th>처리 상태</th>
        </tr>
      </thead>
      <tbody>
        <tr class="empty">
          <td colspan="5">작성하신 문의글이 없습니다.</td>
        </tr>
      </tbody>
    </table>
    <!-- 하단 버튼 영역 -->
    <div class="button-container">
      <a href="faq.html" class="btn">자주묻는 질문으로 가기</a>
      <a href="inquiry_write.html" class="btn">1:1 문의하기</a>
    </div>
  </div>
</body>
</html>
