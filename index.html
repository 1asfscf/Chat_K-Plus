<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>티빙 스타일 다시보기 UI</title>
<style>
  /* 기본 색상 */
  :root {
    --bg-dark: #141414;
    --bg-darker: #0f0f0f;
    --text-light: #e0e0e0;
    --text-muted: #888;
    --accent: #ff5e00;
    --gray-dark: #222;
  }

  /* Reset */
  * {
    margin: 0; padding: 0; box-sizing: border-box;
  }

  body {
    font-family: 'Noto Sans KR', sans-serif, sans-serif;
    background-color: var(--bg-dark);
    color: var(--text-light);
    min-height: 100vh;
  }

  a {
    color: var(--text-light);
    text-decoration: none;
  }
  a:hover {
    color: var(--accent);
  }

  /* 컨테이너 */
  .container {
    max-width: 1200px;
    margin: 0 auto;
    padding: 0 16px;
  }

  /* 헤더 */
  header {
    background: var(--bg-darker);
    padding: 12px 0;
    position: sticky;
    top: 0;
    z-index: 100;
    border-bottom: 1px solid #222;
  }
  header .container {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .logo {
    font-weight: 900;
    font-size: 28px;
    color: var(--accent);
    letter-spacing: 2px;
  }
  nav ul {
    display: flex;
    gap: 24px;
    list-style: none;
  }
  nav ul li {
    font-weight: 600;
    font-size: 15px;
    cursor: pointer;
  }
  nav ul li:hover {
    color: var(--accent);
  }

  /* 검색 및 프로필 */
  .user-area {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .user-area input[type="search"] {
    background: #222;
    border: none;
    border-radius: 20px;
    padding: 6px 14px;
    color: var(--text-light);
    font-size: 14px;
    width: 180px;
    transition: width 0.3s ease;
  }
  .user-area input[type="search"]::placeholder {
    color: var(--text-muted);
  }
  .user-area input[type="search"]:focus {
    outline: none;
    width: 240px;
  }
  .profile-icon {
    background: var(--accent);
    width: 36px;
    height: 36px;
    border-radius: 50%;
    font-weight: 700;
    font-size: 18px;
    display: flex;
    justify-content: center;
    align-items: center;
    cursor: pointer;
    user-select: none;
  }

  /* 메인 콘텐츠 */
  main {
    margin-top: 24px;
  }

  /* 콘텐츠 섹션 제목 */
  h2.section-title {
    font-size: 22px;
    font-weight: 700;
    margin-bottom: 16px;
    padding-left: 4px;
  }

  /* 콘텐츠 카드 그리드 */
  .content-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill,minmax(140px,1fr));
    gap: 14px;
  }

  /* 콘텐츠 카드 */
  .content-card {
    background: var(--bg-darker);
    border-radius: 8px;
    overflow: hidden;
    cursor: pointer;
    transition: transform 0.3s ease, box-shadow 0.3s ease;
    display: flex;
    flex-direction: column;
  }
  .content-card:hover {
    transform: translateY(-6px);
    box-shadow: 0 8px 20px rgba(255,94,0,0.6);
  }
  .content-card img {
    width: 100%;
    aspect-ratio: 2/3;
    object-fit: cover;
    background: #111;
  }
  .content-card .title {
    padding: 8px 10px;
    font-size: 14px;
    font-weight: 600;
    color: var(--text-light);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .content-card .badge {
    position: absolute;
    top: 8px;
    left: 8px;
    background: var(--accent);
    color: #fff;
    font-size: 11px;
    font-weight: 700;
    padding: 2px 6px;
    border-radius: 4px;
  }

  /* 준비중 이미지 스타일 */
  .placeholder-img {
    display: flex;
    justify-content: center;
    align-items: center;
    background: #333;
    color: var(--text-muted);
    font-size: 13px;
    font-weight: 600;
    height: 210px;
  }

  /* 인기 콘텐츠 번호 */
  .rank-number {
    position: absolute;
    bottom: 8px;
    left: 8px;
    font-size: 20px;
    font-weight: 900;
    color: var(--accent);
    text-shadow: 0 0 6px #000;
  }

  /* 인기 콘텐츠 카드 */
  .popular-card {
    position: relative;
  }

  /* 반응형 */
  @media (max-width: 768px) {
    nav ul {
      gap: 16px;
    }
    .user-area input[type="search"] {
      width: 120px;
    }
    .user-area input[type="search"]:focus {
      width: 160px;
    }
    .content-grid {
      grid-template-columns: repeat(auto-fill,minmax(120px,1fr));
      gap: 10px;
    }
  }
  @media (max-width: 480px) {
    header .container {
      flex-wrap: wrap;
      gap: 12px;
    }
    nav ul {
      flex-wrap: wrap;
      gap: 12px;
    }
    .user-area input[type="search"] {
      width: 100px;
    }
    .user-area input[type="search"]:focus {
      width: 140px;
    }
  }
</style>
</head>
<body>
<header>
  <div class="container">
    <div class="logo">TVING</div>
    <nav>
      <ul>
        <li>홈</li>
        <li>실시간</li>
        <li>TV프로그램</li>
        <li>영화</li>
        <li>키즈</li>
        <li>티빙몰</li>
      </ul>
    </nav>
    <div class="user-area">
      <input type="search" placeholder="콘텐츠, 프로그램, 영화 검색" />
      <div class="profile-icon">박</div>
    </div>
  </div>
</header>

<main class="container">
  <!-- 새로 만나는 티빙 -->
  <section style="margin-bottom: 40px;">
    <h2 class="section-title">새로 티빙을 만나다</h2>
    <div class="content-grid" style="grid-template-columns: repeat(auto-fill,minmax(280px,1fr)); gap: 20px;">
      <div class="content-card" style="position: relative;">
        <img src="https://tving.com/images/main_banner.jpg" alt="새로 티빙을 만나다" />
      </div>
    </div>
  </section>

  <!-- TV프로그램 -->
  <section style="margin-bottom: 40px;">
    <h2 class="section-title">#티빙에서 꼭 봐야하는 프로그램</h2>
    <div class="content-grid" id="tv-programs">
      <!-- JS로 콘텐츠 동적 생성 -->
    </div>
  </section>

  <!-- 인기 콘텐츠 -->
  <section>
    <h2 class="section-title">인기 콘텐츠</h2>
    <div class="content-grid" id="popular-contents">
      <!-- JS로 콘텐츠 동적 생성 -->
    </div>
  </section>
</main>

<script>
  // 콘텐츠 데이터 예시 (이미지 없으면 null)
  const tvPrograms = [
    { title: "환혼", img: "https://image.tving.com/upload/contents/2023/06/01/1000000000_0000000000_0000000000.jpg" },
    { title: "슬기로운 의사생활", img: "https://image.tving.com/upload/contents/2023/06/01/1000000000_0000000001_0000000001.jpg" },
    { title: "예고편", img: null },
    { title: "유미의 세포들", img: "https://image.tving.com/upload/contents/2023/06/01/1000000000_0000000002_0000000002.jpg" },
    { title: "아는 형님", img: null },
    { title: "놀면 뭐하니?", img: "https://image.tving.com/upload/contents/2023/06/01/1000000000_0000000003_0000000003.jpg" }
  ];

  const popularContents = [
    { title: "재벌집 막내아들", img: "https://image.tving.com/upload/contents/2023/06/01/1000000000_0000000004_0000000004.jpg" },
    { title: "술꾼도시여자들", img: null },
    { title: "유미의 세포들", img: "https://image.tving.com/upload/contents/2023/06/01/1000000000_0000000005_0000000005.jpg" },
    { title: "이재, 곧 죽습니다", img: null },
    { title: "내 남편과 결혼해줘", img: "https://image.tving.com/upload/contents/2023/06/01/1000000000_0000000006_0000000006.jpg" },
    { title: "선재 업고 튀어", img: null }
  ];

  const placeholderImg = "https://via.placeholder.com/280x420/333333/AAAAAA?text=준비중";

  function createContentCard(item, rank=null) {
    const card = document.createElement('div');
    card.className = rank !== null ? 'content-card popular-card' : 'content-card';

    // 이미지
    const img = document.createElement('img');
    img.src = item.img || placeholderImg;
    img.alt = item.title;

    card.appendChild(img);

    // 제목
    const title = document.createElement('p');
    title.className = 'title';
    title.textContent = item.title;
    card.appendChild(title);

    // 인기 콘텐츠 랭킹 번호
    if(rank !== null) {
      const rankNum = document.createElement('div');
      rankNum.className = 'rank-number';
      rankNum.textContent = rank;
      card.appendChild(rankNum);
    }

    return card;
  }

  // TV프로그램 렌더링
  const tvProgramsContainer = document.getElementById('tv-programs');
  tvPrograms.forEach(item => {
    tvProgramsContainer.appendChild(createContentCard(item));
  });

  // 인기 콘텐츠 렌더링
  const popularContentsContainer = document.getElementById('popular-contents');
  popularContents.forEach((item, idx) => {
    popularContentsContainer.appendChild(createContentCard(item, idx + 1));
  });
</script>
</body>
</html>
