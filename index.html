<!-- index.html -->
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat K Plus</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <!-- 사이드바 -->
        <aside class="sidebar">
            <button class="new-chat-btn">새 채팅</button>
            <div class="history-list">
                <div class="history-item active">최근 대화 1</div>
            </div>
        </aside>

        <!-- 메인 채팅창 -->
        <main class="chat-container">
            <header class="chat-header">
                <h1>Chat K Plus</h1>
            </header>
            
            <div class="chat-messages" id="chatMessages">
                <div class="message system">안녕하세요! 무엇을 도와드릴까요?</div>
            </div>

            <footer class="chat-input-area">
                <div class="input-wrapper">
                    <textarea id="userInput" placeholder="메시지를 입력하세요..." rows="1"></textarea>
                    <button id="sendBtn">전송</button>
                </div>
            </footer>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
