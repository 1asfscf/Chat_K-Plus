<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Got - AI Assistant</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <div class="app">
        <!-- 사이드바 -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-top">
                <button class="new-chat" id="newChatBtn">
                    <i class="fa-solid fa-plus"></i>
                    <span>New Chat</span>
                </button>
                <button class="collapse-btn" id="collapseBtn">
                    <i class="fa-solid fa-panel-left"></i>
                </button>
            </div>
            
            <div class="chat-list" id="chatList">
                <!-- 채팅 기록이 여기에 동적으로 추가됨 -->
            </div>
            
            <div class="sidebar-bottom">
                <button class="sidebar-action">
                    <i class="fa-solid fa-trash-can"></i>
                    <span>Clear conversations</span>
                </button>
                <button class="sidebar-action">
                    <i class="fa-solid fa-gear"></i>
                    <span>Settings</span>
                </button>
                <div class="user-profile">
                    <div class="user-avatar">U</div>
                    <div class="user-name">User</div>
                </div>
            </div>
        </aside>

        <!-- 메인 채팅 -->
        <main class="main">
            <header class="header">
                <button class="menu-btn" id="menuBtn">
                    <i class="fa-solid fa-bars"></i>
                </button>
                <div class="header-model">
                    <span class="model-badge">Chat Got</span>
                    <span class="model-version">v1.0</span>
                </div>
                <div class="header-actions">
                    <button class="icon-btn" title="Share chat">
                        <i class="fa-solid fa-arrow-up-from-bracket"></i>
                    </button>
                </div>
            </header>

            <div class="chat-container" id="chatContainer">
                <div class="chat-welcome">
                    <div class="logo-animation">
                        <svg width="64" height="64" viewBox="0 0 64 64" fill="none">
                            <circle cx="32" cy="32" r="30" stroke="url(#gradient)" stroke-width="2.5"/>
                            <path d="M22 32C22 26.477 26.477 22 32 22C37.523 22 42 26.477 42 32C42 37.523 37.523 42 32 42" stroke="url(#gradient)" stroke-width="2.5" stroke-linecap="round"/>
                            <circle cx="32" cy="32" r="4" fill="url(#gradient)"/>
                            <defs>
                                <linearGradient id="gradient" x1="0" y1="0" x2="64" y2="64">
                                    <stop offset="0%" stop-color="#10A37F"/>
                                    <stop offset="100%" stop-color="#32D4A4"/>
                                </linearGradient>
                            </defs>
                        </svg>
                    </div>
                    <h1 class="welcome-title">How can I help you today?</h1>
                </div>

                <div class="suggestions-row" id="suggestions">
                    <button class="suggestion-chip">
                        <i class="fa-solid fa-lightbulb"></i>
                        <span>Explain quantum computing in simple terms</span>
                    </button>
                    <button class="suggestion-chip">
                        <i class="fa-solid fa-code"></i>
                        <span>Write a Python script for data analysis</span>
                    </button>
                    <button class="suggestion-chip">
                        <i class="fa-solid fa-pen-to-square"></i>
                        <span>Draft an email for a job application</span>
                    </button>
                    <button class="suggestion-chip">
                        <i class="fa-solid fa-chart-line"></i>
                        <span>Compare marketing strategies for growth</span>
                    </button>
                </div>
            </div>

            <div class="input-area">
                <div class="input-box">
                    <div class="input-actions-left">
                        <button class="attach-btn" title="Attach file">
                            <i class="fa-solid fa-paperclip"></i>
                        </button>
                    </div>
                    <textarea 
                        id="userInput" 
                        placeholder="Message Chat Got..." 
                        rows="1"
                        maxlength="4000"
                    ></textarea>
                    <div class="input-actions-right">
                        <button class="send-btn" id="sendBtn" disabled>
                            <i class="fa-solid fa-arrow-up"></i>
                        </button>
                    </div>
                </div>
                <p class="disclaimer">Chat Got can make mistakes. Check important info.</p>
            </div>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
