<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>OTT 다시보기 – 티빙 스타일</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    /* Reset & 기본 */
    * { margin:0; padding:0; box-sizing:border-box; }
    html, body { width:100%; background:#000; color:#fff; font-family:'Noto Sans KR',sans-serif; overflow-x:hidden; }
    a, button { background:none; border:none; cursor:pointer; }

    /* 애니메이션 */
    @keyframes fadeUp {
      from { opacity:0; transform:translateY(20px); }
      to   { opacity:1; transform:translateY(0); }
    }

    /* 헤더 */
    header {
      position:absolute; top:0; left:0; width:100%;
      padding:16px 5%; display:flex; align-items:center; z-index:20;
      animation:fadeUp .6s ease-out;
    }
    .logo-text { font-size:32px; font-weight:700; letter-spacing:-1px; }
    nav {
      margin-left:40px; display:flex; gap:24px;
      font-size:14px; font-weight:500;
      overflow-x:auto; -webkit-overflow-scrolling:touch;
      scroll-snap-type:x mandatory;
      animation:fadeUp .6s ease-out .2s both;
    }
    nav a {
      flex-shrink:0; padding-bottom:4px;
      color:#fff; text-decoration:none;
      border-bottom:2px solid transparent;
      transition:.2s;
      scroll-snap-align:start;
    }
    nav a:hover { color:#e60012; }
    nav a.active { color:#e60012; border-color:#e60012; }

    .header-actions {
      margin-left:auto; display:flex; align-items:center; gap:20px;
      animation:fadeUp .6s ease-out .4s both;
    }
    .icon svg { width:20px; height:20px; fill:#fff; transition:fill .2s; }
    .icon:hover svg { fill:#e60012; }
    .profile img { width:32px; height:32px; border-radius:50%; object-fit:cover; }

    /* 배너 */
    .banner {
      position:relative; margin-top:64px;
      width:100%; height:60vh;
      background:url('img/jirisan-banner.jpg') center/cover no-repeat;
      filter:brightness(0.6);
      animation:fadeUp .8s ease-out .6s both;
    }
    .banner .overlay {
      position:absolute; inset:0;
      background:linear-gradient(to top, rgba(0,0,0,0.8), transparent 50%);
    }
    .banner .content {
      position:absolute; left:5%; bottom:5%; max-width:50%;
      animation:fadeUp .8s ease-out .8s both;
    }
    .banner h1 { font-size:48px; font-weight:700; margin-bottom:8px; }
    .banner p.tagline { font-size:18px; line-height:1.4; margin-bottom:24px; }
    .banner .btn {
      display:inline-block; padding:12px 28px; background:#e60012;
      color:#fff; font-weight:500; border-radius:4px;
      text-decoration:none; transition:background .2s;
    }
    .banner .btn:hover { background:#ff1f3f; }

    /* 섹션 */
    .section { padding:48px 5%; }
    .section h2 {
      font-size:28px; font-weight:700; margin-bottom:24px;
      animation:fadeUp .6s ease-out 1s both;
    }

    /* 슬라이더 + 스크롤 스냅 */
    .slider { position:relative; }
    .slider-track {
      display:flex; overflow-x:auto; scroll-behavior:smooth;
      gap:16px; padding-bottom:8px;
      scroll-snap-type:x mandatory;
      animation:fadeUp .6s ease-out 1.2s both;
    }
    .slider-track::-webkit-scrollbar { height:6px; }
    .slider-track::-webkit-scrollbar-track { background:#111; }
    .slider-track::-webkit-scrollbar-thumb { background:#444; border-radius:3px; }

    .slide {
      flex:0 0 200px; cursor:pointer;
      transition:transform .3s;
      scroll-snap-align:start;
      animation:fadeUp .5s ease-out both;
    }
    .slide:hover { transform:scale(1.05); }
    .slide img { width:100%; display:block; border-radius:4px; }
    .slide .title {
      margin-top:8px; font-size:16px; font-weight:500;
      white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    }

    /* 화살표 */
    .arrow {
      position:absolute; top:50%; transform:translateY(-50%);
      width:40px; height:40px;
      background:rgba(0,0,0,0.6); border-radius:50%;
      display:flex; align-items:center; justify-content:center;
      cursor:pointer; transition:background .2s; z-index:10;
      animation:fadeUp .6s ease-out 1.4s both;
    }
    .arrow.prev { left:2%; }
    .arrow.next { right:2%; }
    .arrow:hover { background:rgba(0,0,0,0.8); }
    .arrow svg { width:24px; height:24px; fill:#fff; }

    /* 반응형 */
    @media (max-width:768px) {
      header { padding:10px 5%; }
      .logo-text { font-size:24px; }
      nav { margin-left:20px; gap:12px; font-size:12px; }
      .icon svg { width:16px; height:16px; }
      .profile img { width:28px; height:28px; }

      .banner { margin-top:56px; height:50vh; }
      .banner h1 { font-size:32px; }
      .banner p.tagline { font-size:14px; margin-bottom:16px; }
      .banner .btn { padding:8px 20px; font-size:14px; }

      .section { padding:32px 5%; }
      .section h2 { font-size:22px; margin-bottom:16px; }

      .slider-track { gap:12px; padding-bottom:6px; }
      .slide { flex:0 0 150px; }
      .slide .title { margin-top:6px; font-size:14px; }

      .arrow { width:30px; height:30px; }
      .arrow svg { width:16px; height:16px; }
    }
  </style>
</head>
<body>

  <header>
    <div class="logo-text">TVING</div>
    <nav>
      <a href="#" class="tab">LIVE</a>
      <a href="#" class="tab active">다시보기</a>
      <a href="#" class="tab">테마</a>
      <a href="#" class="tab">예능</a>
      <a href="#" class="tab">드라마</a>
      <a href="#" class="tab">영화</a>
      <a href="#" class="tab">키즈</a>
    </nav>
    <div class="header-actions">
      <button class="icon search" aria-label="검색">
        <svg viewBox="0 0 24 24"><path d="M9.5 3A6.5 6.5 0 1 1 3 9.5 6.5 6.5 0 0 1 9.5 3m0-2A8.5 8.5 0 1 0 18 9.5 8.5 8.5 0 0 0 9.5 1zm10.02 18.79L17 17.27a9.5 9.5 0 1 0-1.73 1.73l2.52 2.52 1.73-1.73z"/></svg>
      </button>
      <button class="icon bookmark" aria-label="찜목록">
        <svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3 9.24 3 10.91 3.81 12 5.08 13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
      </button>
      <button class="profile" aria-label="프로필">
        <img src="img/profile.jpg" alt="프로필 사진">
      </button>
    </div>
  </header>

  <section class="banner">
    <div class="overlay"></div>
    <div class="content">
      <h1>지리산</h1>
      <p class="tagline">하늘과 만나는 곳, 이곳에 계곡의 관객</p>
      <a href="#" class="btn">자세히 보기</a>
    </div>
  </section>

  <section class="section">
    <h2>티빙에서 꼭 봐야하는 콘텐츠</h2>
    <div class="slider">
      <div class="arrow prev">
        <svg viewBox="0 0 24 24"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>
      </div>
      <div class="slider-track">
        <!-- 1 -->
        <div class="slide">
          <img src="https://upload.wikimedia.org/wikipedia/ko/thumb/5/53/%ED%95%B4%ED%94%BC%EB%8B%88%EC%8A%A4_%28%EB%93%9C%EB%9D%BC%EB%A7%88%29_%ED%8F%AC%EC%8A%A4%ED%84%B0.jpg/500px-%ED%95%B4%ED%94%BC%EB%8B%88%EC%8A%A4_%28%EB%93%9C%EB%9D%BC%EB%A7%88%29_%ED%8F%AC%EC%8A%A4%ED%84%B0.jpg" alt="해피니스">
          <div class="title">해피니스</div>
        </div>
        <!-- 2 -->
        <div class="slide">
          <img src="https://mblogthumb-phinf.pstatic.net/MjAyMjEyMjRfMTIg/MDAxNjcxODc1MTExMTQw.hY93feGxSlOUBR2gUU6guO6fk3rmKdXvsHDTihH31kMg.tXtkX6nBywMGdrfMpxB8OtgMpAxVoWMgiHprseFNE00g.PNG.hlogic72/20221224_010236.png?type=w800" alt="랜덤캐처">
          <div class="title">랜덤캐처</div>
        </div>
        <!-- 3 -->
        <div class="slide">
          <img src="https://upload.wikimedia.org/wikipedia/ko/thumb/5/53/%ED%95%B4%ED%94%BC%EB%8B%88%EC%8A%A4_%28%EB%93%9C%EB%9D%BC%EB%A7%88%29_%ED%8F%AC%EC%8A%A4%ED%84%B0.jpg/500px-%ED%95%B4%ED%94%BC%EB%8B%88%EC%8A%A4_%28%EB%93%9C%EB%9D%BC%EB%A7%88%29_%ED%8F%AC%EC%8A%A4%ED%84%B0.jpg" alt="승부도시여자들">
          <div class="title">승부도시여자들</div>
        </div>
        <!-- 4 -->
        <div class="slide">
          <img src="https://upload.wikimedia.org/wikipedia/ko/thumb/5/53/%ED%95%B4%ED%94%BC%EB%8B%88%EC%8A%A4_%28%EB%93%9C%EB%9D%BC%EB%A7%88%29_%ED%8F%AC%EC%8A%A4%ED%84%B0.jpg/500px-%ED%95%B4%ED%94%BC%EB%8B%88%EC%8A%A4_%28%EB%93%9C%EB%9D%BC%EB%A7%88%29_%ED%8F%AC%EC%8A%A4%ED%84%B0.jpg" alt="어른연습생">
          <div class="title">어른연습생</div>
        </div>
        <!-- 5 -->
        <div class="slide">
          <img src="https://upload.wikimedia.org/wikipedia/ko/thumb/5/53/%ED%95%B4%ED%94%BC%EB%8B%88%EC%8A%A4_%28%EB%93%9C%EB%9D%BC%EB%A7%88%29_%ED%8F%AC%EC%8A%A4%ED%84%B0.jpg/500px-%ED%95%B4%ED%94%BC%EB%8B%88%EC%8A%A4_%28%EB%93%9C%EB%9D%BC%EB%A7%88%29_%ED%8F%AC%EC%8A%A4%ED%84%B0.jpg" alt="가족을 지키기만 하면 되는거였어">
          <div class="title">가족을 지키기만 하면 되는거였어</div>
        </div>
        <!-- 6 -->
        <div class="slide">
          <img src="https://upload.wikimedia.org/wikipedia/ko/thumb/5/53/%ED%95%B4%ED%94%BC%EB%8B%88%EC%8A%A4_%28%EB%93%9C%EB%9D%BC%EB%A7%88%29_%ED%8F%AC%EC%8A%A4%ED%84%B0.jpg/500px-%ED%95%B4%ED%94%BC%EB%8B%88%EC%8A%A4_%28%EB%93%9C%EB%9D%BC%EB%A7%88%29_%ED%8F%AC%EC%8A%A4%ED%84%B0.jpg" alt="EMERGENCY">
          <div class="title">EMERGENCY</div>
        </div>
      </div>
      <div class="arrow next">
        <svg viewBox="0 0 24 24"><path d="M8.59 16.59L13.17 12 8.59 7.41 10 6l6 6-6 6z"/></svg>
      </div>
    </div>
  </section>

  <script>
    const track = document.querySelector('.slider-track');
    document.querySelector('.next').addEventListener('click', () =>
      track.scrollBy({ left: track.clientWidth * 0.6, behavior: 'smooth' })
    );
    document.querySelector('.prev').addEventListener('click', () =>
      track.scrollBy({ left: -track.clientWidth * 0.6, behavior: 'smooth' })
    );
  </script>
</body>
</html>
