<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>OTT 다시보기 – 티빙 스타일</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    /* Reset & 기본 세팅 */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width:100%; height:100%; background:#000; color:#fff; font-family:'Noto Sans KR',sans-serif; }

    /* 헤더 */
    header {
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      padding: 1rem 5%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 20;
    }
    header .logo img {
      height: 1.5rem;
    }
    nav {
      flex: 1;
      margin: 0 2rem;
    }
    nav ul {
      display: flex;
      gap: 1.5rem;
      list-style: none;
    }
    nav a {
      color: #fff;
      font-weight: 500;
      font-size: 0.9rem;
      text-decoration: none;
      transition: color 0.2s;
    }
    nav a:hover { color: #e60012; }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 1rem;
    }
    .header-actions button,
    .header-actions a {
      background: none;
      border: none;
      cursor: pointer;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .header-actions .search svg,
    .header-actions .bookmark svg {
      width: 1.2rem; height: 1.2rem; fill: #fff;
    }
    .header-actions .profile img {
      width: 2rem; height: 2rem;
      border-radius: 50%;
      object-fit: cover;
    }

    /* 배너 */
    .banner {
      position: relative;
      width: 100%; height: 60vh;
      background: url('img/jirisan-banner.jpg') center/cover no-repeat;
      filter: brightness(0.6);
    }
    .banner .overlay {
      position:absolute; inset:0;
      background: linear-gradient(to top, rgba(0,0,0,0.8), transparent 50%);
    }
    .banner .content {
      position:absolute; left:5%; bottom:5%; max-width:50%;
    }
    .banner h1 {
      font-size: 3rem; font-weight:700; margin-bottom:0.5rem;
    }
    .banner p.tagline {
      font-size: 1.2rem; line-height:1.4; margin-bottom:1.5rem;
    }
    .banner .btn {
      display:inline-block; padding:0.8rem 1.8rem;
      background:#e60012; color:#fff; font-weight:500;
      border-radius:4px; text-decoration:none;
      transition: background 0.2s;
    }
    .banner .btn:hover { background:#ff1f3f; }

    /* 섹션 */
    .section { padding:3rem 5%; }
    .section h2 {
      font-size:1.8rem; font-weight:700; margin-bottom:1.5rem;
    }

    /* 슬라이더 */
    .slider { position:relative; }
    .slider-track {
      display:flex; overflow-x:auto; scroll-behavior:smooth;
      gap:1rem; padding-bottom:0.5rem;
    }
    .slider-track::-webkit-scrollbar { height:6px; }
    .slider-track::-webkit-scrollbar-track { background:#111; }
    .slider-track::-webkit-scrollbar-thumb {
      background:#444; border-radius:3px;
    }
    .slide {
      flex:0 0 200px; cursor:pointer;
      transition: transform 0.3s;
    }
    .slide:hover { transform:scale(1.05); }
    .slide img {
      width:100%; display:block; border-radius:4px;
    }
    .slide .title {
      margin-top:0.6rem; font-size:1rem;
      font-weight:500; white-space:nowrap;
      overflow:hidden; text-overflow:ellipsis;
    }

    /* 화살표 버튼 */
    .arrow {
      position:absolute; top:50%;
      transform:translateY(-50%);
      width:2.5rem; height:2.5rem;
      background:rgba(0,0,0,0.6); border-radius:50%;
      display:flex; align-items:center; justify-content:center;
      cursor:pointer; transition:background 0.2s; z-index:10;
    }
    .arrow:hover { background:rgba(0,0,0,0.8); }
    .arrow.prev { left:0.5%; }
    .arrow.next { right:0.5%; }
    .arrow svg { width:1.2rem; height:1.2rem; fill:#fff; }
  </style>
</head>
<body>

  <!-- 헤더 -->
  <header>
    <div class="logo">
      <img src="img/tving-logo.svg" alt="티빙 로고">
    </div>
    <nav>
      <ul>
        <li><a href="#">홈</a></li>
        <li><a href="#">실시간</a></li>
        <li><a href="#">다시보기</a></li>
        <li><a href="#">드라마</a></li>
        <li><a href="#">영화</a></li>
        <li><a href="#">키즈</a></li>
      </ul>
    </nav>
    <div class="header-actions">
      <button class="search" aria-label="검색">
        <!-- 검색 아이콘 SVG -->
        <svg viewBox="0 0 24 24"><path d="M9.5 3A6.5 6.5 0 1 1 3 9.5 6.5 6.5 0 0 1 9.5 3m0-2A8.5 8.5 0 1 0 18 9.5 8.5 8.5 0 0 0 9.5 1zm10.02 18.79L17 17.27a9.5 9.5 0 1 0-1.73 1.73l2.52 2.52 1.73-1.73z"/></svg>
      </button>
      <a href="#" class="bookmark" aria-label="찜목록">
        <!-- 찜 아이콘 SVG -->
        <svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3 9.24 3 10.91 3.81 12 5.08 13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
      </a>
      <button class="profile" aria-label="프로필">
        <img src="img/profile.jpg" alt="프로필 사진">
      </button>
    </div>
  </header>

  <!-- 1. 메인 배너 -->
  <section class="banner">
    <div class="overlay"></div>
    <div class="content">
      <h1>지리산</h1>
      <p class="tagline">하늘과 만나는 곳, 이곳에 계곡의 관객</p>
      <a href="#" class="btn">자세히 보기</a>
    </div>
  </section>

  <!-- 2. 추천 콘텐츠 섹션 -->
  <section class="section">
    <h2>티빙에서 꼭 봐야하는 콘텐츠</h2>
    <div class="slider">
      <div class="arrow prev">
        <svg viewBox="0 0 24 24"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>
      </div>
      <div class="slider-track">
        <!-- ...기존 6개 .slide 코드 그대로... -->
      </div>
      <div class="arrow next">
        <svg viewBox="0 0 24 24"><path d="M8.59 16.59L13.17 12 8.59 7.41 10 6l6 6-6 6z"/></svg>
      </div>
    </div>
  </section>

  <!-- 스크립트 동일 -->
  <script>
    const track = document.querySelector('.slider-track');
    document.querySelector('.next').addEventListener('click', () => {
      track.scrollBy({ left: track.clientWidth * 0.6, behavior: 'smooth' });
    });
    document.querySelector('.prev').addEventListener('click', () => {
      track.scrollBy({ left: -track.clientWidth * 0.6, behavior: 'smooth' });
    });
  </script>
</body>
</html>
```
