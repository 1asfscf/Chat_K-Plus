  backdrop-filter: var(--tw-backdrop-blur) var(--tw-backdrop-brightness) var(--tw-backdrop-contrast) var(--tw-backdrop-grayscale) var(--tw-backdrop-hue-rotate) var(--tw-backdrop-invert) var(--tw-backdrop-opacity) var(--tw-backdrop-saturate) var(--tw-backdrop-sepia);

.transition-all{
  transition-property: all;
  transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
  transition-duration: 150ms;
}

.\[overflow-wrap\:anywhere\]{
  overflow-wrap: anywhere;
}

:root{
  --bg:#171813;
  --surface:#22231d;
  --surface2:#2c2d24;
  --line:#45463a;
  --text:#eef0e6;
  --muted:#a8a99a;
  --neon:#e8c24a;
  --purple:#8fa38a;
  --red:#e83232;
  --amber:#e8c24a;
}

@media (prefers-color-scheme: dark){
  :root{
    --bg:#12130f;
    --surface:#22231d;
    --surface2:#2c2d24;
    --line:#45463a;
    --text:#f2f3ec;
    --muted:#a8a99a;
  }
}

*{
  box-sizing:border-box;
}

html,body,#root{
  margin:0;
  padding:0;
  background:var(--bg);
  color:var(--text);
  font-family:'Noto Sans KR', system-ui, sans-serif;
}

button{
  font-family:inherit;
}

.font-display{
  font-family:'Orbitron','Noto Sans KR',sans-serif;
}

.no-select{
  -webkit-user-select:none;
  -moz-user-select:none;
       user-select:none;
  -webkit-touch-callout:none;
  touch-action:none;
}

.scanlines{
  background-image:repeating-linear-gradient(0deg, rgba(255,255,255,.025) 0 1px, transparent 1px 4px);
}

.vinyl-ring{
  background:conic-gradient(from 0deg,#a7ff4d,#b46cff,#23d5ff,#a7ff4d);
}

@keyframes spinSlow{
  to{
    transform:rotate(360deg);
  }
}

@keyframes pulseNeon{
  0%,100%{
    box-shadow:0 0 0 rgba(167,255,77,.0);
  }

  50%{
    box-shadow:0 0 28px rgba(167,255,77,.45);
  }
}

@keyframes floatY{
  0%,100%{
    transform:translateY(0);
  }

  50%{
    transform:translateY(-6px);
  }
}

@keyframes blink{
  0%,100%{
    opacity:1;
  }

  50%{
    opacity:.25;
  }
}

.spin-slow{
  animation:spinSlow 7s linear infinite;
}

.pulse-neon{
  animation:pulseNeon 1.6s ease-in-out infinite;
}

.float-y{
  animation:floatY 2.4s ease-in-out infinite;
}

.blink{
  animation:blink 1s steps(2) infinite;
}

.active\:scale-95:active{
  --tw-scale-x: .95;
  --tw-scale-y: .95;
  transform: translate(var(--tw-translate-x), var(--tw-translate-y)) rotate(var(--tw-rotate)) skewX(var(--tw-skew-x)) skewY(var(--tw-skew-y)) scaleX(var(--tw-scale-x)) scaleY(var(--tw-scale-y));
}

@media (min-width: 640px){
  .sm\:bottom-4{
    bottom: 1rem;
  }

  .sm\:bottom-\[110px\]{
    bottom: 110px;
  }

  .sm\:top-auto{
    top: auto;
  }

  .sm\:block{
    display: block;
  }

  .sm\:hidden{
    display: none;
  }
}
