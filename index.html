<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>momQ 프리미엄 쇼핑몰</title>
  <style>
    /* 전체 기본 스타일 */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Pretendard', sans-serif;
    }
    body {
      background-color: #f9f9f9;
      color: #333;
      text-align: center;
    }
    /* 헤더 영역 */
    .header {
      background: linear-gradient(135deg, #141E30, #243B55);
      padding: 20px 40px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
    }
    .header-container {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .header-logo {
      font-size: 32px;
      font-weight: bold;
      letter-spacing: 2px;
      color: #E74C3C; /* 프리미엄 빨간색 */
      text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.3);
      text-decoration: none;
    }
    .header-nav ul {
      list-style: none;
      display: flex;
      gap: 20px;
    }
    .header-nav ul li a {
      font-size: 16px;
      color: #fff;
      text-decoration: none;
      padding-bottom: 4px;
      position: relative;
      transition: color 0.3s;
    }
    .header-nav ul li a:after {
      content: "";
      position: absolute;
      left: 0;
      bottom: 0;
      width: 0;
      height: 2px;
      background: #fff;
      transition: width 0.3s;
    }
    .header-nav ul li a:hover {
      color: #ddd;
    }
    .header-nav ul li a:hover:after {
      width: 100%;
    }
    /* 슬라이드 영역 */
    .slider {
      width: 100%;
      max-width: 1400px;
      margin: 20px auto;
      overflow: hidden;
      position: relative;
      border: 4px solid #243B55;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
    }
    .slider img {
      width: 100%;
      height: auto;
      display: block;
      opacity: 1;
      transition: opacity 1s ease-in-out;
    }
    /* 기존 콘텐츠 영역 (예: 버튼, 추천상품 등) */
    .content {
      padding: 20px;
    }
  </style>
</head>
<body>
  <!-- 헤더 영역 (로고 클릭 시 index.html로 이동) -->
  <header class="header">
    <div class="header-container">
      <a href="index.html" class="header-logo">momQ</a>
      <nav class="header-nav">
        <ul>
          <li><a href="#">홈</a></li>
          <li><a href="#">제품</a></li>
          <li><a href="#">이벤트</a></li>
          <li><a href="community.html">커뮤니티</a></li>
          <li><a href="#">문의하기</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <!-- 슬라이드 영역 (5초마다 이미지 전환) -->
  <section class="slider">
    <img id="slider-image" src="https://img.makeshop.co.kr/4/29457/202505/e884ed9ac295c362bcc500ec35759ca6.jpg" alt="슬라이드 이미지">
  </section>

  <!-- 기존 index.html 콘텐츠 영역 (예시) -->
  <div class="content">
    <p>여기에 기존 index.html의 콘텐츠가 들어갑니다. (예: 버튼, 추천 상품, 게시물 등)</p>
  </div>

  <script>
    // 슬라이드에 사용할 이미지 배열 (기존 이미지 + 새로운 이미지)
    const images = [
      "https://img.makeshop.co.kr/4/29457/202505/e884ed9ac295c362bcc500ec35759ca6.jpg",
      "https://img.makeshop.co.kr/4/29457/202505/65ab5e1d661a882151f87e4ab7a9748e.jpg"
    ];
    let currentIndex = 0;
    const sliderImage = document.getElementById("slider-image");

    setInterval(() => {
      currentIndex = (currentIndex + 1) % images.length;
      // 간단한 페이드 아웃 후 이미지 교체 (0.5초 후 페이드 인)
      sliderImage.style.opacity = 0;
      setTimeout(() => {
        sliderImage.src = images[currentIndex];
        sliderImage.style.opacity = 1;
      }, 500);
    }, 5000);
  </script>
</body>
</html>
