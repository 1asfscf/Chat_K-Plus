<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>momQ 홈</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f9f9f9;
    }
    header {
      background-color: #fff;
      padding: 10px 20px;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .slider {
      position: relative;
      max-width: 1200px;
      margin: 20px auto;
      overflow: hidden;
    }
    .slider img {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 8px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
    }
    .header-notice-link {
      font-size: 18px;
      color: #333;
      text-decoration: none;
      padding: 8px 12px;
      border: 1px solid transparent;
      transition: all 0.3s ease;
      margin-left: 20px;
    }
    .header-notice-link:hover {
      background-color: #333;
      color: #fff;
      border-color: #333;
    }
    .menu-buttons-section {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      margin: 20px 0;
    }
    .menu-button {
      margin: 10px;
      padding: 10px;
      border: none;
      background-color: #fff;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
      cursor: pointer;
      transition: transform 0.2s;
    }
    .menu-button:hover {
      transform: scale(1.05);
    }
    .menu-button img {
      max-width: 100px;
      height: auto;
    }
  </style>
</head>
<body>
  <header>
    <div class="header-left">
      <div class="menu-icon">☰</div>
      <a href="index.html" class="logo">momQ</a>
      <a href="notice.html" class="header-notice-link">공지사항</a>
    </div>
    <div class="header-right">
      <div class="search-bar">
        <input type="text" placeholder="검색" />
        <button type="button">🔍</button>
      </div>
      <div class="icons">
        <span class="icon chat-icon">💬</span>
        <span class="icon cart-icon">
          🛒<small class="badge">0</small>
        </span>
        <span class="icon profile-icon">👤</span>
      </div>
    </div>
  </header>

  <!-- 슬라이드 이미지 영역 -->
  <div class="slider">
    <img id="slide1" class="header-banner" src="https://img.makeshop.co.kr/4/29457/202504/be565292ad4c3d90c670a84df580d0f5.png" alt="momQ 홍보 이미지">
    <img id="slide2" class="header-banner" src="https://img.makeshop.co.kr/4/29457/202505/e884ed9ac295c362bcc500ec35759ca6.jpg" alt="momQ 추가 이미지">
    <img id="slide3" class="header-banner" src="https://img.makeshop.co.kr/4/29457/202505/e884ed9ac295c362bcc500ec35759ca6.jpg" alt="momQ 세 번째 이미지">
  </div>

  <!-- 10개 메뉴 버튼 영역 -->
  <section class="menu-buttons-section">
    <div class="menu-buttons">
      <button class="menu-button">
        <img src="https://www.momq.co.kr/shopimages/2020nemomq/2020_logo.png" alt="웰컴혜택">
        <span>웰컴혜택</span>
      </button>
      <button class="menu-button">
        <img src="https://www.momq.co.kr/shopimages/2020nemomq/2020_logo.png" alt="허그박스">
        <span>허그박스</span>
      </button>
      <button class="menu-button">
        <img src="https://www.momq.co.kr/shopimages/2020nemomq/2020_logo.png" alt="맘큐라이브">
        <span>맘큐라이브</span>
      </button>
      <button class="menu-button">
        <img src="https://www.momq.co.kr/shopimages/2020nemomq/2020_logo.png" alt="쿠폰/포인트">
        <span>쿠폰/포인트</span>
      </button>
      <button class="menu-button">
        <img src="https://www.momq.co.kr/shopimages/2020nemomq/2020_logo.png" alt="커뮤니티">
        <span>커뮤니티</span>
      </button>
      <button class="menu-button">
        <img src="https://www.momq.co.kr/shopimages/2020nemomq/2020_logo.png" alt="샘플신청">
        <span>샘플신청</span>
      </button>
      <button class="menu-button">
        <img src="https://www.momq.co.kr/shopimages/2020nemomq/2020_logo.png" alt="데일리리추어">
        <span>데일리리추어</span>
      </button>
      <button class="menu-button">
        <img src="https://www.momq.co.kr/shopimages/2020nemomq/2020_logo.png" alt="하기스 핏팅룸">
        <span>하기스 핏팅룸</span>
      </button>
      <button class="menu-button">
        <img src="https://www.momq.co.kr/shopimages/2020nemomq/2020_logo.png" alt="프리미엄 멤버십">
        <span>프리미엄 멤버십</span>
      </button>
      <button class="menu-button">
        <img src="https://www.momq.co.kr/shopimages/2020nemomq/2020_logo.png" alt="육아정보">
        <span>육아정보</span>
      </button>
    </div>
  </section>

  <!-- 추천 상품 영역 (기존 내용 그대로) -->
  <div class="recommended-products">
    <h2>추천 상품</h2>
    <div class="products-container">
      <a href="product.html">
        <div class="product-item">
          <img src="https://image.newdaily.co.kr/site/data/img/2018/06/15/2018061500077_0.jpg" alt="기저귀 1">
          <div class="product-details">
            <span class="product-name">기저귀 1</span>
