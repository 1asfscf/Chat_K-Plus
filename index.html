<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>티비 스포츠 — 서버 점검중</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --clr-bg: #0a0a0a;
      --clr-primary: #e50914;
      --clr-text: #eee;
      --clr-text-muted: #aaa;
      --header-h-pc: 56px;
      --header-h-mobile: 52px;
      --banner-height-pc: 300px;
      --banner-height-mobile: 200px;
    }
    * {margin:0; padding:0; box-sizing:border-box;}
    body {background:var(--clr-bg); color:var(--clr-text); font-family:'Noto Sans KR',sans-serif;}

    /* 헤더 */
    header {
      position:fixed; top:0; left:0; right:0;
      display:flex; align-items:center; justify-content:space-between;
      padding:0 24px; background:rgba(0,0,0,0.85);
      border-bottom:1px solid rgba(255,255,255,0.1);
      z-index:1000;
      height:var(--header-h-pc);
    }
    .logo {
      font-weight:900;
      font-size:24px;
      color:var(--clr-primary);
      letter-spacing:2px;
      user-select:none;
    }
    .pc-nav {display:none;} /* 메뉴는 비활성화 */

    /* 배너 */
    .banner-container {
      margin-top:var(--header-h-pc);
      height:var(--banner-height-pc);
      overflow:hidden;
      filter:grayscale(15%) contrast(92%);
    }
    .banner-slide {display:flex; width:200%; height:100%; transition:transform .6s;}
    .banner-item {width:50%;}
    .banner-item img {width:100%; height:100%; object-fit:cover;}

    /* 메인 안내 */
    main {padding:20px; max-width:960px; margin:0 auto;}
    .maintenance {
      min-height:calc(100vh - var(--header-h-pc) - var(--banner-height-pc));
      display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center;
    }
    .maintenance h1 {font:900 28px/1.3 'Noto Sans KR'; margin-bottom:14px; color:#fff;}
    .maintenance p {font:400 16px/1.6 'Noto Sans KR'; color:var(--clr-text-muted); margin-bottom:20px;}

    /* 상태 + 새로고침 */
    .loading {display:inline-flex; align-items:center; gap:12px; margin-bottom:20px; color:var(--clr-primary);}
    .spinner {
      width:22px; height:22px; border-radius:50%;
      border:2px solid rgba(229,9,20,0.35); border-top-color:var(--clr-primary);
      animation:spin 1s linear infinite;
    }
    .dots {display:inline-flex; gap:6px;}
    .dot {width:8px; height:8px; background:var(--clr-primary); border-radius:50%; animation:pulse 1.2s ease-in-out infinite;}
    .dot:nth-child(2){animation-delay:.15s;} .dot:nth-child(3){animation-delay:.3s;}

    .refresh-btn {
      background:rgba(229,9,20,0.2);
      color:#fff;
      border:1px solid rgba(229,9,20,0.5);
      border-radius:10px;
      padding:12px 18px;
      font:700 15px/1 'Noto Sans KR';
      display:inline-flex; align-items:center; gap:10px;
      cursor:pointer;
      transition:transform .06s ease, background .25s ease, border-color .25s ease;
    }
    .refresh-btn:active {transform:scale(0.97);}
    .refresh-icon {width:18px; height:18px; position:relative;}
    .refresh-icon::before, .refresh-icon::after {
      content:''; position:absolute; inset:0;
      border:2px solid rgba(255,255,255,0.25);
      border-top-color:#fff; border-radius:50%;
    }
    .refresh-icon.active::before {animation:spin .9s linear infinite;}
    .refresh-icon.active::after {animation:spinReverse 1.6s linear infinite; opacity:.4;}

    @keyframes spin {to{transform:rotate(360deg);}}
    @keyframes spinReverse {to{transform:rotate(-360deg);}}
    @keyframes pulse {0%,100%{transform:scale(1);opacity:.35;}50%{transform:scale(1.35);opacity:1;}}

    /* 모바일 */
    @media(max-width:767px){
      header{height:var(--header-h-mobile); padding:0 16px;}
      .logo{font-size:20px;}
      .banner-container{height:var(--banner-height-mobile); margin-top:var(--header-h-mobile);}
      .maintenance{min-height:calc(100vh - var(--header-h-mobile) - var(--banner-height-mobile)); padding:20px;}
      .maintenance h1{font-size:22px;}
      .maintenance p{font-size:15px;}
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">티비 스포츠</div>
  </header>

  <div class="banner-container">
    <div class="banner-slide">
      <div class="banner-item"><img src="https://t1.daumcdn.net/brunch/service/user/7onF/image/-UOqf4TxgKFINfDx34hOWbrQpL4.png" alt="점검 배너1"></div>
      <div class="banner-item"><img src="https://i.ytimg.com/vi/e3usuzCDe4k/mqdefault.jpg" alt="점검 배너2"></div>
    </div>
  </div>

  <main>
    <section class="maintenance">
      <h1>서버 점검중입니다</h1>
      <p>더 나은 서비스를 위해 현재 점검을 진행하고 있습니다.<br>잠시 후 다시 접속해 주세요.</p>

      <div class="loading">
        <div class="spinner"></div>
        <span>상태</span>
        <span class="dots"><i class="dot"></i><i class="dot"></i><i class="dot"></i></span>
      </div>

      <button type="button" class="refresh-btn" id="refreshBtn">
        <span class="refresh-icon" id="refreshIcon"></span>
        <span>새로고침</span>
      </button>
    </section>
  </main>

  <script>
    const refreshBtn = document.getElementById('refreshBtn');
    const refreshIcon = document.getElementById('refreshIcon');
    if(refreshBtn){
      refreshBtn.addEventListener('click',()=>{
        refreshIcon.classList.add('active');
        setTimeout(()=>{ location.reload(true); },200);
      });
    }
  </script>
</body>
</html>
