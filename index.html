<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>Chat K Plus v10</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="logo">🔥 Chat K Plus</div>
      <button class="new-chat" id="newChatBtn">+ 새 채팅</button>
      <div class="history" id="history"></div>
    </aside>

    <main class="chat-wrap">
      <header class="chat-header">
        <div class="header-left">
          <button class="menu-btn" id="menuBtn">☰</button>
        </div>
        
        <div class="header-center">
          <h1>Chat K Plus</h1>
        </div>
        
        <div class="header-right">
          <button class="theme-toggle" id="themeToggle">
            <span class="icon">🌙</span>
            <span class="text">다크</span>
          </button>
        </div>
      </header>

      <div class="welcome-screen" id="welcomeScreen">
        <div class="welcome-logo">🔥</div>
        <h2 class="welcome-title" id="welcomeTitle">성민, Chat K Plus 켜졌다</h2>
        <p class="welcome-sub">Chat K Plus한테 뭐든지 물어봐</p>
        
        <div class="example-grid">
          <div class="example-card" data-prompt="5.18 광주민주화운동 왜곡 사례 5가지 알려줘">
            <div class="icon">📚</div>
            <div class="title">역사 팩트체크</div>
            <div class="desc">5.18 왜곡 패턴 분석해줘</div>
          </div>
          <div class="example-card" data-prompt="깃허브 페이지에서 CSS 깨지는 이유랑 해결법">
            <div class="icon">💻</div>
            <div class="title">개발 디버깅</div>
            <div class="desc">CSS 정렬 버그 잡아줘</div>
          </div>
          <div class="example-card" data-prompt="아이폰 12 Pro에서 클릭 안 되는 이유">
            <div class="icon">📱</div>
            <div class="title">iOS 호환성</div>
            <div class="desc">사파리 터치 버그 해결</div>
          </div>
          <div class="example-card" data-prompt="사양이 궁금해">
            <div class="icon">⚡</div>
            <div class="title">시스템 정보</div>
            <div class="desc">Chat K Plus 스펙 알려줘</div>
          </div>
        </div>
      </div>

      <div class="chat-list" id="chatList"></div>

      <footer class="input-area">
        <div class="input-wrapper">
          <textarea 
            id="userInput" 
            placeholder="Chat K Plus에게 물어보세요..." 
            rows="1"></textarea>
          <button id="sendBtn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/>
            </svg>
          </button>
        </div>
      </footer>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
