<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>momQ 스타일 쇼핑몰</title>
    <style>
        /* 전체 스타일 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Noto Sans KR', sans-serif;
        }
        body {
            background-color: #f8f9fa;
            color: #333;
        }
        /* 헤더 */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background-color: #ffffff;
            padding: 20px 40px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        .header-logo {
            font-size: 24px;
            font-weight: bold;
            color: #004085;
        }
        .header-nav ul {
            list-style: none;
            display: flex;
        }
        .header-nav ul li {
            margin: 0 20px;
        }
        .header-nav ul li a {
            color: #333;
            text-decoration: none;
            font-weight: bold;
            font-size: 16px;
        }
        .header-nav ul li a:hover {
            color: #007bff;
        }
        /* 히어로 섹션 */
        .hero {
            text-align: center;
            padding: 80px 20px;
            background: url('banner.jpg') no-repeat center center/cover;
            color: white;
        }
        .hero h2 {
            font-size: 32px;
            font-weight: bold;
        }
        .hero p {
            font-size: 18px;
            margin: 15px 0;
        }
        .cta-button {
            padding: 12px 24px;
            background-color: #ff6b6b;
            color: white;
            border: none;
            cursor: pointer;
            font-size: 18px;
            border-radius: 5px;
        }
        .cta-button:hover {
            background-color: #d43f3f;
        }
        /* 버튼 요소 */
        .buttons-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            padding: 50px;
        }
        .button-box {
            background: white;
            padding: 15px;
            margin: 10px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            text-align: center;
            width: 180px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .button-box:hover {
            background-color: #f1f1f1;
        }
        footer {
            text-align: center;
            padding: 20px;
            background-color: #f1f1f1;
            color: #666;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="header-logo">momQ 쇼핑몰</div>
        <nav class="header-nav">
            <ul>
                <li><a href="#">홈</a></li>
                <li><a href="#">제품</a></li>
                <li><a href="#">이벤트</a></li>
                <li><a href="#">커뮤니티</a></li>
                <li><a href="#">문의하기</a></li>
            </ul>
        </nav>
    </header>
    <section class="hero">
        <h2>물가 역주행! 초특가 육아템 균일가전</h2>
        <p>#4,900원~ #아이간식 #식기류</p>
        <button class="cta-button">더 알아보기</button>
    </section>
    <section class="buttons-container">
        <div class="button-box">웰컴혜택</div>
        <div class="button-box">허그박스</div>
        <div class="button-box">맘큐라이브</div>
        <div class="button-box">쿠폰/포인트</div>
        <div class="button-box">커뮤니티</div>
        <div class="button-box">샘플신청</div>
        <div class="button-box">데일리퍼즐</div>
        <div class="button-box">피팅룸</div>
        <div class="button-box">프리미엄</div>
        <div class="button-box">육아정보</div>
    </section>
    <footer>
        © 2025 momQ 스타일. 모든 권리 보유.
    </footer>
</body>
</html>
