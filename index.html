<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>티비 스포츠</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
  <style>
    /* ─────────────── 공통 변수 ─────────────── */
    :root {
      --clr-bg: #0a0a0a;
      --clr-primary: #e50914;
      --clr-text: #eee;
      --clr-text-secondary: #aaa;
      --header-h-pc: 56px;
      --header-h-mobile: 48px;
      --touch-target: 44px;
      --hamburger-size: 48px;
      --logo-size-pc: 28px;
      --logo-size-mobile: 24px;
      --nav-font: 16px;
      --hover-transition: 0.3s ease;
      --card-elevate-y: -8px;
      --banner-height-pc: 300px;
      --banner-height-mobile: 180px;
    }
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0; padding: 0;
    }
    body {
      background: var(--clr-bg);
      color: var(--clr-text);
      font-family: 'Noto Sans KR', sans-serif;
      overflow-x: hidden;
    }

    /* ─────────────── 헤더 기본 스타일 ─────────────── */
    header {
      position: fixed; top: 0; left: 0; right: 0;
      display: flex; align-items: center;
      padding: 0 16px;
      background: rgba(0,0,0,0.85);
      backdrop-filter: saturate(180%) blur(10px);
      -webkit-backdrop-filter: saturate(180%) blur(10px);
      border-bottom: 1px solid rgba(255,255,255,0.1);
      z-index: 1000;
      transition: height 0.3s ease;
    }
    .logo {
      font-family: 'Noto Sans KR', sans-serif;
      color: var(--clr-primary);
      user-select: none; flex-shrink: 0;
    }
    
    .hamburger, .header-icons { display: none; }
    
    .pc-nav {
      display: flex; gap: 32px; flex: 1;
    }
    .pc-nav a {
      font: 600 var(--nav-font)/1 'Noto Sans KR';
      color: var(--clr-text);
      position: relative;
      padding: 12px 16px;
      display: flex; align-items: center;
      transition: color var(--hover-transition), background var(--hover-transition);
      text-decoration: none; border-radius: 6px;
    }

    /* ─────────────── PC 전용 헤더 스타일 (중앙 정렬) ─────────────── */
    @media (min-width: 768px) {
      header {
        height: var(--header-h-pc);
        justify-content: center;
      }
      .logo {
        position: absolute;
        left: 24px; top: 50%;
        transform: translateY(-50%);
        font-size: var(--logo-size-pc);
        letter-spacing: 4px;
      }
      .pc-nav {
        justify-content: center;
      }
      .pc-nav a:hover {
        color: var(--clr-primary);
        background: rgba(229,9,20,0.15);
      }
      .pc-nav a.active::after {
        content: '';
        position: absolute; bottom: 4px; left:50%;
        transform: translateX(-50%);
        width:60%; height:2px;
        background: var(--clr-primary);
        border-radius:1px;
      }
    }
    
    /* ─────────────── 배너 슬라이드 ─────────────── */
    .banner-container {
      position: relative;
      margin-top: var(--header-h-pc);
      width: 100%;
      height: var(--banner-height-pc);
      overflow: hidden;
    }
    .banner-slide {
      display: flex; width: 200%; height: 100%;
      transition: transform 0.6s ease-in-out;
    }
    .banner-item {
      width: 50%; flex-shrink: 0;
    }
    .banner-item img {
      width: 100%; height: 100%; object-fit: cover; display: block;
    }
    .banner-controls {
      position: absolute; bottom: 16px; left: 50%;
      transform: translateX(-50%);
      display: flex; gap: 8px;
    }
    .banner-dot {
      width: 10px; height: 10px;
      background: rgba(255,255,255,0.6);
      border-radius: 50%; cursor: pointer; transition: background 0.3s;
    }
    .banner-dot.active { background: var(--clr-primary); }

    /* ─────────────── 본문 ─────────────── */
    main {
      padding: 16px;
      max-width: 1280px; margin: 0 auto;
    }
    .category-filters, .mobile-nav-drawer, .mobile-bottom-nav { display: none; }
    
    .section-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
    }
    .section-title {
      font: 700 18px/1.2 'Noto Sans KR'; margin-bottom: 0;
    }
    .view-all {
        color: var(--clr-text-secondary);
        font-size: 13px;
        text-decoration: none;
    }
    .top20-list, .new-releases-list {
      display:flex; gap:12px; overflow-x:auto; scroll-behavior:smooth; padding-bottom:12px;
      -webkit-overflow-scrolling: touch; scroll-snap-type: x mandatory;
    }
    .top20-list::-webkit-scrollbar, .new-releases-list::-webkit-scrollbar { display: none; }
    .content-item {
      position: relative; flex:0 0 120px; border-radius:8px;
      cursor:pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      scroll-snap-align:start; -webkit-tap-highlight-color:transparent;
    }
    .content-item .poster {
        border-radius:8px;
        overflow: hidden;
        position: relative;
    }
    @media (hover: hover) and (pointer: fine) {
      .content-item:hover {
        transform: translateY(var(--card-elevate-y)) scale(1.03);
        box-shadow: 0 8px 16px rgba(0,0,0,0.6);
      }
    }
    .content-item:active {
      transform: translateY(var(--card-elevate-y)) scale(1.02);
      box-shadow: 0 12px 24px rgba(0,0,0,0.7);
    }
    .content-item img {
      width:100%; aspect-ratio:2/3; object-fit:cover; display:block;
    }
    .card-title {
        color: var(--clr-text);
        font-size: 13px;
        margin-top: 8px;
        text-align: left;
        padding: 0 2px;
    }
    .rank {
      position:absolute; top:4px; right:4px; padding:2px 5px;
      font:900 14px/1 'Noto Sans KR'; color:#fff;
      text-shadow:0 0 4px rgba(0,0,0,0.8);
      background-color: rgba(0,0,0,0.7);
      border-radius: 4px;
    }
    .label {
      position:absolute; top:8px; left:8px; padding:3px 6px;
      font:700 10px/1 'Noto Sans KR'; border-radius:3px; color:#fff; background:var(--clr-primary);
    }
    .label.only { background:#00a8ff; }

    /* ─────────────── 모바일 UI 업그레이드 ─────────────── */
    @media (max-width: 767px) {
      header {
        height: var(--header-h-mobile);
        justify-content: space-between;
        padding: 0 8px 0 16px;
      }
      .logo {
        position: static;
        transform: none;
        font-size: var(--logo-size-mobile);
        letter-spacing: 2px;
      }
      .pc-nav {
        display: flex; flex: 1; gap: 0;
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
        -ms-overflow-style: none; scrollbar-width: none;
        margin: 0 8px;
      }
      .pc-nav::-webkit-scrollbar { display: none; }
      .pc-nav a {
        padding: 8px 12px;
        white-space: nowrap;
        font-size: 14px;
        color: var(--clr-text-secondary);
      }
      .pc-nav a.active {
        font-weight: 700;
        color: var(--clr-text);
      }
      .pc-nav a.active::after {
        content: '';
        position: absolute; bottom: 0; left:50%;
        transform: translateX(-50%);
        width: 40%; height: 2px;
        background: var(--clr-text);
      }
      .header-icons {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .header-icons button {
        background: none; border: none; padding: 8px; color: var(--clr-text);
      }
      .banner-container {
        height: var(--banner-height-mobile);
        margin-top: var(--header-h-mobile);
      }
      .category-filters {
        display: flex;
        gap: 8px;
        padding: 16px 0;
        overflow-x: auto;
        -ms-overflow-style: none; scrollbar-width: none;
      }
      .category-filters::-webkit-scrollbar { display: none; }
      .category-filters .filter-btn {
        background: #222;
        color: var(--clr-text);
        border: none;
        padding: 8px 16px;
        border-radius: 20px;
        font-size: 14px;
        white-space: nowrap;
        flex-shrink: 0;
      }
      .mobile-nav-drawer {
        display:flex; position:fixed; top:0; bottom:0; right:0;
        width:280px; max-width:85%; background:#111;
        transform:translateX(100%); transition:transform .35s ease;
        flex-direction:column; padding:var(--header-h-mobile) 20px 20px;
        overflow-y:auto; z-index:999;
      }
      .mobile-nav-drawer a {
        font:600 18px/1.5 'Noto Sans KR'; color:#fff;
        padding:16px 0; text-decoration:none; border-bottom:1px solid #333;
      }
      .mobile-nav-drawer.open { transform:translateX(0); }
      .mobile-bottom-nav {
        display:flex; position:fixed; bottom:0; left:0; right:0;
        height:56px; background:#111; border-top:1px solid #222;
        justify-content:space-around; align-items:center;
        padding:4px 0 env(safe-area-inset-bottom); z-index:10000;
      }
      .bottom-nav-btn {
        background:none; border:0; color: var(--clr-text-secondary); font-size:11px;
        display:flex; flex-direction:column; align-items:center;
        padding:6px 8px; border-radius:6px;
        min-width:var(--touch-target); min-height:var(--touch-target);
        transition:all var(--hover-transition);
        cursor: pointer;
      }
      .bottom-nav-btn svg {
          stroke: currentColor;
          fill: none;
          stroke-width: 1.5px;
          transition: all 0.2s;
      }
      .bottom-nav-btn.active {
        color: var(--clr-text);
        font-weight: 700;
      }
      .bottom-nav-btn.active.home-icon svg {
        fill: currentColor;
        stroke: none;
      }
      main {
        padding-bottom: 72px;
      }
    }
  </style>
</head>
<body>

  <header>
    <button class="hamburger" aria-label="메뉴 열기" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
    <div class="logo" aria-label="티비 스포츠 로고">티비 스포츠</div>
    <nav class="pc-nav" role="navigation" aria-label="주요 메뉴">
      <a href="#">실시간</a>
      <a href="#" class="active">TV프로그램</a>
      <a href="#">영화</a>
      <a href="#">파라운트+</a>
      <a href="#">키즈</a>
    </nav>
    <div class="header-icons">
        <button aria-label="캐스트">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 16.1A5 5 0 0 1 5.9 20M2 12.05A9 9 0 0 1 9.95 20M2 8a13 13 0 0 1 13 13m4-1-2-2-2 2"/></svg>
        </button>
        <button aria-label="프로필">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="var(--clr-primary)"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
        </button>
    </div>
  </header>

  <nav class="mobile-nav-drawer" aria-label="모바일 메뉴">
    <a href="#" class="active">실시간</a>
    <a href="#">TV프로그램</a>
    <a href="#">영화</a>
    <a href="#">파라운트+</a>
    <a href="#">키즈</a>
  </nav>

  <!-- 배너 슬라이드 -->
  <div class="banner-container">
    <div class="banner-slide" id="bannerSlide">
      <div class="banner-item">
        <img src="https://t1.daumcdn.net/brunch/service/user/7onF/image/-UOqf4TxgKFINfDx34hOWbrQpL4.png" alt="배너1">
      </div>
      <div class="banner-item">
        <img src="https://i.ytimg.com/vi/e3usuzCDe4k/mqdefault.jpg" alt="배너2">
      </div>
    </div>
    <div class="banner-controls">
      <div class="banner-dot active" data-index="0"></div>
      <div class="banner-dot" data-index="1"></div>
    </div>
  </div>

  <main>
    <section class="category-filters" aria-label="콘텐츠 카테고리">
      <button class="filter-btn">드라마</button>
      <button class="filter-btn">예능</button>
      <button class="filter-btn">해외시리즈</button>
      <button class="filter-btn">애니메이션</button>
    </section>
    
    <section class="top20" aria-label="님이 좋아할만한 프로그램">
        <div class="section-header">
            <h2 class="section-title">님이 좋아할만한 프로그램</h2>
        </div>
        <div class="top20-list">
            <div class="content-item">
                <div class="poster">
                    <img src="https://image.tving.com/ntgs/contents/CTC/caip/CAIP0900/ko/20231116/0710/P000587159.jpg/dims/resize/F_webp,400" alt="대방출" loading="lazy" decoding="async">
                    <span class="label">NEW</span>
                </div>
                <div class="card-title">대방출</div>
            </div>
            <div class="content-item">
                <div class="poster">
                    <img src="https://image.tving.com/ntgs/contents/CTC/caip/CAIP0900/ko/20240307/0930/P001753352.jpg/dims/resize/F_webp,400" alt="눈물의 여왕" loading="lazy" decoding="async">
                </div>
                <div class="card-title">눈물의 여왕</div>
            </div>
            <div class="content-item">
                <div class="poster">
                    <img src="https://image.tving.com/ntgs/contents/CTC/caip/CAIP0900/ko/20240124/0226/P001752535.jpg/dims/resize/F_webp,400" alt="웨딩 임파서블" loading="lazy" decoding="async">
                    <span class="label only">ONLY</span>
                    <span class="rank">19</span>
                </div>
                <div class="card-title">웨딩 임파서블</div>
            </div>
            <div class="content-item">
                <div class="poster">
                    <img src="https://image.tving.com/ntgs/contents/CTC/caip/CAIP0900/ko/20250507/1456/P001492081.jpg/dims/resize/F_webp,400" alt="나는 솔로" loading="lazy" decoding="async">
                </div>
                <div class="card-title">나는 솔로</div>
            </div>
        </div>
    </section>

    <section class="new-releases" aria-label="새로 시작한 프로그램">
        <div class="section-header">
            <h2 class="section-title">새로 시작한 프로그램</h2>
            <a href="#" class="view-all">전체보기 ></a>
        </div>
        <div class="new-releases-list">
            <div class="content-item">
                <div class="poster">
                    <img src="https://image.tving.com/ntgs/contents/CTC/caip/CAIP0900/ko/20250622/1530/P001773168.jpg/dims/resize/F_webp,400" alt="오은영 스테이" loading="lazy" decoding="async">
                    <span class="label">NEW</span>
                </div>
                <div class="card-title">오은영 스테이</div>
            </div>
            <div class="content-item">
                <div class="poster">
                    <img src="https://img.tving.com/uploaded_images/contents/2024/07/20240724123956_0.jpg" alt="한성" loading="lazy" decoding="async">
                    <span class="label only">ONLY</span>
                </div>
                <div class="card-title">한성</div>
            </div>
            <!-- 필요에 따라 아이템 추가 -->
        </div>
    </section>
  </main>

  <nav class="mobile-bottom-nav" role="navigation" aria-label="모바일 하단 메뉴">
    <button class="bottom-nav-btn active home-icon" aria-label="홈">
      <svg width="24" height="24" viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg><span>홈</span>
    </button>
    <button class="bottom-nav-btn" aria-label="공개예정">
      <svg width="24" height="24" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 14H9V8h2v8zm4 0h-2V8h2v8z"/></svg><span>공개예정</span>
    </button>
    <button class="bottom-nav-btn" aria-label="검색">
      <svg width="24" height="24" viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg><span>검색</span>
    </button>
    <button class="bottom-nav-btn" aria-label="기록">
      <svg width="24" height="24" viewBox="0 0 24 24"><path d="M11.99 2C6.47 2 2 6.47 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm.5-13H11v6l5.25 3.15.75-1.23-4.5-2.67z"/></svg><span>기록</span>
    </button>
  </nav>

  <script>
    const initMobileNav = () => {
      // 햄버거 버튼이 없으므로 이 기능은 현재 UI에선 사용되지 않지만,
      // 코드 삭제 방지 요청에 따라 그대로 유지합니다.
      const drawer = document.querySelector('.mobile-nav-drawer');
      const burger = document.querySelector('.hamburger');
      if (!drawer || !burger) return;
      burger.addEventListener('click', () => {
          const isOpen = drawer.classList.toggle('open');
          burger.setAttribute('aria-expanded', isOpen.toString());
      });
    };
    const initBannerSlide = () => {
      const slide = document.getElementById('bannerSlide');
      const dots = document.querySelectorAll('.banner-dot');
      if (!slide || dots.length === 0) return;
      let current = 0;
      let slideInterval;
      const goToSlide = (index) => {
        if (!dots[index]) return;
        slide.style.transform = `translateX(-${index * (100 / dots.length)}%)`;
        dots.forEach(d => d.classList.remove('active'));
        dots[index].classList.add('active');
        current = index;
      };
      const startAutoSlide = () => {
        stopAutoSlide();
        slideInterval = setInterval(() => {
          goToSlide((current + 1) % dots.length);
        }, 5000);
      };
      const stopAutoSlide = () => clearInterval(slideInterval);
      dots.forEach(dot => {
        dot.addEventListener('click', (e) => {
          goToSlide(Number(e.target.dataset.index));
          startAutoSlide();
        });
      });
      startAutoSlide();
    };
    document.addEventListener('DOMContentLoaded', () => {
      if (window.matchMedia('(max-width: 767px)').matches) {
          initMobileNav();
      }
      initBannerSlide();
    });
  </script>
</body>
</html>
