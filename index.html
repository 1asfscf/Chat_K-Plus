<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>티빙 스타일 다시보기 UI</title>
<style>
  :root {
    --bg-dark: #141414;
    --bg-darker: #0f0f0f;
    --text-light: #e0e0e0;
    --accent: #ff5e00;
    --gray-dark: #222;
    --gray-light: #555;
  }
  * {
    margin: 0; padding: 0; box-sizing: border-box;
  }
  body {
    font-family: 'Noto Sans KR', sans-serif, sans-serif;
    background-color: var(--bg-dark);
    color: var(--text-light);
    min-height: 100vh;
  }
  a {
    color: var(--text-light);
    text-decoration: none;
  }
  a:hover {
    color: var(--accent);
  }
  header {
    background: var(--bg-darker);
    padding: 12px 24px;
    position: sticky;
    top: 0;
    z-index: 1000;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid #222;
  }
  .logo {
    font-weight: 900;
    font-size: 28px;
    color: var(--accent);
    letter-spacing: 2px;
    cursor: pointer;
  }
  nav {
    flex: 1;
    margin: 0 40px;
  }
  nav ul {
    display: flex;
    gap: 28px;
    list-style: none;
    font-weight: 600;
    font-size: 15px;
  }
  nav ul li {
    cursor: pointer;
    white-space: nowrap;
  }
  nav ul li:hover {
    color: var(--accent);
  }
  .user-area {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .user-area input[type="search"] {
    background: #222;
    border: none;
    border-radius: 20px;
    padding: 6px 14px;
    color: var(--text-light);
    font-size: 14px;
    width: 180px;
    transition: width 0.3s ease;
  }
  .user-area input[type="search"]::placeholder {
    color: var(--gray-light);
  }
  .user-area input[type="search"]:focus {
    outline: none;
    width: 240px;
  }
  .profile-icon {
    background: var(--accent);
    width: 36px;
    height: 36px;
    border-radius: 50%;
    font-weight: 700;
    font-size: 18px;
    display: flex;
    justify-content: center;
    align-items: center;
    cursor: pointer;
    user-select: none;
  }
  .main-banner {
    position: relative;
    width: 100%;
    height: 420px;
    background: url('https://tving.com/images/main_banner.jpg') center center/cover no-repeat;
    margin-bottom: 40px;
  }
  .main-banner-text {
    position: absolute;
    bottom: 40px;
    left: 40px;
    color: white;
    font-size: 28px;
    font-weight: 700;
    text-shadow: 0 0 10px rgba(0,0,0,0.7);
  }
  section {
    margin-bottom: 40px;
  }
  h2.section-title {
    font-size: 22px;
    font-weight: 700;
    margin-bottom: 16px;
    padding-left: 8px;
  }
  .slider {
    display: flex;
    overflow-x: auto;
    gap: 14px;
    padding-bottom: 8px;
    scroll-behavior: smooth;
  }
  .slider::-webkit-scrollbar {
    height: 8px;
  }
  .slider::-webkit-scrollbar-thumb {
    background: var(--accent);
    border-radius: 4px;
  }
  .slider::-webkit-scrollbar-track {
    background: var(--gray-dark);
  }
  .content-card {
    min-width: 140px;
    background: var(--bg-darker);
    border-radius: 8px;
    overflow: hidden;
    cursor: pointer;
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    transition: transform 0.3s ease, box-shadow 0.3s ease;
    position: relative;
  }
  .content-card:hover {
    transform: translateY(-6px);
    box-shadow: 0 8px 20px rgba(255,94,0,0.6);
  }
  .content-card img {
    width: 100%;
    aspect-ratio: 2/3;
    object-fit: cover;
    background: #111;
  }
  .content-card .title {
    padding: 8px 10px;
    font-size: 14px;
    font-weight: 600;
    color: var(--text-light);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .content-card .badge {
    position: absolute;
    top: 8px;
    left: 8px;
    background: var(--accent);
    color: #fff;
    font-size: 11px;
    font-weight: 700;
    padding: 2px 6px;
    border-radius: 4px;
  }
  .placeholder-img {
    display: flex;
    justify-content: center;
    align-items: center;
    background: #333;
    color: var(--gray-light);
    font-size: 13px;
    font-weight: 600;
    height: 210px;
  }
  @media (max-width: 768px) {
    header {
      flex-wrap: wrap;
      padding: 12px 16px;
    }
    nav {
      margin: 12px 0;
      width: 100%;
    }
    nav ul {
      justify-content: center;
      gap: 16px;
      flex-wrap: wrap;
    }
    .user-area input[type="search"] {
      width: 140px;
    }
    .user-area input[type="search"]:focus {
      width: 180px;
    }
    .slider {
      gap: 10px;
    }
    .content-card {
      min-width: 120px;
    }
    .main-banner {
      height: 280px;
    }
    .main-banner-text {
      font-size: 20px;
      bottom: 20px;
      left: 20px;
    }
  }
  @media (max-width: 480px) {
    header {
      padding: 12px 12px;
    }
    nav ul {
      gap: 12px;
      font-size: 14px;
    }
    .user-area input[type="search"] {
      width: 100px;
    }
    .user-area input[type="search"]:focus {
      width: 140px;
    }
    .content-card {
      min-width: 100px;
    }
  }
</style>
</head>
<body>
<header>
  <div class="logo">TVING</div>
  <nav>
    <ul>
      <li>홈</li>
      <li>실시간</li>
      <li>TVING 오리지널</li>
      <li>영화</li>
      <li>파라마운트+</li>
    </ul>
  </nav>
  <div class="user-area">
    <input type="search" placeholder="검색" />
    <div class="profile-icon">박</div>
  </div>
</header>

<main>
  <div class="main-banner">
    <div class="main-banner-text">새로 티빙을 만나다</div>
  </div>

  <section>
    <h2 class="section-title">티빙에서 꼭 봐야하는 콘텐츠</h2>
    <div class="slider" id="tv-programs-slider"></div>
  </section>

  <section>
    <h2 class="section-title">인기 콘텐츠</h2>
    <div class="slider" id="popular-contents-slider"></div>
  </section>
</main>

<script>
  const placeholderImg = "https://via.placeholder.com/280x420/333333/AAAAAA?text=준비중";

  const tvPrograms = [
    { title: "해피니스", img: "https://image.tving.com/upload/contents/2023/06/01/1000000000_0000000000_0000000000.jpg", badge: "ORIGINAL" },
    { title: "러브캐처 인 서울", img: "https://image.tving.com/upload/contents/2023/06/01/1000000000_0000000001_0000000001.jpg", badge: "ORIGINAL" },
    { title: "슬픈도시여자들", img: "https://image.tving.com/upload/contents/2023/06/01/1000000000_0000000002_0000000002.jpg", badge: "ORIGINAL" },
    { title: "어른연습생", img: "https://image.tving.com/upload/contents/2023/06/01/1000000000_0000000003_0000000003.jpg", badge: "ORIGINAL" },
    { title: "가상세계재단 스타가 되고 싶어", img: "https://image.tving.com/upload/contents/2023/06/01/1000000000_0000000004_0000000004.jpg", badge: "ORIGINAL" },
    { title: "EMERGENCY", img: null, badge: "ORIGINAL" }
  ];

  const popularContents = [
    { title: "재벌집 막내아들", img: "https://image.tving.com/upload/contents/2023/06/01/1000000000_0000000005_0000000005.jpg" },
    { title: "술꾼도시여자들", img: null },
    { title: "유미의 세포들", img: "https://image.tving.com/upload/contents/2023/06/01/1000000000_0000000006_0000000006.jpg" },
    { title: "이재, 곧 죽습니다", img: null },
    { title: "내 남편과 결혼해줘", img: "https://image.tving.com/upload/contents/2023/06/01/1000000000_0000000007_0000000007.jpg" },
    { title: "선재 업고 튀어", img: null }
  ];

  function createCard(item) {
    const card = document.createElement('div');
    card.className = 'content-card';

    const img = document.createElement('img');
    img.src = item.img || placeholderImg;
    img.alt = item.title;
    card.appendChild(img);

    if(item.badge){
      const badge = document.createElement('div');
      badge.className = 'badge';
      badge.textContent = item.badge;
      card.appendChild(badge);
    }

    const title = document.createElement('p');
    title.className = 'title';
    title.textContent = item.title;
    card.appendChild(title);

    return card;
  }

  const tvSlider = document.getElementById('tv-programs-slider');
  tvPrograms.forEach(item => {
    tvSlider.appendChild(createCard(item));
  });

  const popularSlider = document.getElementById('popular-contents-slider');
  popularContents.forEach(item => {
    popularSlider.appendChild(createCard(item));
  });
</script>
</body>
</html>
