<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat GOL</title>
    <!-- CSS 파일 연결하는 코드 (스타일을 여기서 가져옴) -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- 전체 화면을 감싸는 커다란 박스 -->
    <div class="container">
        
        <!-- 로고 부분 -->
        <div class="logo">
            <span class="logo-icon">▲</span>
            <h1>Chat GOL</h1>
        </div>

        <!-- 시작 화면 (채팅 시작 전 보이는 부분) -->
        <div class="start-screen" id="startScreen">
            <p class="greeting">무엇을 도와드릴까요?</p>
            
            <!-- 검색창 -->
            <div class="search-box">
                <input type="text" id="userInput" placeholder="질문을 입력해주세요...">
                <button id="searchBtn">Search</button>
            </div>

            <!-- 예시 질문 버튼들 -->
            <div class="examples">
                <button class="example-btn" onclick="askExample('아바타 2가 필요?')">아바타 2가 필요?</button>
                <button class="example-btn" onclick="askExample('정치')">정치</button>
                <button class="example-btn" onclick="askExample('사회/정치2')">사회/정치2</button>
                <button class="example-btn" onclick="askExample('너에 대하여')">너에 대하여</button>
            </div>
        </div>

        <!-- 채팅 내용이 나오는 곳 (처음엔 숨김) -->
        <div class="chat-area" id="chatArea">
            <!-- 여기에 js가 채팅 내용을 추가할 거야 -->
        </div>

        <!-- 맨 밑에 작은 글씨 경고문 -->
        <div class="disclaimer">해당 Chat GOL (는) 실수할수 있습니다.</div>

    </div>

    <!-- JS 파일 연결하는 코드 (두뇌를 여기서 가져옴) -->
    <script src="script.js"></script>
</body>
</html>
