<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>티비 스포츠 — 서버 점검중</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    :root{
      --clr-bg:#0a0a0a;
      --clr-primary:#e50914;
      --clr-text:#eee;
      --clr-text-muted:#aaa;
      --header-h-pc:56px;
      --header-h-mobile:64px;
      --banner-height-pc:260px;
      --banner-height-mobile:180px;
    }
    *{margin:0;padding:0;box-sizing:border-box;}
    body{background:var(--clr-bg);color:var(--clr-text);font-family:'Noto Sans KR',sans-serif;}

    /* HEADER: 간결한 동작 + "걸리는" 부속효과 제거 (scrolled는 배경 불투명도만) */
    header{
      position:fixed;top:0;left:0;right:0;
      display:flex;align-items:center;justify-content:space-between;
      padding:0 24px;height:var(--header-h-pc);
      background:rgba(0,0,0,0.85);border-bottom:1px solid rgba(255,255,255,0.1);
      z-index:1000;
      transition:
        transform 600ms cubic-bezier(.22,.9,.35,1),
        background 420ms ease;
      will-change:transform;
    }
    header.hidden{ transform:translateY(-120%); pointer-events:none; }
    header.scrolled{ background:rgba(0,0,0,0.96); }

    .logo{ font-weight:900; font-size:24px; color:var(--clr-primary); letter-spacing:2px; user-select:none; transition:opacity 360ms ease; }
    header.hidden .logo{ opacity:0.98; }

    /* 배너 (기존 유지 + 화살표/컨트롤 스타일 확장) */
    .banner-container {
      position: relative;
      margin-top: var(--header-h-pc);
      width: 100%;
      height: var(--banner-height-pc);
      overflow: hidden;
      background: #000;
      filter: grayscale(12%) contrast(95%);
    }
    .banner-inner { position: relative; width:100%; height:100%; }

    .banner-slide {
      display:flex;
      height:100%;
      width: calc(100% * 2); /* 슬라이드 수(현재 2) */
      transform: translateX(0);
      transition: transform 700ms cubic-bezier(.22,.9,.35,1);
      will-change: transform;
    }

    .banner-item {
      position: relative;
      width: 50%;
      height: 100%;
      flex-shrink: 0;
      overflow: hidden;
      background: linear-gradient(180deg, rgba(0,0,0,0.04), rgba(0,0,0,0.12));
    }

    .banner-item img {
      width:100%;
      height:100%;
      object-fit:cover;
      object-position:center;
      display:block;
      -webkit-transform: translateZ(0); transform: translateZ(0);
      backface-visibility:hidden;
    }

    .banner-caption {
      position:absolute;
      left:24px;
      bottom:18px;
      color:#fff;
      font-weight:700;
      font-size:14px;
      background:linear-gradient(90deg, rgba(0,0,0,0.36), rgba(0,0,0,0.12));
      padding:8px 12px;
      border-radius:8px;
      pointer-events:none;
      user-select:none;
      opacity:0.98;
    }

    /* CONTROLS: 중앙 도트 + 양쪽 화살표 (개편된 화살표) */
    .banner-controls {
      position:absolute;
      left:0; right:0; bottom:12px;
      display:flex; align-items:center; justify-content:center; gap:12px;
      pointer-events:none;
    }

    /* 화살표 버튼: 터치 타깃 확보(44-48px), SVG 아이콘 사용, focus 스타일, 키보드 접근성 */
    .banner-arrow {
      --size:48px;
      width:var(--size); height:var(--size);
      margin:0 6px;
      border-radius:12px;
      background:rgba(0,0,0,0.45);
      border:none; pointer-events:auto; cursor:pointer;
      display:flex; align-items:center; justify-content:center;
      transition: transform .12s ease, background .18s ease, box-shadow .12s ease;
      box-shadow: 0 2px 8px rgba(0,0,0,0.28);
    }
    .banner-arrow svg { width:20px; height:20px; display:block; fill: none; stroke: #fff; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
    .banner-arrow:hover { transform: translateY(-3px); background: rgba(0,0,0,0.6); box-shadow: 0 6px 18px rgba(0,0,0,0.45); }
    .banner-arrow:active { transform: translateY(-1px) scale(.98); }
    .banner-arrow:focus { outline: 3px solid rgba(229,9,20,0.22); outline-offset: 3px; }

    /* 위치별 세부: prev / next */
    .banner-arrow.prev { position: absolute; left: 12px; bottom: 18px; border-radius:10px; }
    .banner-arrow.next { position: absolute; right: 12px; bottom: 18px; border-radius:10px; }

    /* 도트 그룹: 중앙, pointer-events 허용 */
    .banner-dots { display:flex; gap:8px; pointer-events:auto; align-items:center; }
    .banner-dot {
      width:10px; height:10px; border-radius:50%;
      background: rgba(255,255,255,0.42);
      border:none; cursor:pointer; padding:0;
      transition: background .22s ease, transform .12s ease;
    }
    .banner-dot.active { background: var(--clr-primary); transform: scale(1.08); }
    .banner-dot:focus { outline: 2px solid rgba(229,9,20,0.24); outline-offset:3px; border-radius:50%; }

    /* 모바일 대응 */
    @media (max-width:767px){
      header{ height:var(--header-h-mobile); padding:0 16px; }
      .logo{ font-size:20px; }
      .banner-container { height: var(--banner-height-mobile); margin-top: var(--header-h-mobile); }
      .banner-caption { left:12px; bottom:12px; font-size:13px; padding:6px 10px; }
      .banner-arrow { --size:40px; }
      .banner-dot { width:12px; height:12px; }
    }

    /* 메인/유지된 스타일들 */
    main{ padding:20px; max-width:960px; margin:0 auto; }
    .maintenance{
      min-height:calc(100vh - var(--header-h-pc) - var(--banner-height-pc));
      display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center;
    }
    .maintenance h1{ font:900 28px/1.3 'Noto Sans KR'; margin-bottom:14px; color:#fff; }
    .maintenance p{ font:400 16px/1.6 'Noto Sans KR'; color:var(--clr-text-muted); margin-bottom:20px; }

    .loading{ display:inline-flex; align-items:center; gap:12px; margin-bottom:16px; color:var(--clr-primary); }
    .spinner{ width:20px; height:20px; border-radius:50%; border:2px solid rgba(229,9,20,0.28); border-top-color:var(--clr-primary); animation:spin 1s linear infinite; }
    .dots{ display:inline-flex; gap:6px; }
    .dot{ width:8px; height:8px; background:var(--clr-primary); border-radius:50%; animation:pulse 1.2s ease-in-out infinite; }
    .dot:nth-child(2){ animation-delay:.12s; } .dot:nth-child(3){ animation-delay:.24s; }

    .refresh-btn{ background:rgba(229,9,20,0.18); color:#fff; border:1px solid rgba(229,9,20,0.45); border-radius:10px; padding:10px 16px; font:700 14px/1 'Noto Sans KR'; display:inline-flex; align-items:center; gap:8px; cursor:pointer; transition: transform .08s ease, box-shadow .15s ease; }
    .refresh-btn:active{ transform:scale(0.98); }
    .refresh-icon{ width:18px; height:18px; position:relative; display:inline-block; }
    .refresh-icon::before,.refresh-icon::after{ content:''; position:absolute; inset:0; border:2px solid rgba(255,255,255,0.2); border-top-color:#fff; border-radius:50%; }
    .refresh-icon.active::before{ animation:spin .9s linear infinite; }
    .refresh-icon.active::after{ animation:spinReverse 1.6s linear infinite; opacity:.36; }

    @keyframes spin{ to{ transform:rotate(360deg); } }
    @keyframes spinReverse{ to{ transform:rotate(-360deg); } }
    @keyframes pulse{ 0%,100%{ transform:scale(1); opacity:.36; } 50%{ transform:scale(1.35); opacity:1; } }

    @media (prefers-reduced-motion: reduce) {
      .spinner, .dot, .refresh-icon.active::before, .refresh-icon.active::after { animation: none !important; }
      header, .logo { transition: none !important; }
      .banner-slide { transition: none !important; }
      .banner-arrow, .banner-dot { transition: none !important; }
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">티비 스포츠</div>
  </header>

  <!-- 개선된 배너 -->
  <div class="banner-container" aria-roledescription="carousel">
    <div class="banner-inner">
      <div class="banner-slide" id="bannerSlide" aria-live="off">
        <figure class="banner-item" role="group" aria-roledescription="slide" aria-label="1 / 2">
          <img src="https://t1.daumcdn.net/brunch/service/user/7onF/image/-UOqf4TxgKFINfDx34hOWbrQpL4.png"
               alt="서버 점검 이미지 1" loading="lazy" decoding="async" />
          <figcaption class="banner-caption">서버 점검 안내</figcaption>
        </figure>

        <figure class="banner-item" role="group" aria-roledescription="slide" aria-label="2 / 2">
          <img src="https://i.ytimg.com/vi/e3usuzCDe4k/mqdefault.jpg"
               alt="서버 점검 이미지 2" loading="lazy" decoding="async" />
          <figcaption class="banner-caption">곧 다시 만나요</figcaption>
        </figure>
      </div>

      <!-- 좌우 화살표 (전면 개편된 UI) -->
      <button class="banner-arrow prev" aria-label="이전 배너" type="button" id="bannerPrev">
        <!-- left chevron SVG -->
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <polyline points="15 18 9 12 15 6"></polyline>
        </svg>
      </button>

      <div class="banner-controls" aria-hidden="false">
        <div class="banner-dots" role="tablist" aria-label="배너 전환">
          <button class="banner-dot active" data-index="0" role="tab" aria-selected="true" aria-controls="bannerSlide"></button>
          <button class="banner-dot" data-index="1" role="tab" aria-selected="false" aria-controls="bannerSlide"></button>
        </div>
      </div>

      <button class="banner-arrow next" aria-label="다음 배너" type="button" id="bannerNext">
        <!-- right chevron SVG -->
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <polyline points="9 18 15 12 9 6"></polyline>
        </svg>
      </button>
    </div>
  </div>

  <main>
    <section class="maintenance">
      <h1>서버 점검중입니다</h1>
      <p>더 나은 서비스를 위해 현재 점검을 진행하고 있습니다.<br>잠시 후 다시 접속해 주세요.</p>

      <div class="loading" aria-hidden="false">
        <div class="spinner" role="img" aria-hidden="true"></div>
        <span>상태</span>
        <span class="dots" aria-hidden="true"><i class="dot"></i><i class="dot"></i><i class="dot"></i></span>
      </div>

      <button type="button" class="refresh-btn" id="refreshBtn" aria-label="새로고침">
        <span class="refresh-icon" id="refreshIcon" aria-hidden="true"></span>
        <span>새로고침</span>
      </button>
    </section>
  </main>

  <script>
    // HEADER: 개선된 스크롤 토글 로직 (이전 개선 효과와 동일하게 적용)
    (function(){
      const header = document.querySelector('header');
      let lastScroll = window.scrollY || 0;
      let ticking = false;

      const DEADZONE = 12;
      const MIN_DELTA_SHOW = -6;
      let isHidden = false;
      let lastToggle = 0;
      const MIN_TOGGLE_GAP = 200;

      function updateHeader(current, delta){
        const now = performance.now();

        if (delta > DEADZONE && current > 80 && !isHidden && (now - lastToggle) > MIN_TOGGLE_GAP){
          header.classList.add('hidden');
          header.classList.remove('scrolled');
          isHidden = true;
          lastToggle = now;
          return;
        }

        if (delta < MIN_DELTA_SHOW && isHidden && (now - lastToggle) > MIN_TOGGLE_GAP){
          header.classList.remove('hidden');
          if (current > 40) header.classList.add('scrolled'); else header.classList.remove('scrolled');
          isHidden = false;
          lastToggle = now;
          return;
        }

        if (!isHidden){
          if (current > 40) header.classList.add('scrolled'); else header.classList.remove('scrolled');
        }
      }

      function onScroll(){
        if (!ticking){
          window.requestAnimationFrame(() => {
            const current = window.scrollY || 0;
            const delta = current - lastScroll;

            if (Math.abs(delta) > DEADZONE || (delta < 0 && Math.abs(delta) > 3)){
              updateHeader(current, delta);
              lastScroll = current;
            } else {
              if (current <= 8 && isHidden){
                header.classList.remove('hidden');
                header.classList.remove('scrolled');
                isHidden = false;
              }
            }

            ticking = false;
          });
          ticking = true;
        }
      }

      window.addEventListener('scroll', onScroll, { passive: true });
      if ((window.scrollY || 0) > 40) header.classList.add('scrolled');
    })();

    // 새로고침 버튼 동작 (시각 피드백 후 새로고침)
    (function(){
      const refreshBtn = document.getElementById('refreshBtn');
      const refreshIcon = document.getElementById('refreshIcon');
      if (!refreshBtn) return;
      refreshBtn.addEventListener('click', () => {
        refreshIcon.classList.add('active');
        setTimeout(()=>{ location.reload(true); }, 520);
      });
    })();

    // 배너 제어: 자동 + 도트 + 개편된 화살표 + 터치 + 키보드 접근성
    (function(){
      const slide = document.getElementById('bannerSlide');
      const dots = Array.from(document.querySelectorAll('.banner-dot'));
      const prevBtn = document.getElementById('bannerPrev');
      const nextBtn = document.getElementById('bannerNext');
      if (!slide || dots.length === 0) return;

      let current = 0;
      const total = dots.length;
      const SLIDE_WIDTH_PERCENT = 50; // 2슬라이드 기준
      let interval = null;
      const AUTO_MS = 5000;
      const transitionTime = 700;

      function goTo(idx, instant = false) {
        idx = (idx + total) % total;
        current = idx;
        slide.style.transition = instant ? 'none' : `transform ${transitionTime}ms cubic-bezier(.22,.9,.35,1)`;
        slide.style.transform = `translateX(-${idx * SLIDE_WIDTH_PERCENT}%)`;
        dots.forEach((d, i) => {
          d.classList.toggle('active', i === idx);
          d.setAttribute('aria-selected', i === idx ? 'true' : 'false');
        });
      }

      function next(){ goTo(current + 1); }
      function prev(){ goTo(current - 1); }

      function startAuto(){ stopAuto(); interval = setInterval(next, AUTO_MS); }
      function stopAuto(){ if (interval){ clearInterval(interval); interval = null; } }

      // 도트 클릭, 키보드 접근
      dots.forEach(d => {
        d.addEventListener('click', () => {
          const idx = Number(d.dataset.index || 0);
          goTo(idx);
          stopAuto();
          startAuto();
        });
        d.addEventListener('keydown', (e) => {
          if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); d.click(); }
        });
      });

      // 화살표 클릭 및 키보드 작동 (Enter/Space 로도 작동)
      if (prevBtn) {
        prevBtn.addEventListener('click', () => { prev(); stopAuto(); startAuto(); });
        prevBtn.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); prevBtn.click(); } });
      }
      if (nextBtn) {
        nextBtn.addEventListener('click', () => { next(); stopAuto(); startAuto(); });
        nextBtn.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); nextBtn.click(); } });
      }

      // 터치 스와이프 지원
      let startX = 0, deltaX = 0, touching = false;
      slide.addEventListener('touchstart', (e) => {
        stopAuto();
        touching = true;
        startX = e.touches[0].clientX;
        slide.style.transition = 'none';
      }, { passive: true });

      slide.addEventListener('touchmove', (e) => {
        if (!touching) return;
        deltaX = e.touches[0].clientX - startX;
        const px = (deltaX / slide.clientWidth) * 100;
        slide.style.transform = `translateX(calc(-${current * SLIDE_WIDTH_PERCENT}% + ${px}%))`;
      }, { passive: true });

      slide.addEventListener('touchend', () => {
        touching = false;
        if (Math.abs(deltaX) > 40) {
          if (deltaX < 0) next(); else prev();
        } else {
          goTo(current);
        }
        deltaX = 0;
        startAuto();
      });

      // 키보드 좌우 화살표로 슬라이드 이동 (페이지 전체에서 동작)
      window.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowLeft') { prev(); stopAuto(); startAuto(); }
        if (e.key === 'ArrowRight') { next(); stopAuto(); startAuto(); }
      });

      // 초기화 및 가시성 제어
      goTo(0, true);
      startAuto();
      document.addEventListener('visibilitychange', () => {
        if (document.hidden) stopAuto(); else startAuto();
      });
    })();
  </script>
</body>
</html>
