<!DOCTYPE html>
<!-- index.html 0.0.4 -->
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Chat K plus</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        
        <!-- ========== 검색 화면 ========== -->
        <div id="search-view">
            <div class="search-content">
                <div class="logo">✦</div>
                <div class="title">
                    Chat K plus
                    <span class="beta-badge">BETA</span>
                </div>
                
                <div class="search-container">
                    <input 
                        type="text" 
                        id="queryInput" 
                        class="search-input" 
                        placeholder="무엇이든 물어보세요"
                        autocomplete="off"
                        aria-label="검색 입력"
                    >
                    <button id="searchBtn" class="search-btn" disabled aria-label="검색">검색</button>
                </div>

                <div class="examples">
                    <p class="examples-title">예시 질문</p>
                    <div class="button-group">
                        <button class="example-btn">아바타 2가 뭐죠?</button>
                        <button class="example-btn">정치</button>
                        <button class="example-btn">사회/정치2</button>
                        <button class="example-btn">너에 대해서</button>
                    </div>
                </div>
            </div>

            <footer class="app-footer">
                <p>Chat K plus는 실수할 수 있습니다.</p>
            </footer>
        </div>

        <!-- ========== 채팅 화면 ========== -->
        <div id="chat-view" class="hidden">
            <header class="chat-header">
                <button id="backBtn" class="back-btn" aria-label="뒤로가기">← 뒤로</button>
            </header>

            <div id="chat-box" class="chat-box" role="log" aria-live="polite"></div>

            <footer class="chat-footer">
                <div class="input-wrapper-modern">
                    <div class="input-top">
                        <textarea 
                            id="chatInput" 
                            class="chat-input" 
                            placeholder="무엇이든 물어보세요" 
                            rows="1"
                            maxlength="2000"
                            autocomplete="off"
                            aria-label="메시지 입력"
                        ></textarea>
                    </div>
                    <div class="input-controls">
                        <div class="controls-left">
                            <button id="timetableBtn" class="icon-btn" title="시간표" aria-label="시간표">📅</button>
                            <select id="difficultySelect" class="difficulty-select" aria-label="답변 난이도">
                                <option value="normal">보통</option>
                                <option value="detail">자세히</option>
                                <option value="simple">간단히</option>
                            </select>
                        </div>
                        <div class="controls-right">
                            <button id="sendBtn" class="send-circle" disabled aria-label="전송">↑</button>
                            <button id="stopBtn" class="stop-circle hidden" title="중지" aria-label="중지">■</button>
                        </div>
                    </div>
                </div>
            </footer>
        </div>
    </div>

    <!-- ========== 시간표 모달 ========== -->
    <div id="timetableModal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="timetableTitle">
        <div class="modal-backdrop"></div>
        <div class="modal-content timetable-modal">
            <div class="timetable-header">
                <h3 id="timetableTitle">📅 내 시간표</h3>
                <button id="timetableClose" class="close-btn" aria-label="닫기">×</button>
            </div>

            <div class="timetable-tabs" role="tablist">
                <button class="tab active" data-day="mon" role="tab" aria-selected="true">월</button>
                <button class="tab" data-day="tue" role="tab" aria-selected="false">화</button>
                <button class="tab" data-day="wed" role="tab" aria-selected="false">수</button>
                <button class="tab" data-day="thu" role="tab" aria-selected="false">목</button>
                <button class="tab" data-day="fri" role="tab" aria-selected="false">금</button>
            </div>

            <div id="timetableContent" class="timetable-content" role="tabpanel">
                <!-- 데모: 월요일 시간표 -->
                <div class="timetable-item">
                    <div class="timetable-time">09:00-10:30</div>
                    <div class="timetable-subject">수학</div>
                    <div class="timetable-room">3-2</div>
                </div>
                <div class="timetable-item">
                    <div class="timetable-time">11:00-12:30</div>
                    <div class="timetable-subject">영어</div>
                    <div class="timetable-room">2-1</div>
                </div>
            </div>

            <div class="timetable-footer">
                <button id="addClassBtn" class="timetable-add" aria-label="수업 추가">+ 수업 추가</button>
            </div>
        </div>
    </div>

    <!-- ========== 수업 추가 모달 ========== -->
    <div id="addClassModal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="addClassTitle">
        <div class="modal-backdrop"></div>
        <div class="modal-content add-class-modal">
            <h3 id="addClassTitle">수업 추가</h3>
            <div class="form-group">
                <label for="classDay">요일</label>
                <select id="classDay" aria-label="요일 선택">
                    <option value="mon">월요일</option>
                    <option value="tue">화요일</option>
                    <option value="wed">수요일</option>
                    <option value="thu">목요일</option>
                    <option value="fri">금요일</option>
                </select>
            </div>
            <div class="form-group">
                <label for="classTime">시간</label>
                <input type="text" id="classTime" placeholder="09:00-10:30" aria-label="시간 입력">
            </div>
            <div class="form-group">
                <label for="classSubject">과목</label>
                <input type="text" id="classSubject" placeholder="수학" aria-label="과목 입력">
            </div>
            <div class="form-group">
                <label for="classRoom">교실</label>
                <input type="text" id="classRoom" placeholder="3-2" aria-label="교실 입력">
            </div>
            <div class="modal-buttons">
                <button id="cancelAdd" class="modal-btn cancel" aria-label="취소">취소</button>
                <button id="saveAdd" class="modal-btn go" aria-label="저장">저장</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
