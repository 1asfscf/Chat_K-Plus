<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat GOL</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="app-container">
        
        <!-- [View 1: 검색 화면] -->
        <section id="search-view" class="view">
            <div class="logo">▲</div>
            <h1 class="title">무엇을 도와드릴까요?</h1>

            <div class="search-container">
                <input type="text" id="queryInput" class="search-input" placeholder="질문을 입력하세요.">
                <button id="searchBtn" class="search-btn" disabled>Search</button>
            </div>

            <div class="examples">
                <h3 class="examples-title">예시 질문</h3>
                <div class="button-group">
                    <button class="example-btn">아바타 2가 뭐죠?</button>
                    <button class="example-btn">정치</button>
                    <button class="example-btn">사회/정치2</button>
                    <button class="example-btn">너에 대해서</button>
                </div>
            </div>
        </section>

        <!-- [View 2: 채팅 화면] -->
        <section id="chat-view" class="view hidden">
            <header class="chat-header">
                <button id="backBtn" class="back-btn">← 뒤로가기</button>
            </header>
            
            <div id="chat-box" class="chat-box">
                <!-- 결과가 JS를 통해 이곳에 동적으로 출력됨 -->
            </div>
        </section>

        <!-- [공통 푸터] -->
        <footer class="app-footer">
            <p>해당 Chat GOL (는) 실수 할 수 있습니다.</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
