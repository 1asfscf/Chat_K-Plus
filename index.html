<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>OTT 다시보기 – 티빙 스타일</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    /* Reset */
    * { margin:0; padding:0; box-sizing:border-box; }
    html, body { width:100%; background:#000; color:#fff; font-family:'Noto Sans KR',sans-serif; overflow-x:hidden; }
    a, button { background:none; border:none; cursor:pointer; }

    /* Animation */
    @keyframes fadeUp   { from{opacity:0;transform:translateY(20px)} to{opacity:1;transform:translateY(0)} }
    @keyframes slideDown{ from{opacity:0;transform:translateY(-100%)} to{opacity:1;transform:translateY(0)} }

    /* Header 共通 */
    header { position:absolute; top:0; left:0; width:100%; z-index:20; }

    /* PC Header */
    .header-desktop {
      position:relative;
      display:flex; align-items:center;
      padding:16px 5%;
      animation:fadeUp .6s ease-out;
    }
    .header-desktop .logo-text {
      font-size:32px; font-weight:700; letter-spacing:-1px;
    }
    /* 중앙 Nav를 absolute로 띄워줌 */
    .header-desktop nav {
      position:absolute; left:50%; transform:translateX(-50%);
      display:flex; gap:24px; font-size:14px; font-weight:500;
      scroll-snap-type:x mandatory; overflow-x:auto; 
    }
    .header-desktop nav a {
      flex-shrink:0; padding-bottom:4px; color:#fff; text-decoration:none;
      border-bottom:2px solid transparent; transition:.2s;
      scroll-snap-align:start;
    }
    .header-desktop nav a:hover { color:#e60012; }
    .header-desktop nav a.active {
      color:#e60012; border-color:#e60012;
    }
    .header-desktop .header-actions {
      margin-left:auto; display:flex; gap:20px;
    }
    .header-desktop .icon svg {
      width:20px; height:20px; fill:#fff; transition:fill .2s;
    }
    .header-desktop .icon:hover svg { fill:#e60012; }

    /* Mobile Header */
    .header-mobile {
      display:none;
      justify-content:space-between; align-items:center;
      padding:10px 5%; background:transparent;
      animation:slideDown .4s ease-out;
    }
    .header-mobile .logo-text {
      font-size:24px; font-weight:700;
    }
    .header-mobile .mobile-actions {
      display:flex; gap:16px;
    }
    .header-mobile .icon svg {
      width:24px; height:24px; fill:#fff; transition:fill .2s;
    }
    .header-mobile .icon:hover svg { fill:#e60012; }


    /* Banner */
    .banner {
      position:relative; margin-top:64px;
      width:100%; height:60vh;
      background:url('https://img.onnada.com/2024/1226/1994052142_ae426214_AADZs_.jpg') center/cover no-repeat;
      filter:brightness(0.6);
      animation:fadeUp .8s ease-out .6s both;
    }
    .banner .overlay { position:absolute; inset:0;
      background:linear-gradient(to top, rgba(0,0,0,0.8), transparent 50%); }
    .banner .content {
      position:absolute; left:5%; bottom:5%; max-width:50%;
      animation:fadeUp .8s ease-out .8s both;
    }
    .banner h1 { font-size:48px; font-weight:700; margin-bottom:8px; }
    .banner p.tagline { font-size:18px; line-height:1.4; margin-bottom:24px; }
    .banner .btn {
      display:inline-block; padding:12px 28px; background:#e60012;
      color:#fff; font-weight:500; border-radius:4px;
      text-decoration:none; transition:background .2s;
    }
    .banner .btn:hover { background:#ff1f3f; }

    /* Section Title */
    .section { padding:48px 5%; }
    .section h2 {
      font-size:28px; font-weight:700; margin-bottom:24px;
      animation:fadeUp .6s ease-out 1s both;
    }

    /* Slider */
    .slider { position:relative; }
    .slider-track {
      display:flex; overflow-x:auto; scroll-behavior:smooth;
      gap:16px; padding-bottom:8px; scroll-snap-type:x mandatory;
      animation:fadeUp .6s ease-out 1.2s both;
    }
    .slider-track::-webkit-scrollbar { height:6px; }
    .slider-track::-webkit-scrollbar-thumb { background:#444; border-radius:3px; }

    .slide {
      flex:0 0 200px; cursor:pointer; transition:transform .3s;
      scroll-snap-align:start; animation:fadeUp .5s ease-out both;
    }
    .slide:hover { transform:scale(1.05); }
    .slide img { width:100%; display:block; border-radius:4px; }
    .slide .title {
      margin-top:8px; font-size:16px; font-weight:500;
      white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    }

    /* Arrows */
    .arrow {
      position:absolute; top:50%; transform:translateY(-50%);
      width:40px; height:40px; background:rgba(0,0,0,0.6);
      border-radius:50%; display:flex; align-items:center;
      justify-content:center; cursor:pointer; transition:background .2s;
      z-index:10; animation:fadeUp .6s ease-out 1.4s both;
    }
    .arrow.prev { left:2%; }
    .arrow.next { right:2%; }
    .arrow:hover { background:rgba(0,0,0,0.8); }
    .arrow svg { width:24px; height:24px; fill:#fff; }

    /* Responsive */
    @media (max-width:768px) {
      .header-desktop { display:none; }
      .header-mobile  { display:flex; }

      .banner { margin-top:56px; height:50vh; }
      .banner h1 { font-size:32px; }
      .banner p.tagline { font-size:14px; margin-bottom:16px; }
      .banner .btn { padding:8px 20px; font-size:14px; }

      .section { padding:32px 5%; }
      .section h2 { font-size:22px; margin-bottom:16px; }

      .slider-track { gap:12px; padding-bottom:6px; }
      .slide { flex:0 0 150px; }
      .slide .title { margin-top:6px; font-size:14px; }

      .arrow { width:30px; height:30px; }
      .arrow svg { width:16px; height:16px; }
    }
  </style>
</head>
<body>

  <header>
    <!-- PC Header -->
    <div class="header-desktop">
      <div class="logo-text">TVING</div>
      <nav>
        <a href="#">LIVE</a>
        <a href="#" class="active">다시보기</a>
        <a href="#">테마</a>
        <a href="#">예능</a>
        <a href="#">드라마</a>
        <a href="#">영화</a>
        <a href="#">키즈</a>
      </nav>
      <div class="header-actions">
        <button class="icon search" aria-label="검색">
          <!-- SVG 검색 -->
        </button>
        <button class="icon bookmark" aria-label="찜목록">
          <!-- SVG 찜 -->
        </button>
        <!-- 프로필 버튼 제거 -->
      </div>
    </div>

    <!-- Mobile Header -->
    <div class="header-mobile">
      <div class="logo-text">TVING</div>
      <div class="mobile-actions">
        <button class="icon community" aria-label="커뮤니티">
          <!-- SVG 커뮤니티 -->
        </button>
        <button class="icon menu" aria-label="메뉴">
          <!-- SVG 햄버거 -->
        </button>
      </div>
    </div>
  </header>

  <!-- Banner -->
  <section class="banner">
    <div class="overlay"></div>
    <div class="content">
      <h1>지리산</h1>
      <p class="tagline">하늘과 만나는 곳, 이곳에 계곡의 관객</p>
      <a href="#" class="btn">자세히 보기</a>
    </div>
  </section>

<!-- 추천 콘텐츠 섹션 -->
