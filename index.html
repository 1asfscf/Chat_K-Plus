<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Got – 당신의 AI 비서</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <div class="app">
        <!-- 사이드바 오버레이 -->
        <div class="sidebar-overlay" id="sidebarOverlay"></div>

        <!-- 사이드바 (오버레이) -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="logo">
                    <div class="logo-icon">
                        <svg viewBox="0 0 32 32" fill="none">
                            <rect width="32" height="32" rx="8" fill="url(#logoGrad)"/>
                            <path d="M10 16L14 20L22 12" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
                            <defs>
                                <linearGradient id="logoGrad" x1="0" y1="0" x2="32" y2="32">
                                    <stop offset="0%" stop-color="#6366f1"/>
                                    <stop offset="100%" stop-color="#8b5cf6"/>
                                </linearGradient>
                            </defs>
                        </svg>
                    </div>
                    <span class="logo-text">Chat Got</span>
                </div>
                <button class="sidebar-close-btn" id="sidebarCloseBtn" title="사이드바 닫기">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <button class="new-chat-btn" id="newChatBtn">
                <i class="fa-solid fa-pen-to-square"></i>
                <span>새 대화</span>
                <kbd>⌘N</kbd>
            </button>

            <div class="chat-history-label">최근 대화</div>
            
            <div class="chat-list" id="chatList"></div>

            <div class="sidebar-footer">
                <div class="sidebar-footer-actions">
                    <button class="footer-btn" id="clearBtn">
                        <i class="fa-solid fa-trash-can"></i>
                        <span>모두 지우기</span>
                    </button>
                    <button class="footer-btn" id="settingsSidebarBtn">
                        <i class="fa-solid fa-gear"></i>
                        <span>설정</span>
                    </button>
                </div>
                <div class="user-card">
                    <div class="user-avatar">
                        <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Ccircle cx='20' cy='15' r='8' fill='%23cbd5e1'/%3E%3Cpath d='M8 36c0-6.627 5.373-12 12-12s12 5.373 12 12' fill='%23cbd5e1'/%3E%3C/svg%3E" alt="사용자">
                    </div>
                    <div class="user-info">
                        <span class="user-name">게스트</span>
                        <span class="user-plan">무료 플랜</span>
                    </div>
                </div>
            </div>
        </aside>

        <!-- 메인 콘텐츠 -->
        <main class="main">
            <header class="header">
                <button class="header-btn menu-btn" id="menuBtn">
                    <i class="fa-solid fa-bars-staggered"></i>
                </button>
                <div class="header-center">
                    <div class="model-indicator">
                        <span class="model-dot"></span>
                        <span class="model-name">Chat Got</span>
                        <span class="model-version">v2.1</span>
                    </div>
                </div>
                <div class="header-right">
                    <button class="header-btn" id="settingsBtn" title="설정">
                        <i class="fa-solid fa-gear"></i>
                    </button>
                    <button class="header-btn" title="공유">
                        <i class="fa-solid fa-share-nodes"></i>
                    </button>
                    <button class="header-btn" title="내보내기">
                        <i class="fa-solid fa-download"></i>
                    </button>
                </div>
            </header>

            <div class="chat-area">
                <div class="chat-scroll" id="chatScroll">
                    <div class="welcome-section" id="welcomeSection">
                        <div class="welcome-icon">
                            <div class="icon-ring"></div>
                            <i class="fa-solid fa-wand-magic-sparkles"></i>
                        </div>
                        <h1 class="welcome-heading">무엇을 도와드릴까요?</h1>
                        <p class="welcome-sub">질문을 입력하거나 아래 주제를 선택해보세요</p>
                        
                        <div class="suggestions-container">
                            <div class="suggestions-grid">
                                <button class="suggestion-card" data-query="머신러닝이 뭔지 쉽게 설명해줘">
                                    <div class="suggestion-icon" style="background: #eef2ff; color: #6366f1;">
                                        <i class="fa-solid fa-brain"></i>
                                    </div>
                                    <div class="suggestion-content">
                                        <span class="suggestion-title">머신러닝 쉽게 이해하기</span>
                                        <span class="suggestion-desc">예시와 함께 설명해드려요</span>
                                    </div>
                                </button>
                                <button class="suggestion-card" data-query="파이썬으로 데이터 정렬하는 함수 알려줘">
                                    <div class="suggestion-icon" style="background: #fef3c7; color: #f59e0b;">
                                        <i class="fa-solid fa-code"></i>
                                    </div>
                                    <div class="suggestion-content">
                                        <span class="suggestion-title">파이썬 코딩 도움</span>
                                        <span class="suggestion-desc">정렬 함수 예제</span>
                                    </div>
                                </button>
                                <button class="suggestion-card" data-query="생산성을 높이는 방법이 뭐가 있을까?">
                                    <div class="suggestion-icon" style="background: #fce7f3; color: #ec4899;">
                                        <i class="fa-solid fa-bolt"></i>
                                    </div>
                                    <div class="suggestion-content">
                                        <span class="suggestion-title">생산성 향상 팁</span>
                                        <span class="suggestion-desc">시간 관리 전략</span>
                                    </div>
                                </button>
                                <button class="suggestion-card" data-query="클린 코드 작성하는 좋은 습관 알려줘">
                                    <div class="suggestion-icon" style="background: #d1fae5; color: #10b981;">
                                        <i class="fa-solid fa-feather"></i>
                                    </div>
                                    <div class="suggestion-content">
                                        <span class="suggestion-title">클린 코드 습관</span>
                                        <span class="suggestion-desc">더 나은 개발을 위해</span>
                                    </div>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 입력 영역 (완전히 새로 디자인) -->
            <div class="input-section">
                <div class="input-container">
                    <div class="modern-input-wrapper" id="inputWrapper">
                        <div class="input-main-row">
                            <button class="input-action-btn" title="파일 첨부">
                                <i class="fa-solid fa-plus"></i>
                            </button>
                            <textarea 
                                id="userInput" 
                                placeholder="무엇이든 물어보세요..." 
                                rows="1"
                                maxlength="10000"
                            ></textarea>
                            <div class="input-actions-group">
                                <span class="char-count" id="charCount">0/10000</span>
                                <button class="send-btn-modern" id="sendBtn" disabled>
                                    <i class="fa-solid fa-arrow-up"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
                <p class="input-notice">
                    <i class="fa-solid fa-shield-halved"></i>
                    Chat Got은 실수할 수 있습니다. 중요한 정보는 반드시 확인하세요.
                </p>
            </div>
        </main>
    </div>

    <!-- 설정 모달 -->
    <div class="settings-overlay" id="settingsOverlay"></div>
    <div class="settings-modal" id="settingsModal">
        <div class="settings-header">
            <h2>설정</h2>
            <button class="settings-close" id="settingsCloseBtn">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>
        <div class="settings-content">
            <div class="setting-item">
                <div class="setting-info">
                    <span class="setting-label">다크 모드</span>
                    <span class="setting-desc">어두운 테마로 전환합니다</span>
                </div>
                <label class="switch">
                    <input type="checkbox" id="darkModeToggle">
                    <span class="slider round"></span>
                </label>
            </div>
            <div class="setting-item">
                <div class="setting-info">
                    <span class="setting-label">글자 크기</span>
                    <span class="setting-desc">대화 내용의 글자 크기를 조절합니다</span>
                </div>
                <div class="font-size-controls">
                    <button class="font-btn" data-size="small">A</button>
                    <button class="font-btn active" data-size="medium">A</button>
                    <button class="font-btn" data-size="large">A</button>
                </div>
            </div>
            <div class="setting-item">
                <div class="setting-info">
                    <span class="setting-label">애니메이션 줄이기</span>
                    <span class="setting-desc">움직임을 최소화합니다</span>
                </div>
                <label class="switch">
                    <input type="checkbox" id="reduceMotionToggle">
                    <span class="slider round"></span>
                </label>
            </div>
            <div class="setting-item">
                <div class="setting-info">
                    <span class="setting-label">대화 스타일</span>
                    <span class="setting-desc">AI 응답의 말투를 선택합니다</span>
                </div>
                <select class="select-styled" id="conversationStyle">
                    <option value="default">기본</option>
                    <option value="creative">창의적</option>
                    <option value="precise">정밀한</option>
                </select>
            </div>
            <div class="setting-item">
                <div class="setting-info">
                    <span class="setting-label">대화 초기화</span>
                    <span class="setting-desc">모든 대화 기록을 삭제합니다</span>
                </div>
                <button class="danger-btn" id="resetConversationsBtn">모두 지우기</button>
            </div>
            <div class="setting-item about">
                <div class="setting-info">
                    <span class="setting-label">Chat Got 정보</span>
                    <span class="setting-desc">버전 2.1 – 여러분의 똑똑한 AI 비서</span>
                </div>
            </div>
        </div>
    </div>

    <script src="knowledge.js"></script>
    <script src="script.js"></script>
</body>
</html>
