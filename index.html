<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>momQ 스트리밍 - 반응형 고급 UI</title>
  <style>
    :root {
      --main-red: #ff1744;
      --header-bg: rgba(24,24,24,0.82);
      --nav-bg: rgba(28,28,28,0.93);
      --blur: blur(12px);
      --transition: 0.3s cubic-bezier(.7,0,.3,1);
    }
    html, body { margin:0; padding:0; background:#181818; color:#fff; font-family:'Pretendard','Noto Sans KR',sans-serif;}
    body { min-height:100vh; }
    a { color:inherit; text-decoration:none; }
    img { max-width:100%; display:block; }

    /* --------- 공통 헤더 --------- */
    .header {
      position:fixed; top:0; left:0; width:100vw; z-index:100;
      background:var(--header-bg); backdrop-filter:var(--blur);
      display:flex; align-items:center; justify-content:space-between;
      height:60px; padding:0 2vw; box-sizing:border-box;
      box-shadow:0 2px 12px rgba(0,0,0,0.13);
      transition:box-shadow var(--transition), background var(--transition);
      gap:1vw;
    }
    .header-left { display:flex; align-items:center; gap:1vw; min-width:0;}
    .logo { font-size:2.1vw; color:var(--main-red); font-weight:700; min-width:70px; }
    .search-bar {
      background:#232323; border-radius:18px; border:none; padding:8px 18px;
      color:#fff; font-size:1vw; min-width:100px; width:20vw; max-width:320px;
      margin:0 2vw; transition:width var(--transition);
      display:block;
    }
    .header-right {
      display:flex; align-items:center; gap:1vw; min-width:0;
      flex-shrink:0;
    }
    .profile-img, .grandma-img {
      width:2.8vw; min-width:32px; max-width:48px; aspect-ratio:1/1;
      height:auto; border-radius:50%; object-fit:cover; border:2px solid #fff;
      background:#333;
      box-shadow:0 2px 8px rgba(0,0,0,0.13);
      transition:box-shadow var(--transition), border var(--transition);
    }
    .grandma-img { margin-left:0.7vw; border-color:var(--main-red);}
    /* --------- 슬라이더 --------- */
    .main-slider {
      margin-top:60px; width:100vw; overflow:hidden;
      border-radius:0 0 22px 22px; box-shadow:0 4px 24px rgba(0,0,0,0.25);
      position:relative; background:#222;
      min-height:25vw; max-height:380px;
      display:flex; align-items:center; justify-content:center;
    }
    .slide-track {
      display:flex; width:100%; height:100%; transition:transform var(--transition);
    }
    .slide {
      min-width:100vw; height:32vw; min-height:180px; max-height:380px;
      position:relative; opacity:0.7; transition:opacity 0.5s;
      display:flex; align-items:flex-end; justify-content:flex-start;
      overflow:hidden;
    }
    .slide.active { opacity:1;}
    .slide img {
      width:100vw; height:100%; object-fit:cover;
      transition:transform 0.5s;
    }
    .slide-caption {
      position:absolute; left:0; bottom:0; width:100%; max-width:100vw;
      padding:2.5vw 4vw 2vw 2vw;
      background:linear-gradient(0deg,rgba(24,24,24,0.92) 80%,rgba(24,24,24,0));
      color:#fff; border-radius:0 0 22px 22px;
      animation:fadeInUp 0.7s;
    }
    .slide-caption h2 { font-size:2vw; margin-bottom:1vw;}
    .slide-caption p { font-size:1.05vw; opacity:0.8;}
    .slider-dots {
      position:absolute; left:50%; bottom:1.2vw; transform:translateX(-50%);
      display:flex; gap:0.7vw;
    }
    .slider-dot {
      width:0.8vw; height:0.8vw; min-width:8px; min-height:8px; border-radius:50%;
      background:#fff; opacity:0.4; transition:opacity 0.2s;
    }
    .slider-dot.active { background:var(--main-red); opacity:1;}
    /* --------- 콘텐츠 --------- */
    .content-section { max-width:1100px; margin:3vw auto 0 auto; }
    .section-title { font-size:1.3vw; font-weight:700; margin:0 0 2vw 0.7vw;}
    .card-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 2.2vw;
      margin-top: 2vw;
      margin-bottom: 3vw;
      padding: 0 1vw;
      background: none;
    }
    .content-card {
      background: linear-gradient(135deg, #23242a 80%, #1a1b1f 100%);
      border-radius: 1.3vw;
      overflow: hidden;
      box-shadow: 0 4px 24px rgba(0,0,0,0.18), 0 1.5px 0.5vw rgba(255,23,68,0.07);
      transition: transform 0.35s cubic-bezier(.7,0,.3,1), box-shadow 0.18s;
      cursor: pointer;
      position: relative;
      min-width: 0;
      display: flex;
      flex-direction: column;
      align-items: stretch;
      border: 1.5px solid rgba(255,255,255,0.04);
      /* 부드러운 등장 */
      animation: fadeInUp 0.7s;
    }
    .content-card img {
      width: 100%;
      height: 11vw;
      min-height: 110px;
      object-fit: cover;
      border-radius: 1.3vw 1.3vw 0 0;
      background: #333;
      transition: filter 0.2s;
    }
    .content-card .badge {
      position: absolute; top: 1vw; left: 1vw;
      background: var(--main-red); color: #fff;
      font-size: 0.95vw; padding: 2.5px 13px;
      border-radius: 13px; font-weight: 600;
      box-shadow: 0 2px 8px rgba(255,23,68,0.11);
    }
    .content-card p {
      font-size: 1.05vw; color: #fff;
      margin: 1vw 0 1.1vw 1.2vw; font-weight: 500;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      letter-spacing: 0.01em;
    }
    .content-card:hover { transform: scale(1.05);}
    .content-card.active {
      transform: translateY(-13px) scale(1.05);
      box-shadow: 0 16px 36px rgba(255,23,68,0.18);
    }

    /* 모바일: 가로 스크롤, 큼직한 카드, 간격 넓게 */
    @media (max-width: 900px) {
      .content-section { margin-top: 18px; }
      .section-title {
        font-size: 1.09rem;
        margin-bottom: 18px;
        margin-left: 10px;
        letter-spacing: 0.01em;
      }
      .card-grid { display: none; }
      .card-row {
        display: flex;
        gap: 16px;
        overflow-x: auto;
        padding: 0 0 12px 12px;
        margin-bottom: 10vw;
        background: none;
      }
      .content-card {
        flex: 0 0 148px;
        min-width: 148px; max-width: 170px;
        background: linear-gradient(135deg, #23242a 85%, #1a1b1f 100%);
        border-radius: 18px;
        box-shadow: 0 4px 18px rgba(0,0,0,0.17), 0 1.5px 0.5vw rgba(255,23,68,0.07);
        margin-bottom: 0;
        border: 1.5px solid rgba(255,255,255,0.04);
        animation: fadeInUp 0.7s;
      }
      .content-card img {
        height: 96px;
        border-radius: 18px 18px 0 0;
      }
      .content-card .badge {
        position: absolute; top: 11px; left: 11px;
        font-size: 0.83rem; padding: 3px 13px; border-radius: 13px;
      }
      .content-card p {
        font-size: 1.01rem;
        margin: 13px 0 13px 13px;
      }
      .content-card.active {
        transform: translateY(-11px) scale(1.05);
        box-shadow: 0 16px 36px rgba(255,23,68,0.18);
      }
      /* 텍스트와 카드 간격 */
      .section-title + .card-row { margin-top: 10px; }
    }

    /* 부드러운 등장 */
    @keyframes fadeInUp {
      0% { opacity: 0; transform: translateY(20px);}
      100% { opacity: 1; transform: translateY(0);}
    }
    @keyframes fadeInDown {
      0% { opacity:0; transform:translateY(-24px);}
      100% { opacity:1; transform:translateY(0);}
    }
  </style>
</head>
<body>
  <!-- 해더 -->
  <header class="header">
    <div class="header-left">
      <span class="logo">momQ</span>
      <input class="search-bar" type="text" placeholder="검색 (PC)">
    </div>
    <div class="header-right">
      <img src="https://randomuser.me/api/portraits/men/32.jpg" alt="프로필" class="profile-img">
      <img src="https://cdn.pixabay.com/photo/2017/01/31/13/14/grandma-2028307_1280.png" alt="할머니" class="grandma-img">
    </div>
  </header>

  <!-- 모바일 전용 검색창 (동적 생성) -->
  <div id="mobileSearchWrap"></div>

  <!-- 메인 슬라이드 -->
  <section class="main-slider">
    <div class="slide-track" id="slideTrack">
      <div class="slide active">
        <img src="https://img.makeshop.co.kr/4/29457/202505/e884ed9ac295c362bcc500ec35759ca6.jpg" alt="슬라이드1">
        <div class="slide-caption">
          <h2>실시간 인기 콘텐츠, momQ 스트리밍</h2>
          <p>최신 트렌드와 오리지널 시리즈를 한눈에!</p>
        </div>
      </div>
      <div class="slide">
        <img src="https://img.makeshop.co.kr/4/29457/202505/65ab5e1d661a882151f87e4ab7a9748e.jpg" alt="슬라이드2">
        <div class="slide-caption">
          <h2>놓치면 아쉬운 오늘의 추천작</h2>
          <p>지금 바로 감상해보세요.</p>
        </div>
      </div>
    </div>
    <div class="slider-dots" id="sliderDots"></div>
  </section>

  <!-- 콘텐츠 섹션 -->
  <section class="content-section">
    <div class="section-title">추천 콘텐츠</div>
    <div class="card-grid">
      <div class="content-card"><img src="https://cdn5-aka.makeshop.co.kr/shopimages/2020nemomq/001004006440.jpg?1742963527"><span class="badge">ORIGINAL</span><p>콘텐츠 A</p></div>
      <div class="content-card"><img src="https://cdn5-aka.makeshop.co.kr/shopimages/2020nemomq/001004006440.jpg?1742963527"><span class="badge">NEW</span><p>콘텐츠 B</p></div>
      <div class="content-card"><img src="https://cdn5-aka.makeshop.co.kr/shopimages/2020nemomq/001004006440.jpg?1742963527"><span class="badge">HOT</span><p>콘텐츠 C</p></div>
      <div class="content-card"><img src="https://cdn5-aka.makeshop.co.kr/shopimages/2020nemomq/001004006440.jpg?1742963527"><span class="badge">BEST</span><p>콘텐츠 D</p></div>
      <div class="content-card"><img src="https://cdn5-aka.makeshop.co.kr/shopimages/2020nemomq/001004006440.jpg?1742963527"><span class="badge">TREND</span><p>콘텐츠 E</p></div>
    </div>
    <div class="card-row">
      <div class="content-card"><img src="https://cdn5-aka.makeshop.co.kr/shopimages/2020nemomq/001004006440.jpg?1742963527"><span class="badge">ORIGINAL</span><p>콘텐츠 A</p></div>
      <div class="content-card"><img src="https://cdn5-aka.makeshop.co.kr/shopimages/2020nemomq/001004006440.jpg?1742963527"><span class="badge">NEW</span><p>콘텐츠 B</p></div>
      <div class="content-card"><img src="https://cdn5-aka.makeshop.co.kr/shopimages/2020nemomq/001004006440.jpg?1742963527"><span class="badge">HOT</span><p>콘텐츠 C</p></div>
      <div class="content-card"><img src="https://cdn5-aka.makeshop.co.kr/shopimages/2020nemomq/001004006440.jpg?1742963527"><span class="badge">BEST</span><p>콘텐츠 D</p></div>
      <div class="content-card"><img src="https://cdn5-aka.makeshop.co.kr/shopimages/2020nemomq/001004006440.jpg?1742963527"><span class="badge">TREND</span><p>콘텐츠 E</p></div>
    </div>
  </section>

  <!-- 모바일 하단 네비게이션 -->
  <nav class="bottom-nav">
    <a href="#" class="active"><img src="https://cdn-icons-png.flaticon.com/512/1946/1946436.png" alt="홈"><span>홈</span></a>
    <a href="#" id="mobileSearchBtn"><img src="https://cdn-icons-png.flaticon.com/512/622/622669.png" alt="검색"><span>검색</span></a>
    <a href="#"><img src="https://cdn-icons-png.flaticon.com/512/1077/1077012.png" alt="마이"><span>마이</span></a>
    <a href="#"><img src="https://cdn-icons-png.flaticon.com/512/1827/1827392.png" alt="알림"><span>알림</span></a>
  </nav>

  <script>
    // 슬라이드 동작
    const slides = document.querySelectorAll('.slide');
    const slideTrack = document.getElementById('slideTrack');
    const dotsBox = document.getElementById('sliderDots');
    let current = 0;
    function showSlide(idx) {
      slides.forEach((s,i)=>s.classList.toggle('active',i===idx));
      document.querySelectorAll('.slider-dot').forEach((d,i)=>d.classList.toggle('active',i===idx));
      slideTrack.style.transform = `translateX(-${idx*100}vw)`;
    }
    // 도트 생성
    dotsBox.innerHTML = '';
    slides.forEach((_,i)=>{
      const d = document.createElement('div');
      d.className = 'slider-dot'+(i===0?' active':'');
      d.onclick = ()=>{current=i;showSlide(current);}
      dotsBox.appendChild(d);
    });
    function moveSlide(dir) {
      current = (current+dir+slides.length)%slides.length;
      showSlide(current);
    }
    setInterval(()=>{moveSlide(1);},4200);

    // PC/모바일 카드 구분
    function handleResize() {
      const isPC = window.innerWidth>=900;
      document.querySelector('.card-grid').style.display = isPC?'grid':'none';
      document.querySelector('.card-row').style.display = isPC?'none':'flex';
    }
    window.addEventListener('resize',handleResize);
    window.addEventListener('DOMContentLoaded',handleResize);

    // 모바일 검색 버튼
    const mobileSearchBtn = document.getElementById('mobileSearchBtn');
    const mobileSearchWrap = document.getElementById('mobileSearchWrap');
    let mobileSearchInput = null;
    mobileSearchBtn && mobileSearchBtn.addEventListener('click',()=>{
      if(document.querySelector('.mobile-search-bar')) return;
      mobileSearchInput = document.createElement('input');
      mobileSearchInput.className = 'mobile-search-bar';
      mobileSearchInput.type = 'text';
      mobileSearchInput.placeholder = '검색 (모바일)';
      mobileSearchWrap.appendChild(mobileSearchInput);
      mobileSearchInput.focus();
      mobileSearchInput.addEventListener('blur',()=>{
        mobileSearchInput.remove();
      });
    });

    // 카드 클릭/터치 시 부드럽게 위로 올라가는 효과 (PC/모바일 모두)
    function addCardClickEffect() {
      document.querySelectorAll('.content-card').forEach(card => {
        card.addEventListener('click', function() {
          card.classList.add('active');
          setTimeout(() => card.classList.remove('active'), 400);
        });
        card.addEventListener('touchstart', function() {
          card.classList.add('active');
          setTimeout(() => card.classList.remove('active'), 400);
        });
      });
    }
    window.addEventListener('DOMContentLoaded', addCardClickEffect);
  </script>
</body>
</html>
