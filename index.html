<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Got – AI 비서</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app">
        <!-- 사이드바 오버레이 -->
        <div class="sidebar-overlay" id="sidebarOverlay"></div>

        <!-- 사이드바 -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="logo">
                    <span class="logo-text">Chat Got</span>
                </div>
                <button class="sidebar-close-btn" id="sidebarCloseBtn" title="사이드바 닫기">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <button class="new-chat-btn" id="newChatBtn">
                <i class="fa-solid fa-pen-to-square"></i>
                <span>새 대화</span>
            </button>

            <div class="chat-history-label">최근 대화</div>
            <div class="chat-list" id="chatList"></div>

            <div class="sidebar-footer">
                <button class="footer-btn" id="clearBtn">
                    <i class="fa-solid fa-trash-can"></i>
                    <span>모두 지우기</span>
                </button>
                <button class="footer-btn" id="settingsSidebarBtn">
                    <i class="fa-solid fa-gear"></i>
                    <span>설정</span>
                </button>
            </div>
        </aside>

        <!-- 메인 -->
        <main class="main">
            <!-- 헤더 -->
            <header class="header">
                <button class="header-btn" id="menuBtn">
                    <i class="fa-solid fa-bars"></i>
                </button>
                <div class="header-center">
                    <span class="model-badge">Chat Got v2.1</span>
                </div>
                <button class="header-btn" id="settingsBtn">
                    <i class="fa-solid fa-gear"></i>
                </button>
            </header>

            <!-- 채팅 영역 -->
            <div class="chat-area">
                <div class="chat-scroll" id="chatScroll">
                    <div class="welcome-section" id="welcomeSection">
                        <h1 class="welcome-heading">무엇을 도와드릴까요?</h1>
                        <p class="welcome-sub">질문을 입력하거나 아래 주제를 선택해보세요</p>
                        <div class="suggestions-grid">
                            <button class="suggestion-card" data-query="머신러닝이 뭔지 쉽게 설명해줘">
                                <span>🧠 머신러닝 쉽게 이해하기</span>
                            </button>
                            <button class="suggestion-card" data-query="파이썬으로 데이터 정렬하는 방법 알려줘">
                                <span>💻 파이썬 코딩 도움</span>
                            </button>
                            <button class="suggestion-card" data-query="생산성을 높이는 방법이 뭐가 있을까?">
                                <span>⚡ 생산성 향상 팁</span>
                            </button>
                            <button class="suggestion-card" data-query="클린 코드 작성하는 좋은 습관 알려줘">
                                <span>✨ 클린 코드 습관</span>
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 입력창 -->
            <div class="input-section">
                <div class="input-container">
                    <div class="modern-input-wrapper">
                        <div class="input-main-row">
                            <textarea id="userInput" placeholder="무엇이든 물어보세요..." rows="1" maxlength="10000"></textarea>
                            <button class="send-btn-modern" id="sendBtn" disabled>
                                <i class="fa-solid fa-arrow-up"></i>
                            </button>
                        </div>
                    </div>
                </div>
                <p class="input-notice">Chat Got은 실수할 수 있어요. 중요한 정보는 꼭 확인해주세요.</p>
            </div>
        </main>
    </div>

    <!-- 설정 모달 -->
    <div class="settings-overlay" id="settingsOverlay"></div>
    <div class="settings-modal" id="settingsModal">
        <div class="settings-header">
            <h2>설정</h2>
            <button class="settings-close" id="settingsCloseBtn"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div class="settings-content">
            <div class="setting-item">
                <span>다크 모드</span>
                <label class="switch">
                    <input type="checkbox" id="darkModeToggle">
                    <span class="slider round"></span>
                </label>
            </div>
            <div class="setting-item">
                <span>글자 크기</span>
                <div class="font-size-controls">
                    <button class="font-btn" data-size="small">A</button>
                    <button class="font-btn active" data-size="medium">A</button>
                    <button class="font-btn" data-size="large">A</button>
                </div>
            </div>
            <div class="setting-item">
                <span>대화 초기화</span>
                <button class="danger-btn" id="resetConversationsBtn">모두 지우기</button>
            </div>
        </div>
    </div>

    <script src="knowledge.js"></script>
    <script src="script.js"></script>
</body>
</html>
