<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>커뮤니티 - momQ 프리미엄 쇼핑몰</title>
  <style>
    /* 기본 리셋 및 폰트 설정 */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Pretendard', sans-serif;
    }
    body {
      background-color: #f9f9f9;
      color: #333;
      text-align: center;
    }
    /* index.html에서 사용한 고급스러운 헤더 스타일 */
    .header {
      background: linear-gradient(135deg, #141E30, #243B55);
      padding: 20px 40px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
    }
    .header-container {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .header-logo {
      font-size: 32px;
      font-weight: bold;
      letter-spacing: 2px;
      color: #E74C3C; /* 프리미엄 빨간색 */
      text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.3);
      text-decoration: none;
    }
    .header-nav ul {
      list-style: none;
      display: flex;
      gap: 20px;
    }
    .header-nav ul li a {
      color: #fff;
      font-size: 16px;
      padding-bottom: 4px;
      position: relative;
      text-decoration: none;
      transition: color 0.3s;
    }
    .header-nav ul li a:after {
      content: "";
      position: absolute;
      width: 0;
      height: 2px;
      background: #fff;
      left: 0;
      bottom: 0;
      transition: width 0.3s;
    }
    .header-nav ul li a:hover {
      color: #ddd;
    }
    .header-nav ul li a:hover:after {
      width: 100%;
    }
    /* 커뮤니티 페이지 본문 기본 레이아웃 */
    .community-content {
      max-width: 1200px;
      margin: 30px auto;
      padding: 20px;
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    .community-content h1 {
      margin-bottom: 20px;
      font-size: 28px;
      color: #E74C3C;
    }
    .community-content p {
      font-size: 16px;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <!-- 상단 헤더 (index.html과 동일한 디자인) -->
  <header class="header">
    <div class="header-container">
      <!-- 로고를 클릭하면 index.html로 이동 -->
      <a href="index.html" class="header-logo">momQ</a>
      <nav class="header-nav">
        <ul>
          <li><a href="index.html">홈</a></li>
          <li><a href="#">제품</a></li>
          <li><a href="#">이벤트</a></li>
          <li><a href="community.html">커뮤니티</a></li>
          <li><a href="#">문의하기</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <!-- 커뮤니티 페이지 본문 (추후 추가할 콘텐츠용 기본 구조) -->
  <main class="community-content">
    <h1>커뮤니티에 오신 것을 환영합니다</h1>
    <p>
      여기는 최신 게시글과 활발한 대화가 이루어지는 커뮤니티 공간입니다.<br>
      원하는 주제를 클릭하여 다양한 정보를 확인해 보세요.
    </p>
    <!-- 추가적인 커뮤니티 콘텐츠나 게시물 리스트를 여기에 확장할 수 있습니다. -->
  </main>
</body>
</html>
