<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>TV SpotCam</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    /* 임시 모바일 헤더 스타일 (JS에서 동적 생성되므로 여기에 추가) */
    #mobile-header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 50px;
      background: #1a1a1a;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      z-index: 9999;
      color: white;
      font-weight: bold;
    }
    #mobile-header button {
      background: none;
      border: none;
      color: white;
      font-size: 20px;
    }
  </style>
</head>
<body>
  <!-- 기존 PC 헤더 -->
  <header id="header">
    <div class="header-inner">
      <div class="logo" data-lang-key="nav_home">TVSPOTCAM</div>
      <nav class="nav-desktop">
        <a href="#" class="nav-link active" data-lang-key="nav_home">홈</a>
        <a href="#" class="nav-link" data-lang-key="nav_live">라이브</a>
        <a href="#" class="nav-link" data-lang-key="nav_vod">VOD</a>
        <a href="#" class="nav-link" data-lang-key="nav_community">커뮤니티</a>
        <a href="#" class="nav-link" data-lang-key="nav_event">이벤트</a>
      </nav>
      <div class="user-actions">
        <div class="search-wrapper">
          <input type="text" class="search-input" placeholder="검색어를 입력하세요..." />
          <button class="search-icon-btn">🔍</button>
        </div>
        <select id="langSelect">
          <option value="ko">한국어</option>
          <option value="en">English</option>
        </select>
        <button class="btn-icon">🔒</button>
      </div>
    </div>
  </header>

  <!-- 메인 콘텐츠 영역 (예시) -->
  <main>
    <section>
      <h2 data-lang-key="infra_title">INFRASTRUCTURE MONITORING</h2>
      <div class="infra-dashboard">
        <div class="infra-header">
          <div class="header-grid">
            <div class="system-info">
              <div class="cluster-details">
                <div class="cluster-item">
                  <span class="cluster-label" data-lang-key="cluster_label">CLUSTER:</span>
                  <span class="cluster-value">Node-01</span>
                </div>
                <div class="cluster-item">
                  <span class="cluster-label" data-lang-key="region_label">REGION:</span>
                  <span class="cluster-value">KR-Seoul</span>
                </div>
                <div class="cluster-item">
                  <span class="cluster-label" data-lang-key="status_label">STATUS:</span>
                  <span class="status-badge">Normal</span>
                </div>
              </div>
            </div>
            <div class="status-center">
              <div class="uptime-display">
                <div class="uptime-value" data-lang-key="uptime_value">99.9%</div>
                <div class="uptime-label" data-lang-key="uptime_label">UPTIME</div>
              </div>
            </div>
            <div class="time-metrics">
              <div class="current-time" data-lang-key="current_time">14:23:01 UTC</div>
            </div>
          </div>
        </div>

        <div class="dashboard-grid">
          <div class="metrics-panel">
            <div class="panel-header">
              <h3 data-lang-key="system_metrics">SYSTEM METRICS</h3>
            </div>
            <div class="metric-cards">
              <div class="metric-card">
                <div class="metric-info">
                  <span class="metric-label" data-lang-key="cpu_util">CPU</span>
                  <span class="metric-value">25%</span>
                </div>
                <div class="metric-bar">
                  <div class="bar-fill cpu"></div>
                </div>
              </div>
              <!-- 더 많은 메트릭 카드들... -->
            </div>
          </div>

          <div class="service-map-panel">
            <div class="panel-header">
              <h3>서비스 의존성</h3>
              <div class="view-controls">
                <button class="view-btn active" data-lang-key="live">LIVE</button>
                <button class="view-btn" data-lang-key="health">HEALTH</button>
                <button class="view-btn" data-lang-key="perf">PERF</button>
              </div>
            </div>
            <div class="service-map">
              <div class="service-node primary">
                <div class="node-icon">🖥️</div>
                <div class="node-info">
                  <div class="node-name" data-lang-key="api_label">API</div>
                  <div class="node-status ok">OK</div>
                </div>
              </div>
              <div class="service-connection"></div>
              <div class="service-node">
                <div class="node-icon">🗄️</div>
                <div class="node-info">
                  <div class="node-name" data-lang-key="db_label">DB</div>
                  <div class="node-status ok">OK</div>
                </div>
              </div>
              <div class="service-connection"></div>
              <div class="service-node">
                <div class="node-icon">🚀</div>
                <div class="node-info">
                  <div class="node-name" data-lang-key="cdn_label">CDN</div>
                  <div class="node-status ok">OK</div>
                </div>
              </div>
            </div>
          </div>

          <div class="alerts-panel">
            <div class="panel-header">
              <h3 data-lang-key="recent_alerts">RECENT ALERTS</h3>
            </div>
            <div class="alert-list">
              <div class="alert-item">
                <span class="alert-title" data-lang-key="alert1_title">High CPU Load</span>
                <span class="alert-time" data-lang-key="alert1_time">2m ago</span>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
