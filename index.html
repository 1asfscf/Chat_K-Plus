<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>momQ 홈</title>
  <link rel="stylesheet" href="style.css" />
  <!-- 페이지에 직접 스타일을 추가하여 헤더를 고급스럽게 디자인 -->
  <style>
    /* 헤더 영역 기본 스타일 */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 20px;
      background: #fff;
      border-bottom: 1px solid #e5e5e5;
    }
    .header-left {
      display: flex;
      align-items: center;
    }
    .menu-icon {
      font-size: 24px;
      cursor: pointer;
      margin-right: 15px;
    }
    .logo {
      font-size: 24px;
      font-weight: bold;
      color: #333;
      text-decoration: none;
      margin-right: 30px;
    }
    /* 추가한 공지사항 링크 스타일 */
    .header-notice-link {
      font-size: 18px;
      color: #333;
      text-decoration: none;
      padding: 5px 10px;
      border: 1px solid transparent;
      transition: all 0.3s ease;
    }
    .header-notice-link:hover {
      color: #fff;
      background: #333;
      border-color: #333;
    }

    .header-right {
      display: flex;
      align-items: center;
    }
    .search-bar {
      display: flex;
      align-items: center;
      margin-right: 20px;
    }
    .search-bar input {
      padding: 5px 8px;
      border: 1px solid #ccc;
      border-radius: 3px 0 0 3px;
      outline: none;
    }
    .search-bar button {
      padding: 5px 10px;
      border: 1px solid #ccc;
      border-left: none;
      background: #333;
      color: #fff;
      border-radius: 0 3px 3px 0;
      cursor: pointer;
    }
    .icons span {
      font-size: 20px;
      margin-left: 15px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <!-- 수정된 헤더: 기존 헤더 구조 유지, 로고와 함께 '공지사항' 링크 추가 -->
  <header>
    <div class="header-left">
      <div class="menu-icon">☰</div>
      <!-- 로고 클릭 시 index.html로 이동 -->
      <a href="index.html" class="logo">momQ</a>
      <!-- 공지사항 링크: 클릭 시 notice.html 페이지로 이동 -->
      <a href="notice.html" class="header-notice-link">공지사항</a>
    </div>
    <div class="header-right">
      <div class="search-bar">
        <input type="text" placeholder="검색" />
        <button type="button">🔍</button>
      </div>
      <div class="icons">
        <span class="icon chat-icon">💬</span>
        <span class="icon cart-icon">🛒<small class="badge">0</small></span>
        <span class="icon profile-icon">👤</span>
      </div>
    </div>
  </header>

  <!-- 나머지 콘텐츠 (예: 배너 이미지 등) -->
  <img id="toggleImage"
       class="header-banner"
       src="https://img.makeshop.co.kr/4/29457/202504/be565292ad4c3d90c670a84df580d0f5.png"
       data-state="first"
       alt="momQ 홍보 이미지">

  <!-- 필요한 추가 콘텐츠들 (메뉴 버튼, 추천 상품 등) -->
  <!-- ... -->

  <script src="script.js"></script>
</body>
</html>
