<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=, maximum-scale=1" />
  <title>티빙</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
  <style>
    /* 공통 변수 */
    :root {
      --clr-bg: #0a0a0a;
      --clr-primary: #e50914;
      --clr-text: #eee;
      --header-h-pc: 56px;
      --header-h-mobile: 48px;
      --touch-target: 44px;
      --hamburger-size: 48px;
      --logo-size-pc: 28px;
      --logo-size-mobile: 24px;
      --nav-font: 16px;
      --hover-transition: 0.3s ease;
      --card-elevate-y: -8px;
      --banner-height-pc: 300px;
      --banner-height-mobile: 180px;
    }
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0; padding: 0;
    }
    body {
      background: var(--clr-bg);
      color: var(--clr-text);
      font-family: 'Noto Sans KR', sans-serif;
      overflow-x: hidden;
    }

    /* ─────────────── PC 헤더 모던 업그레이드 ─────────────── */
    header {
      position: fixed; top: 0; left: 0; right: 0;
      height: var(--header-h-pc);
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 24px;
      background: rgba(0,0,0,0.85);
      backdrop-filter: saturate(180%) blur(10px);
      border-bottom: 1px solid rgba(255,255,255,0.1);
      z-index: 1000;
      transition: height 0.3s ease;
    }
    .logo {
      font: 900 var(--logo-size-pc)/1 'Noto Sans KR';
      letter-spacing: 4px; color: var(--clr-primary);
      user-select: none; flex-shrink: 0;
    }
    .pc-nav {
      display: flex; gap: 32px; flex: 1; justify-content: center;
    }
    .pc-nav a {
      font: 600 var(--nav-font)/1 'Noto Sans KR';
      color: var(--clr-text);
      position: relative;
      padding: 12px 16px;
      display: flex; align-items: center;
      transition: color var(--hover-transition), background var(--hover-transition);
      text-decoration: none; border-radius: 6px;
    }
    @media (hover: hover) and (pointer: fine) {
      .pc-nav a:hover {
        color: var(--clr-primary);
        background: rgba(229,9,20,0.15);
      }
      .pc-nav a.active::after {
        content: '';
        position: absolute; bottom: 4px; left:50%;
        transform: translateX(-50%);
        width:60%; height:2px;
        background: var(--clr-primary);
        border-radius:1px;
      }
    }

    /* ─────────────── 배너 슬라이드 ─────────────── */
    .banner-container {
      position: relative;
      margin-top: var(--header-h-pc);
      width: 100%;
      height: var(--banner-height-pc);
      overflow: hidden;
    }
    .banner-slide {
      display: flex;
      width: 200%;
      height: 100%;
      transition: transform 0.6s ease;
    }
    .banner-item {
      width: 50%;
      flex-shrink: 0;
    }
    .banner-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .banner-controls {
      position: absolute;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 8px;
    }
    .banner-dot {
      width: 10px;
      height: 10px;
      background: rgba(255,255,255,0.6);
      border-radius: 50%;
      cursor: pointer;
      transition: background 0.3s;
    }
    .banner-dot.active {
      background: var(--clr-primary);
    }

    /* ─────────────── 본문 ─────────────── */
    main {
      padding: calc(var(--header-h-pc) + var(--banner-height-pc) + 16px) 16px 16px;
      max-width: 1280px; margin: 0 auto;
    }
    .section-title {
      font: 700 18px/1.2 'Noto Sans KR'; margin-bottom: 16px;
    }
    .top20-list {
      display:flex; gap:12px; overflow-x:auto; scroll-behavior:smooth; padding-bottom:12px;
      -webkit-overflow-scrolling: touch; scroll-snap-type: x mandatory;
    }
    .top20-list::-webkit-scrollbar { display: none; }
    .top20-item {
      position: relative; flex:0 0 120px; border-radius:8px; overflow:hidden;
      cursor:pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      scroll-snap-align:start; -webkit-tap-highlight-color:transparent;
    }
    @media (hover: hover) and (pointer: fine) {
      .top20-item:hover {
        transform: translateY(var(--card-elevate-y)) scale(1.03);
        box-shadow: 0 8px 16px rgba(0,0,0,0.6);
      }
    }
    .top20-item:active {
      transform: translateY(var(--card-elevate-y)) scale(1.02);
      box-shadow: 0 12px 24px rgba(0,0,0,0.7);
    }
    .top20-item img {
      width:100%; aspect-ratio:2/3; object-fit:cover; display:block;
    }
    .rank {
      position:absolute; top:8px; left:8px;
      font:900 20px/1 'Noto Sans KR'; color:#fff;
      text-shadow:0 0 4px rgba(0,0,0,0.8);
    }
    .label {
      position:absolute; top:8px; right:8px; padding:3px 6px;
      font:700 10px/1 'Noto Sans KR'; border-radius:3px; color:#fff; background:var(--clr-primary);
    }
    .label.age { background:#ff3b3b; right:auto; left:8px; top:36px; }
    .label.only { background:#00a8ff; }

    /* ─────────────── 모바일 전용 ─────────────── */
    @media (pointer: coarse) {
      header {
        height: var(--header-h-mobile);
      }
      .banner-container {
        height: var(--banner-height-mobile);
        margin-top: var(--header-h-mobile);
      }
      main {
        padding: calc(var(--header-h-mobile) + var(--banner-height-mobile) + 16px) 16px 16px;
      }
      .logo {
        font-size: var(--logo-size-mobile);
        letter-spacing: 2px;
      }
      .pc-nav { display: none; }
      /* 햄버거, 드로어, 하단 네비 동일 유지 */
    }

    /* ─────────────── 태블릿 이상 (PC 네비 복원) ─────────────── */
    @media (pointer: fine) and (min-width: 768px) {
      .hamburger, .mobile-nav-drawer, .mobile-bottom-nav { display: none; }
    }
  </style>
</head>
<body>
  <header>
    <button class="hamburger" aria-label="메뉴 열기" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
    <div class="logo" aria-label="티빙 로고">TVING</div>
    <nav class="pc-nav" role="navigation" aria-label="주요 메뉴">
      <a href="#" class="active">실시간</a>
      <a href="#">TV프로그램</a>
      <a href="#">영화</a>
      <a href="#">파라운트+</a>
      <a href="#">키즈</a>
    </nav>
  </header>

  <!-- 배너 슬라이드 -->
  <div class="banner-container">
    <div class="banner-slide" id="bannerSlide">
      <div class="banner-item">
        <img src="https://t1.daumcdn.net/brunch/service/user/7onF/image/-UOqf4TxgKFINfDx34hOWbrQpL4.png" alt="배너1">
      </div>
      <div class="banner-item">
        <img src="https://i.ytimg.com/vi/e3usuzCDe4k/mqdefault.jpg" alt="배너2">
      </div>
    </div>
    <div class="banner-controls">
      <div class="banner-dot active" data-index="0"></div>
      <div class="banner-dot" data-index="1"></div>
    </div>
  </div>

  <!-- 기존 본문 -->
  <main>
    <section class="top20" aria-label="오늘의 티빙 TOP 20">
      <h2 class="section-title">오늘의 티빙 TOP 20</h2>
      <div class="top20-list">
        <!-- ... items 유지 ... -->
      </div>
    </section>
  </main>

  <!-- 기존 모바일 하단 네비 유지 -->
  <nav class="mobile-bottom-nav" role="navigation" aria-label="모바일 하단 메뉴">
    <!-- ... -->
  </nav>

  <script>
    // 모바일 전용 네비 토글 유지
    if (window.matchMedia('(pointer: coarse)').matches) {
      const drawer = document.querySelector('.mobile-nav-drawer');
      const burger = document.querySelector('.hamburger');
      const lines = burger.querySelectorAll('span');
      burger.addEventListener('click', () => {
        const open = drawer.classList.toggle('open');
        burger.setAttribute('aria-expanded', open);
        lines.forEach((l,i)=> {
          l.style.transform = open
            ? ['rotate(45deg) translateY(6px)','scale(0)','rotate(-45deg) translateY(-6px)'][i]
            : '';
        });
      });
    }

    // 배너 슬라이드 스크립트
    (function(){
      const slide = document.getElementById('bannerSlide');
      const dots = document.querySelectorAll('.banner-dot');
      dots.forEach(dot=>{
        dot.addEventListener('click',()=>{
          const idx = dot.dataset.index;
          slide.style.transform = `translateX(-${idx*50}%)`;
          dots.forEach(d=>d.classList.remove('active'));
          dot.classList.add('active');
        });
      });
      // 자동 슬라이드 (선택)
      let current = 0;
      setInterval(()=>{
        current = (current+1)%dots.length;
        dots[current].click();
      },5000);
    })();
  </script>
</body>
</html>
