<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>noonoo스트리밍 - 넷플릭스 스타일 카드</title>
  <style>
    :root {
      --main-red: #e50914;
      --header-bg: rgba(24,24,24,0.82);
      --nav-bg: rgba(28,28,28,0.93);
      --blur: blur(12px);
      --transition: 0.3s cubic-bezier(.7,0,.3,1);
      --card-bg: #232323;
      --card-shadow: 0 4px 24px rgba(0,0,0,0.18);
      --card-radius: 18px;
      --card-overlay: linear-gradient(0deg,rgba(20,20,20,0.93) 75%,rgba(20,20,20,0));
    }
    html, body { margin:0; padding:0; background:#181818; color:#fff; font-family:'Pretendard','Noto Sans KR',sans-serif;}
    body { min-height:100vh; }
    a { color:inherit; text-decoration:none; }
    img { max-width:100%; display:block; }

    /* --------- 공통 헤더 --------- */
    .header {
      position:fixed; top:0; left:0; width:100vw; z-index:100;
      background:var(--header-bg); backdrop-filter:var(--blur);
      display:flex; align-items:center; justify-content:space-between;
      height:60px; padding:0 2vw; box-sizing:border-box;
      box-shadow:0 2px 12px rgba(0,0,0,0.13);
      gap:1vw;
    }
    .header-left { display:flex; align-items:center; gap:1vw; min-width:0;}
    .logo { font-size:2.1vw; color:var(--main-red); font-weight:700; min-width:70px; }
    .search-bar {
      background:#232323; border-radius:18px; border:none; padding:8px 18px;
      color:#fff; font-size:1vw; min-width:100px; width:20vw; max-width:320px;
      margin:0 2vw; transition:width var(--transition);
      display:block;
    }
    .header-right {
      display:flex; align-items:center; gap:1vw; min-width:0;
      flex-shrink:0;
    }
    .profile-img, .grandma-img {
      width:2.8vw; min-width:32px; max-width:48px; aspect-ratio:1/1;
      height:auto; border-radius:50%; object-fit:cover; border:2px solid #fff;
      background:#333;
      box-shadow:0 2px 8px rgba(0,0,0,0.13);
      transition:box-shadow var(--transition), border var(--transition);
    }
    .grandma-img { margin-left:0.7vw; border-color:var(--main-red);}
    /* --------- 슬라이더 --------- */
    .main-slider {
      margin-top:60px; width:100vw; overflow:hidden;
      border-radius:0 0 22px 22px; box-shadow:0 4px 24px rgba(0,0,0,0.25);
      position:relative; background:#222;
      min-height:25vw; max-height:380px;
      display:flex; align-items:center; justify-content:center;
    }
    .slide-track {
      display:flex; width:100%; height:100%; transition:transform var(--transition);
    }
    .slide {
      min-width:100vw; height:32vw; min-height:180px; max-height:380px;
      position:relative; opacity:0.7; transition:opacity 0.5s;
      display:flex; align-items:flex-end; justify-content:flex-start;
      overflow:hidden;
    }
    .slide.active { opacity:1;}
    .slide img {
      width:100vw; height:100%; object-fit:cover;
      transition:transform 0.5s;
    }
    .slide-caption {
      position:absolute; left:0; bottom:0; width:100%; max-width:100vw;
      padding:2.5vw 4vw 2vw 2vw;
      background:linear-gradient(0deg,rgba(24,24,24,0.92) 80%,rgba(24,24,24,0));
      color:#fff; border-radius:0 0 22px 22px;
      animation:fadeInUp 0.7s;
    }
    .slide-caption h2 { font-size:2vw; margin-bottom:1vw;}
    .slide-caption p { font-size:1.05vw; opacity:0.8;}
    .slider-dots {
      position:absolute; left:50%; bottom:1.2vw; transform:translateX(-50%);
      display:flex; gap:0.7vw;
    }
    .slider-dot {
      width:0.8vw; height:0.8vw; min-width:8px; min-height:8px; border-radius:50%;
      background:#fff; opacity:0.4; transition:opacity 0.2s;
    }
    .slider-dot.active { background:var(--main-red); opacity:1;}
    /* --------- 콘텐츠 --------- */
    .content-section { max-width:1100px; margin:3vw auto 0 auto; }
    .section-title { font-size:1.3vw; font-weight:700; margin:0 0 1vw 0.7vw;}

    /* 넷플릭스 스타일 카드 */
    .card-grid {
      display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
      gap:1.8vw; margin-bottom:2vw;
    }
    .content-card {
      background:var(--card-bg);
      border-radius:var(--card-radius);
      overflow:hidden;
      box-shadow:var(--card-shadow);
      transition:transform 0.35s cubic-bezier(.7,0,.3,1), box-shadow 0.18s;
      cursor:pointer; position:relative;
      min-width:0;
      display:flex; flex-direction:column; align-items:stretch;
      animation:fadeInUp 0.7s;
    }
    .content-card img {
      width:100%; height:190px; object-fit:cover;
      border-radius:var(--card-radius) var(--card-radius) 0 0;
      background:#333;
      display:block;
    }
    .card-overlay {
      position:absolute; left:0; bottom:0; width:100%; height:90px;
      background:var(--card-overlay);
      display:flex; flex-direction:column; justify-content:flex-end;
      pointer-events:none;
    }
    .card-info {
      position:absolute; left:0; bottom:0; width:100%; z-index:2;
      display:flex; flex-direction:column; align-items:flex-start;
      padding:0 0 16px 18px;
      pointer-events:none;
    }
    .content-card .badge {
      position:absolute; top:13px; left:13px; background:var(--main-red); color:#fff;
      font-size:0.93rem; padding:2.5px 13px; border-radius:13px; font-weight:600;
      box-shadow:0 2px 8px rgba(255,23,68,0.11);
    }
    .content-card p {
      font-size:1.07rem; color:#fff; margin:0 0 7px 0; font-weight:600;
      white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
      letter-spacing:0.01em;
      text-shadow:0 2px 8px rgba(0,0,0,0.32);
      pointer-events:none;
    }
    .card-actions {
      display: flex;
      gap: 8px;
      margin-top: 7px;
      pointer-events:auto;
    }
    .nf-btn {
      background: linear-gradient(90deg, #e50914 0%, #b81d24 100%);
      color: #fff;
      border: none;
      border-radius: 7px;
      font-size: 0.98rem;
      font-weight: 600;
      padding: 7px 18px 7px 14px;
      display: flex;
      align-items: center;
      gap: 7px;
      box-shadow: 0 2px 12px rgba(229,9,20,0.15);
      cursor: pointer;
      transition: background 0.23s, transform 0.18s, box-shadow 0.18s;
      outline: none;
    }
    .nf-btn .icon {
      font-size: 1.15em;
      display: flex;
      align-items: center;
    }
    .nf-btn.play {
      background: linear-gradient(90deg, #e50914 0%, #b81d24 100%);
    }
    .nf-btn.like {
      background: #232323;
      color: #e50914;
      padding: 7px 11px;
      font-size: 1.1rem;
      border-radius: 50%;
      box-shadow: none;
      border: 1.5px solid #e50914;
    }
    .nf-btn.add {
      background: #232323;
      color: #fff;
      padding: 7px 13px;
      font-size: 1.3rem;
      border-radius: 50%;
      box-shadow: none;
      border: 1.5px solid #fff;
    }
    .nf-btn:hover, .nf-btn:focus {
      background: linear-gradient(90deg, #b81d24 0%, #e50914 100%);
      transform: scale(1.07);
      box-shadow: 0 4px 18px rgba(229,9,20,0.18);
    }
    .nf-btn.like:hover, .nf-btn.like:focus {
      background: #e50914;
      color: #fff;
      border-color: #fff;
    }
    .nf-btn.add:hover, .nf-btn.add:focus {
      background: #fff;
      color: #e50914;
      border-color: #e50914;
    }
    .content-card:hover { transform:scale(1.05);}
    .content-card.active {
      transform: translateY(-12px) scale(1.05);
      box-shadow: 0 16px 36px rgba(255,23,68,0.18);
    }
    /* --------- 모바일 --------- */
    @media (max-width: 900px) {
      .header { height:48px; padding:0 3vw;}
      .logo { font-size:1.2rem;}
      .search-bar { display:none;}
      .profile-img, .grandma-img { width:34px; min-width:28px; max-width:38px;}
      .main-slider { min-height:120px; max-height:180px;}
      .slide { height:38vw; min-height:120px; max-height:180px;}
      .slide-caption { padding:12px 14px 10px 10px;}
      .slide-caption h2 { font-size:1.05rem;}
      .slide-caption p { font-size:0.93rem;}
      .slider-dot { width:8px; height:8px;}
      .content-section { margin-top:18px;}
      .section-title { font-size:1.02rem;}
      .card-grid { gap:12px;}
      .content-card { min-width:120px; max-width:150px;}
      .content-card img { height:100px;}
      .content-card .badge { font-size:0.69rem;}
      .content-card p { font-size:0.91rem;}
      .card-actions { gap: 5px;}
      .nf-btn { font-size:0.92rem; padding:6px 12px 6px 10px;}
      .nf-btn.like, .nf-btn.add { padding:6px 8px; font-size:1.05rem;}
    }
    @keyframes fadeInUp {
      0% { opacity:0; transform:translateY(20px);}
      100% { opacity:1; transform:translateY(0);}
    }
    @keyframes fadeInDown {
      0% { opacity:0; transform:translateY(-24px);}
      100% { opacity:1; transform:translateY(0);}
    }
  </style>
</head>

  <script>
    // 슬라이드 동작
    const slides = document.querySelectorAll('.slide');
    const slideTrack = document.getElementById('slideTrack');
    const dotsBox = document.getElementById('sliderDots');
    let current = 0;
    function showSlide(idx) {
      slides.forEach((s,i)=>s.classList.toggle('active',i===idx));
      document.querySelectorAll('.slider-dot').forEach((d,i)=>d.classList.toggle('active',i===idx));
      slideTrack.style.transform = `translateX(-${idx*100}vw)`;
    }
    // 도트 생성
    dotsBox.innerHTML = '';
    slides.forEach((_,i)=>{
      const d = document.createElement('div');
      d.className = 'slider-dot'+(i===0?' active':'');
      d.onclick = ()=>{current=i;showSlide(current);}
      dotsBox.appendChild(d);
    });
    function moveSlide(dir) {
      current = (current+dir+slides.length)%slides.length;
      showSlide(current);
    }
    setInterval(()=>{moveSlide(1);},4200);

    // PC/모바일 카드 구분
    function handleResize() {
      const isPC = window.innerWidth>=900;
      document.querySelector('.card-grid').style.display = isPC?'grid':'none';
      document.querySelector('.card-row').style.display = isPC?'none':'flex';
    }
    window.addEventListener('resize',handleResize);
    window.addEventListener('DOMContentLoaded',handleResize);

    // 모바일 검색 버튼
    const mobileSearchBtn = document.getElementById('mobileSearchBtn');
    const mobileSearchWrap = document.getElementById('mobileSearchWrap');
    let mobileSearchInput = null;
    mobileSearchBtn && mobileSearchBtn.addEventListener('click',()=>{
      if(document.querySelector('.mobile-search-bar')) return;
      mobileSearchInput = document.createElement('input');
      mobileSearchInput.className = 'mobile-search-bar';
      mobileSearchInput.type = 'text';
      mobileSearchInput.placeholder = '검색 (모바일)';
      mobileSearchWrap.appendChild(mobileSearchInput);
      mobileSearchInput.focus();
      mobileSearchInput.addEventListener('blur',()=>{
        mobileSearchInput.remove();
      });
    });

    // 카드 클릭/터치 시 부드럽게 위로 올라가는 효과 (PC/모바일 모두)
    function addCardClickEffect() {
      document.querySelectorAll('.content-card').forEach(card => {
        card.addEventListener('click', function() {
          card.classList.add('active');
          setTimeout(() => card.classList.remove('active'), 400);
        });
        card.addEventListener('touchstart', function() {
          card.classList.add('active');
          setTimeout(() => card.classList.remove('active'), 400);
        });
      });
    }
    window.addEventListener('DOMContentLoaded', addCardClickEffect);
  </script>
