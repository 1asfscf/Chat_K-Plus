<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>momQ 프리미엄 쇼핑몰</title>
    <style>
        /* 전체 스타일 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Pretendard', sans-serif;
        }
        body {
            background-color: #f9f9f9;
            color: #333;
            text-align: center;
        }

        /* 헤더 */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background-color: white;
            padding: 16px 30px;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.08);
        }
        .header-logo {
            font-size: 24px;
            font-weight: bold;
            color: #004085;
        }
        .header-nav ul {
            list-style: none;
            display: flex;
        }
        .header-nav ul li {
            margin: 0 15px;
        }
        .header-nav ul li a {
            color: #333;
            text-decoration: none;
            font-weight: bold;
            font-size: 15px;
            transition: 0.3s;
        }
        .header-nav ul li a:hover {
            color: #007bff;
        }

        /* 이미지 배너 */
        .image-banner {
            display: flex;
            justify-content: center;
            margin: 30px auto;
            padding: 0 5%;
        }
        .image-banner img {
            width: 100%;
            max-width: 1400px;
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.2);
        }

        /* 버튼 컨테이너 */
        .buttons-container {
            display: flex;
            justify-content: center;
            flex-wrap: nowrap;
            gap: 10px;
            padding: 15px 5%;
            background: white;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.08);
            width: 90%;
            max-width: 1400px;
            margin: 15px auto;
            overflow-x: auto;
        }
        .button-box {
            background: #1E5799;
            padding: 8px 12px;
            font-size: 12px;
            font-weight: bold;
            color: white;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
            display: inline-block;
            border: 2px solid #164E8D;
            min-width: 80px;
        }
        .button-box:hover {
            background: #164E8D;
            border-color: #1E7FBF;
            transform: scale(1.05);
        }

        /* 추천 상품 섹션 */
        .products-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 15px;
            padding: 30px 10%;
            background: white;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.08);
            border-radius: 15px;
            width: 90%;
            max-width: 1400px;
            margin: 20px auto;
        }
        .product-box {
            background: white;
            padding: 12px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.12);
            text-align: center;
            border: 1px solid #ddd;
        }
        .product-box img {
            width: 100%;
            max-width: 200px;
            border-radius: 5px;
            margin-bottom: 10px;
        }
        .product-box h3 {
            font-size: 15px;
            font-weight: bold;
            color: #333;
            margin-bottom: 5px;
        }
        .product-box p {
            font-size: 13px;
            color: #666;
            margin-bottom: 8px;
        }
        .product-box .price {
            font-size: 14px;
            font-weight: bold;
            color: #d43f3f;
        }

        /* 푸터 */
        footer {
            text-align: center;
            padding: 16px;
            background-color: #f1f1f1;
            color: #666;
            font-size: 13px;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="header-logo">momQ 쇼핑몰</div>
        <nav class="header-nav">
            <ul>
                <li><a href="#">홈</a></li>
                <li><a href="#">제품</a></li>
                <li><a href="#">이벤트</a></li>
                <li><a href="#">커뮤니티</a></li>
                <li><a href="#">문의하기</a></li>
            </ul>
        </nav>
    </header>

    <!-- 이미지 배너 -->
    <section class="image-banner">
        <img src="https://img.makeshop.co.kr/4/29457/202505/f1209b13f25e5d92900bb38ef6a9f521.jpg" alt="momQ 이벤트 배너">
    </section>

    <!-- 버튼 컨테이너 -->
    <section class="buttons-container">
        <div class="button-box">웰컴혜택</div>
        <div class="button-box">허그박스</div>
        <div class="button-box">맘큐라이브</div>
        <div class="button-box">쿠폰/포인트</div>
        <div class="button-box">커뮤니티</div>
        <div class="button-box">샘플신청</div>
        <div class="button-box">데일리퍼즐</div>
        <div class="button-box">피팅룸</div>
        <div class="button-box">프리미엄</div>
        <div class="button-box">육아정보</div>
    </section>

    <!-- 추천 상품 섹션 -->
    <section class="products-container">
        <div class="product-box">
            <img src="https://cdn5-aka.makeshop.co.kr/shopimages/2020nemomq/001004006440.jpg?1742963527" alt="하기스 네이처메이드 썸머팬츠">
            <h3>하기스 네이처메이드 썸머팬츠</h3>
            <p>2025 하기스 네이처메이드 여름팬티 5단계 80매 x 2팩</p>
            <p class="price">108,900원 <small style="color:gray; text-decoration: line-through;">172,000원</small></p>
        </div>
    </section>

    <footer>
        © 2025 momQ 스타일. 모든 권리 보유.
    </footer>
</body>
</html>
