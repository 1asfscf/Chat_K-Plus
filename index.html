<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chat K Plus</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
</head>
<body>

    <!-- 배경 효과 -->
    <div class="bg-glow"></div>

    <!-- 메인 컨테이너 (모바일: 전체 화면 / PC: 중앙 카드) -->
    <div class="chat-wrapper">
        
        <!-- 상단 헤더 (심플하게) -->
        <header class="top-bar">
            <div class="logo-text">CHAT <span class="accent">K+</span></div>
            <div class="status-indicator">
                <span class="dot"></span> Online
            </div>
        </header>

        <!-- 메시지 영역 -->
        <div class="msg-area" id="chat-box">
            
            <!-- 🧠 추론 UI 박스 (New Design) -->
            <div id="reasoning-container" class="reasoning-box hidden">
                
                <!-- 1단계: 분석 -->
                <div class="reasoning-step" id="step-analyzing">
                    <span class="reasoning-icon">🔍</span>
                    <span class="reasoning-text">Analyzing... Keywords extracted.</span>
                </div>

                <!-- 2단계: 검색 -->
                <div class="reasoning-step" id="step-searching">
                    <span class="reasoning-icon">🧠</span>
                    <span class="reasoning-text">Searching Knowledge Base...</span>
                </div>

                <!-- 3단계: 마무리 -->
                <div class="reasoning-step" id="step-finalizing">
                    <span class="reasoning-icon">✅</span>
                    <span class="reasoning-text">Finalizing Answer...</span>
                </div>

            </div>

            <!-- 첫 인사 -->
            <div class="msg bot-msg">
                <div class="avatar-sm">K</div>
                <div class="content">
                    질문을 입력해. 팩트 기반 추론 후 답변한다.
                </div>
            </div>

        </div>

        <!-- 입력 영역 (하단 고정) -->
        <div class="input-wrapper">
            <input type="text" id="user-input" placeholder="질문 입력..." autocomplete="off">
            <button id="send-btn" onclick="handleSend()">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
            </button>
        </div>

    </div>

    <script>
        // (테스트용 로직은 이전과 동일하게 유지)
        const chatBox = document.getElementById('chat-box');
        const reasoningContainer = document.getElementById('reasoning-container');
        const reasoningText = document.getElementById('reasoning-text');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');

        // 입력창 감지 시 전송 버튼 활성화
        userInput.addEventListener('input', () => {
            if(userInput.value.trim().length > 0) {
                sendBtn.classList.add('active');
            } else {
                sendBtn.classList.remove('active');
            }
        });
        
        // 초기 상태 설정
        sendBtn.classList.remove('active');

        userInput.addEventListener('keypress', (e) => {
            if(e.key === 'Enter') handleSend();
        });

        async function handleSend() {
            const text = userInput.value.trim();
            if(!text) return;

            appendMsg(text, 'user');
            userInput.value = '';
            sendBtn.classList.remove('active'); // 전송 후 비활성화

            // 추론 애니메이션 실행 (더미)
            await runReasoningAnimation("🔍 Analyzing... Keywords extracted.\n🧠 Searching Knowledge Base...\n✅ Finalizing Answer...");

            appendMsg("System.js 연결 대기 중... (팩트 답변 예정)", 'bot');
        }

        function appendMsg(text, type) {
            const div = document.createElement('div');
            div.className = `msg ${type}-msg`;
            
            if(type === 'user') {
                div.innerHTML = `<div class="content user-content">${text}</div>`;
            } else {
                div.innerHTML = `<div class="avatar-sm">K</div><div class="content">${text}</div>`;
            }
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        async function runReasoningAnimation(finalText) {
            reasoningContainer.classList.remove('hidden');
            reasoningText.innerHTML = "";
            
            for (let i = 0; i < finalText.length; i++) {
                reasoningText.innerHTML += finalText.charAt(i);
                reasoningContainer.scrollTop = reasoningContainer.scrollHeight;
                await new Promise(r => setTimeout(r, 40));
            }
            await new Promise(r => setTimeout(r, 1000));
            reasoningContainer.classList.add('hidden');
        }
    </script>
</body>
</html>
