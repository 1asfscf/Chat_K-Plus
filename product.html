<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>상품 페이지 - Huggies Nature Made 기저귀</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- 기존 헤더 (맘큐 스타일) -->
  <header>
    <div class="header-left">
      <div class="menu-icon">☰</div>
      <!-- 로고 클릭 시 홈(index.html)으로 이동 -->
      <a href="index.html" class="logo">momQ</a>
      <nav class="nav-links">
        <ul>
          <li><a href="#best">베스트</a></li>
          <li><a href="#wishlist">찜(하)기스데이</a></li>
          <li><a href="#sale">삭플/이벤트</a></li>
          <li><a href="#brand">브랜드</a></li>
          <li><a href="#community">커뮤니티</a></li>
          <li><a href="#plan">기획전</a></li>
        </ul>
      </nav>
    </div>
    <div class="header-right">
      <div class="search-bar">
        <input type="text" placeholder="검색" />
        <button type="button">🔍</button>
      </div>
      <div class="icons">
        <span class="icon chat-icon">💬</span>
        <span class="icon cart-icon">🛒<small class="badge">0</small></span>
        <!-- 프로필 아이콘: 클릭 시 로그인 모달 표시 -->
        <span class="icon profile-icon">👤</span>
      </div>
    </div>
  </header>

 <!-- 기존 상품 상세 정보 영역 (수정 후) -->
<div class="product-details">
    <h2 class="product-title">Huggies Nature Made 기저귀</h2>
    <p class="product-price">84,600원</p>
    <p class="product-description">
      Huggies Nature Made 기저귀는 자연친화적인 소재와 최상의 흡수력, 편안한 착용감을 자랑합니다.
      128매 구성과 최대 10% 포인트 적립 혜택으로 소비자에게 경제적인 선택을 제공합니다.
    </p>
    <!-- 버튼 그룹 추가: 왼쪽 '장바구니', 오른쪽 '구매하기' -->
    <div class="button-group">
      <button class="cart-button">장바구니</button>
      <button class="buy-button">구매하기</button>
    </div>
  </div>
  

  <!-- 로그인 모달 (프로필 아이콘, 구매하기 버튼 등 클릭 시 열림) -->
  <div id="loginModal" class="modal">
    <div class="modal-content">
      <span class="close">&times;</span>
      <div class="modal-body">
        <div class="form-section">
          <h2>로그인</h2>
          <p>안녕하세요, momQ에 오신 것을 환영합니다.</p>
          <form action="#" method="post">
            <div class="form-group">
              <label for="username">아이디</label>
              <input type="text" id="username" name="username" required>
            </div>
            <div class="form-group">
              <label for="password">비밀번호</label>
              <input type="password" id="password" name="password" required>
            </div>
            <div class="form-group checkbox">
              <input type="checkbox" id="saveId" name="saveId">
              <label for="saveId">아이디 저장</label>
            </div>
            <button type="submit" class="btn login-btn">로그인</button>
          </form>
          <div class="login-links">
            <a href="#">아이디 찾기</a>
            <a href="#">비밀번호 찾기</a>
            <a href="#">회원가입</a>
          </div>
        </div>
        <div class="image-section">
          <img src="https://encrypted-tbn1.gstatic.com/images?q=tbn:ANd9GcTg7tKahQos1IOIbDZXpNDJeJBIImQnGYE4QNqPrRRWESgCIPn_" alt="캐릭터 이미지">
        </div>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
