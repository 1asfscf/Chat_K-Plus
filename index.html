<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>티비 스포츠</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --clr-bg: #0a0a0a;
      --clr-primary: #e50914;
      --clr-text: #eee;
      --clr-text-secondary: #aaa;
      --header-h-pc: 56px;
      --header-h-mobile: 48px;
      --touch-target: 44px;
      --logo-size-pc: 28px;
      --logo-size-mobile: 24px;
      --card-elevate-y: -8px;
      --banner-height-pc: 300px;
      --banner-height-mobile: 180px;
      --bottom-nav-h: 60px;
    }
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0; padding: 0;
    }
    body {
      background: var(--clr-bg);
      color: var(--clr-text);
      font-family: 'Noto Sans KR', sans-serif;
      overflow-x: hidden;
    }
    header {
      position: fixed; top: 0; left: 0; right: 0;
      display: flex; align-items: center;
      padding: 0 16px;
      background: rgba(0,0,0,0.85);
      backdrop-filter: saturate(180%) blur(10px);
      border-bottom: 1px solid rgba(255,255,255,0.1);
      z-index: 1000;
      transition: height 0.3s ease;
    }
    .logo {
      color: var(--clr-primary);
      font-family: 'Noto Sans KR', sans-serif;
      font-size: var(--logo-size-pc);
      letter-spacing: 4px;
      font-weight: 900;
      flex-shrink: 0;
      user-select: none;
    }
    .pc-nav {
      display: flex; gap: 32px; flex: 1;
      justify-content: center;
    }
    .pc-nav a {
      padding: 12px 16px;
      color: var(--clr-text);
      font: 600 16px/1 'Noto Sans KR';
      position: relative;
      text-decoration: none;
      border-radius: 6px;
    }
    .pc-nav a.active { color: var(--clr-primary); }
    .pc-nav a.active::after {
      content: '';
      position: absolute; left:50%; bottom: 4px;
      width:60%; height:2px;
      background: var(--clr-primary); border-radius:1px;
      transform: translateX(-50%);
    }
    .mobile-nav-drawer, .mobile-bottom-nav, .header-icons, .category-filters { display: none; }

    /* --------- 배너 --------- */
    .banner-container { position: relative; margin-top: var(--header-h-pc); width: 100%; height: var(--banner-height-pc); overflow: hidden; }
    .banner-slide { display: flex; width: 200%; height: 100%; transition: transform 0.6s ease-in-out; }
    .banner-item { width: 50%; flex-shrink: 0; }
    .banner-item img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .banner-controls { position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%); display: flex; gap: 8px; }
    .banner-dot { width: 10px; height: 10px; background: rgba(255,255,255,0.6); border-radius: 50%; cursor: pointer; transition: background 0.3s; }
    .banner-dot.active { background: var(--clr-primary); }
    main { padding: 16px; max-width: 1280px; margin: 0 auto; }

    /* --------- 모바일 스타일 업그레이드 --------- */
    @media (max-width: 767px) {
      header { height: var(--header-h-mobile); padding: 0 10px 0 16px;}
      .logo { font-size: var(--logo-size-mobile); letter-spacing: 1.5px; }
      .header-icons {
        display: flex; align-items: center; gap: 8px;
        margin-left: auto;
      }
      .header-icons button { background: none; border: none; color: var(--clr-text); padding: 6px; }
      .pc-nav {
        display: flex; flex: 1;
        gap: 0; margin: 0 8px; overflow-x: auto;
        -webkit-overflow-scrolling: touch; scrollbar-width: none; -ms-overflow-style: none;
      }
      .pc-nav::-webkit-scrollbar { display: none; }
      .pc-nav a {
        font-size: 13px; color: var(--clr-text-secondary); padding: 9px 10px 11px 10px;
        font-weight: 600; white-space: nowrap; background: none;
      }
      .pc-nav a.active {
        color: var(--clr-text);
        font-weight: 900;
      }
      .pc-nav a.active::after {
        content:"";
        position:absolute; left:50%; bottom:4px;
        transform: translateX(-50%);
        width:30%; height:2px; background:var(--clr-text); border-radius:1px;
      }

      .banner-container { height: var(--banner-height-mobile); margin-top: var(--header-h-mobile);}
      main {padding-bottom: calc(var(--bottom-nav-h) + 24px);}
      .category-filters {
        display: flex; gap: 6px; padding: 14px 0 14px 2px; margin-bottom: 8px; overflow-x: auto;
        -webkit-overflow-scrolling: touch; scrollbar-width:none;-ms-overflow-style:none;
      }
      .category-filters::-webkit-scrollbar {display:none;}
      .category-filters .filter-btn {
        border: none; border-radius: 20px; background: #181818;
        color: #fff; font-weight: 600; font-size: 13px;
        padding: 8px 16px; white-space: nowrap; flex-shrink: 0;
      }
      .category-filters .filter-btn.active {
        background: var(--clr-primary); color: #fff;
      }
      /* 리스트 2개로 (좋아할만한, 새로시작한) */
      .section-header {display: flex; justify-content: space-between; align-items: center; margin: 18px 2px 8px 2px;}
      .section-title {font-size: 16px;}
      .view-all { color: var(--clr-text-secondary); font-size: 12.5px; margin-right: 4px;text-decoration: none;}
      .content-list { display: flex; gap:10px; overflow-x: auto; scroll-behavior: smooth; padding-bottom:6px; }
      .content-list::-webkit-scrollbar {display:none;}
      .content-item {
        width: 108px; flex: 0 0 108px; border-radius:8px; overflow: hidden; position:relative; cursor:pointer;
        transition: transform 0.18s cubic-bezier(.33,.98,.77,.99), box-shadow 0.2s;
        background: #141414;
      }
      .content-item img { width:100%; aspect-ratio:2/3; object-fit:cover; border-radius:8px; }
      .card-title { font-size: 12.5px; color:#fff; margin:7px 0 3px 4px; }
      .rank { position:absolute; top:8px; left:8px; padding:1.5px 6px; font-size:12px; background:rgba(0,0,0,0.38); color:#fff; border-radius:7px; font-weight:700;}
      /* 하단 Nav */
      .mobile-bottom-nav {
        display:flex; position:fixed; bottom:0; left:0; right:0;
        height:var(--bottom-nav-h); background:#141414;
        border-top:1.5px solid #232323;
        justify-content:space-between; align-items:center;
        z-index:10000; padding: 0 8px;
      }
      .bottom-nav-btn {
        flex:1; background:none; border:0; font-size:12px;
        color:var(--clr-text-secondary); display:flex; flex-direction:column; align-items:center;
        justify-content:center; padding:6px 4px;
        transition: color 0.18s;
        position:relative; font-weight:500;
      }
      .bottom-nav-btn.active { color:#fff; font-weight: 900;}
      .bottom-nav-btn svg { width:24px; height:24px; margin-bottom:2px; }
    }
  </style>
</head>
<body>

  <header>
    <div class="logo" aria-label="티비 스포츠 로고">티비 스포츠</div>
    <nav class="pc-nav" role="navigation" aria-label="주요 메뉴">
      <a href="#">실시간</a>
      <a href="#" class="active">TV프로그램</a>
      <a href="#">영화</a>
      <a href="#">파라운트+</a>
      <a href="#">키즈</a>
    </nav>
    <div class="header-icons">
        <button aria-label="캐스트">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 16.1A5 5 0 0 1 5.9 20M2 12.05A9 9 0 0 1 9.95 20M2 8a13 13 0 0 1 13 13m4-1-2-2-2 2"/></svg>
        </button>
        <button aria-label="프로필">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="var(--clr-primary)"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
        </button>
    </div>
  </header>

  <nav class="mobile-nav-drawer" aria-label="모바일 메뉴">
    <a href="#" class="active">실시간</a>
    <a href="#">TV프로그램</a>
    <a href="#">영화</a>
    <a href="#">파라운트+</a>
    <a href="#">키즈</a>
  </nav>

  <div class="banner-container">
    <div class="banner-slide" id="bannerSlide">
      <div class="banner-item">
        <img src="https://t1.daumcdn.net/brunch/service/user/7onF/image/-UOqf4TxgKFINfDx34hOWbrQpL4.png" alt="배너1">
      </div>
      <div class="banner-item">
        <img src="https://i.ytimg.com/vi/e3usuzCDe4k/mqdefault.jpg" alt="배너2">
      </div>
    </div>
    <div class="banner-controls">
      <div class="banner-dot active" data-index="0"></div>
      <div class="banner-dot" data-index="1"></div>
    </div>
  </div>

  <main>
    <section class="category-filters" aria-label="콘텐츠 카테고리">
      <button class="filter-btn active">드라마</button>
      <button class="filter-btn">예능</button>
      <button class="filter-btn">해외시리즈</button>
      <button class="filter-btn">애니메이션</button>
    </section>
    
    <section>
      <div class="section-header">
        <div class="section-title">님이 좋아할만한 프로그램</div>
      </div>
      <div class="content-list">
        <div class="content-item">
          <div class="poster"><img src="https://image.tving.com/ntgs/contents/CTC/caip/CAIP0900/ko/20231116/0710/P000587159.jpg/dims/resize/F_webp,400" alt="대방출" loading="lazy" decoding="async"></div>
          <span class="card-title">대방출</span>
          <span class="rank">1</span>
        </div>
        <div class="content-item">
          <div class="poster"><img src="https://image.tving.com/ntgs/contents/CTC/caip/CAIP0900/ko/20240307/0930/P001753352.jpg/dims/resize/F_webp,400" alt="눈물의 여왕" loading="lazy" decoding="async"></div>
          <span class="card-title">눈물의 여왕</span>
          <span class="rank">2</span>
        </div>
        <div class="content-item">
          <div class="poster"><img src="https://image.tving.com/ntgs/contents/CTC/caip/CAIP0900/ko/20240124/0226/P001752535.jpg/dims/resize/F_webp,400" alt="웨딩 임파서블" loading="lazy" decoding="async"></div>
          <span class="card-title">웨딩 임파서블</span>
          <span class="rank">3</span>
        </div>
      </div>
    </section>

    <section style="margin-top:18px;">
      <div class="section-header">
        <div class="section-title">새로 시작한 프로그램</div>
        <a class="view-all" href="#">전체보기 &gt;</a>
      </div>
      <div class="content-list new-releases-list">
        <div class="content-item">
          <div class="poster"><img src="https://image.tving.com/ntgs/contents/CTC/caip/CAIP0900/ko/20250507/1456/P001492081.jpg/dims/resize/F_webp,400" alt="나는 솔로" loading="lazy" decoding="async"></div>
          <span class="card-title">나는 솔로</span>
          <span class="rank">4</span>
        </div>
        <div class="content-item">
          <div class="poster"><img src="https://image.tving.com/ntgs/contents/CTC/caip/CAIP0900/ko/20250622/1530/P001773168.jpg/dims/resize/F_webp,400" alt="오은영 스테이" loading="lazy" decoding="async"></div>
          <span class="card-title">오은영 스테이</span>
          <span class="rank">5</span>
        </div>
        <div class="content-item">
          <div class="poster"><img src="https://img.tving.com/uploaded_images/contents/2024/07/20240724123956_0.jpg" alt="한성" loading="lazy" decoding="async"></div>
          <span class="card-title">한성</span>
          <span class="rank">6</span>
        </div>
      </div>
    </section>
  </main>

  <nav class="mobile-bottom-nav" role="navigation" aria-label="모바일 하단 메뉴">
    <button class="bottom-nav-btn active" aria-label="홈">
      <!-- solid/outline 차이, 홈은 solid로 -->
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M19 21V9.5L12 4 5 9.5V21h14zm-7-8h2v6h-2v-6zm-5 0h2v6H7v-6z"/></svg>
      <span>홈</span>
    </button>
    <button class="bottom-nav-btn" aria-label="공개예정">
      <svg viewBox="0 0 24 24" fill="none" stroke="#bbb" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 8v4l3 3"/></svg>
      <span>공개예정</span>
    </button>
    <button class="bottom-nav-btn" aria-label="검색">
      <svg viewBox="0 0 24 24" fill="none" stroke="#bbb" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <span>검색</span>
    </button>
    <button class="bottom-nav-btn" aria-label="기록">
      <svg viewBox="0 0 24 24" fill="none" stroke="#bbb" stroke-width="2"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M9 9h6v6H9z"/></svg>
      <span>기록</span>
    </button>
  </nav>

  <script>
    // 배너 슬라이드 (그대로)
    const initBannerSlide = () => {
      const slide = document.getElementById('bannerSlide');
      const dots = document.querySelectorAll('.banner-dot');
      if (!slide || dots.length === 0) return;
      let current = 0, slideInterval;
      const goToSlide = (idx) => {
        slide.style.transform = `translateX(-${idx * 50}%)`;
        dots.forEach(d => d.classList.remove('active'));
        dots[idx].classList.add('active'); current=idx;
      };
      const startAuto = () => { slideInterval = setInterval(()=>goToSlide((current+1)%dots.length), 5000);}
      const stopAuto = () => clearInterval(slideInterval);
      dots.forEach(dot => { dot.addEventListener('click', e=>{goToSlide(Number(e.target.dataset.index));startAuto();}); });
      startAuto();
    };
    document.addEventListener('DOMContentLoaded', initBannerSlide);
  </script>
</body>
</html>
