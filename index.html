<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>티빙 스타일 OTT 다시보기</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&display=swap');

  /* Reset */
  * {
    margin: 0; padding: 0; box-sizing: border-box;
  }
  body {
    background-color: #000;
    color: #fff;
    font-family: 'Noto Sans KR', sans-serif;
    overflow-x: hidden;
  }
  a {
    color: inherit;
    text-decoration: none;
  }
  button {
    cursor: pointer;
    border: none;
    background: none;
    color: inherit;
  }

  /* 상단 헤더 */
  header {
    position: fixed;
    top: 0; left: 0; right: 0;
    height: 56px;
    background: #111;
    display: flex;
    align-items: center;
    padding: 0 20px;
    z-index: 10000;
  }
  .logo {
    font-weight: 900;
    font-size: 24px;
    letter-spacing: 3px;
    color: #e50914;
    user-select: none;
    flex-shrink: 0;
  }
  nav {
    margin-left: 30px;
    display: flex;
    gap: 24px;
    align-items: center;
    flex-grow: 1;
  }
  nav a {
    font-size: 14px;
    font-weight: 600;
    color: #eee;
    padding: 6px 0;
    position: relative;
    user-select: none;
    transition: color 0.3s;
  }
  nav a.active,
  nav a:hover {
    color: #e50914;
  }
  nav a.active::after {
    content: '';
    position: absolute;
    bottom: -6px;
    left: 0;
    width: 100%;
    height: 2px;
    background: #e50914;
    border-radius: 2px;
  }

  /* 햄버거 메뉴 (모바일) */
  .hamburger {
    display: none;
    flex-direction: column;
    justify-content: space-between;
    width: 22px;
    height: 18px;
    cursor: pointer;
    margin-right: 20px;
  }
  .hamburger span {
    display: block;
    height: 3px;
    background: #e50914;
    border-radius: 2px;
  }

  /* 검색 아이콘 */
  .search-icon {
    width: 22px;
    height: 22px;
    fill: #eee;
    cursor: pointer;
    flex-shrink: 0;
  }

  /* 메인 컨텐츠 영역 */
  main {
    padding: 72px 40px 40px;
    max-width: 1280px;
    margin: 0 auto;
  }

  /* 섹션 제목 */
  .section-title {
    font-size: 18px;
    font-weight: 700;
    margin-bottom: 14px;
    user-select: none;
  }

  /* 콘텐츠 리스트 */
  .content-row {
    display: flex;
    overflow-x: auto;
    gap: 14px;
    padding-bottom: 8px;
    scroll-behavior: smooth;
  }
  .content-row::-webkit-scrollbar {
    height: 8px;
  }
  .content-row::-webkit-scrollbar-thumb {
    background: #444;
    border-radius: 4px;
  }
  .content-row::-webkit-scrollbar-track {
    background: transparent;
  }

  /* 콘텐츠 아이템 */
  .content-item {
    flex: 0 0 auto;
    width: 140px;
    cursor: pointer;
    user-select: none;
  }
  .content-item img {
    width: 100%;
    border-radius: 6px;
    display: block;
    aspect-ratio: 2/3;
    object-fit: cover;
    box-shadow: 0 0 8px rgba(0,0,0,0.7);
    transition: transform 0.3s ease;
  }
  .content-item:hover img {
    transform: scale(1.05);
    box-shadow: 0 0 16px #e50914;
  }
  .content-title {
    margin-top: 8px;
    font-size: 13px;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* 슬라이드 배너 */
  .banner {
    position: relative;
    width: 100%;
    height: 420px;
    margin-bottom: 48px;
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 0 30px rgba(229,9,20,0.7);
  }
  .banner img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    transition: opacity 1s ease;
  }
  .banner-content {
    position: absolute;
    bottom: 40px;
    left: 40px;
    color: #fff;
    max-width: 480px;
    text-shadow: 0 0 8px rgba(0,0,0,0.9);
  }
  .banner-title {
    font-size: 36px;
    font-weight: 900;
    margin-bottom: 12px;
  }
  .banner-desc {
    font-size: 16px;
    margin-bottom: 20px;
    line-height: 1.3;
  }
  .btn-detail {
    background-color: #e50914;
    border: none;
    padding: 12px 28px;
    font-weight: 700;
    font-size: 14px;
    border-radius: 4px;
    color: #fff;
    cursor: pointer;
    transition: background-color 0.3s ease;
  }
  .btn-detail:hover {
    background-color: #b00610;
  }

  /* 슬라이드 화살표 */
  .arrow {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    width: 48px;
    height: 48px;
    background: rgba(0,0,0,0.5);
    border-radius: 50%;
    color: #fff;
    font-size: 28px;
    line-height: 48px;
    text-align: center;
    cursor: pointer;
    user-select: none;
    transition: background-color 0.3s ease;
    z-index: 10;
  }
  .arrow:hover {
    background: #e50914;
  }
  .arrow.left {
    left: 20px;
  }
  .arrow.right {
    right: 20px;
  }

  /* 점 네비게이션 */
  .dots {
    position: absolute;
    bottom: 16px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 12px;
    z-index: 10;
  }
  .dot {
    width: 14px;
    height: 14px;
    background: rgba(255,255,255,0.3);
    border-radius: 50%;
    cursor: pointer;
    transition: background-color 0.3s ease;
  }
  .dot.active {
    background: #e50914;
  }

  /* 반응형 */
  @media (max-width: 1024px) {
    main {
      padding: 72px 20px 30px;
      max-width: 100%;
    }
    .content-item {
      width: 120px;
    }
    .banner-content {
      max-width: 320px;
      left: 20px;
      bottom: 30px;
    }
    .banner-title {
      font-size: 28px;
    }
    .banner-desc {
      font-size: 14px;
    }
  }
  @media (max-width: 600px) {
    header {
      padding: 0 15px;
    }
    .hamburger {
      display: flex;
    }
    nav {
      position: fixed;
      top: 56px;
      left: 0;
      right: 0;
      background: #111;
      flex-direction: column;
      gap: 0;
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.3s ease;
      z-index: 9999;
    }
    nav.open {
      max-height: 200px;
    }
    nav a {
      padding: 14px 20px;
      border-bottom: 1px solid #222;
      font-size: 16px;
    }
    main {
      padding: 72px 15px 20px;
    }
    .content-item {
      width: 110px;
    }
    .banner {
      height: 280px;
      border-radius: 0;
    }
    .banner-content {
      max-width: 90%;
      left: 15px;
      bottom: 20px;
    }
    .banner-title {
      font-size: 22px;
    }
    .banner-desc {
      font-size: 13px;
    }
    .arrow {
      width: 36px;
      height: 36px;
      font-size: 22px;
      line-height: 36px;
    }
    .arrow.left {
      left: 10px;
    }
    .arrow.right {
      right: 10px;
    }
  }
</style>
</head>
<body>

<header>
  <div class="hamburger" aria-label="메뉴 열기" role="button" tabindex="0">
    <span></span><span></span><span></span>
  </div>
  <div class="logo" aria-label="티빙 로고">TVING</div>
  <nav>
    <a href="#" class="active">실시간</a>
    <a href="#">TV프로그램</a>
    <a href="#">영화</a>
    <a href="#">티빙룸</a>
  </nav>
  <svg class="search-icon" viewBox="0 0 24 24" aria-label="검색" role="button" tabindex="0">
    <path d="M21 21l-4.35-4.35M10 18a8 8 0 1 0 0-16 8 8 0 0 0 0 16z" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
</header>

<main>
  <section class="banner" aria-label="메인 배너 슬라이드">
    <img src="https://img.tving.com/uploaded_images/contents/2022/10/20221020105128_0.jpg" alt="지리산" class="banner-img" />
    <div class="banner-content">
      <h2 class="banner-title">지리산</h2>
      <p class="banner-desc">하늘과 만나는 곳, 여수저 지속의 경계</p>
      <button class="btn-detail" aria-label="지리산 자세히보기">자세히보기</button>
    </div>
    <div class="arrow left" role="button" aria-label="이전 배너" tabindex="0">&#10094;</div>
    <div class="arrow right" role="button" aria-label="다음 배너" tabindex="0">&#10095;</div>
    <div class="dots" role="tablist" aria-label="배너 선택">
      <div class="dot active" data-index="0" role="tab" tabindex="0" aria-selected="true"></div>
      <div class="dot" data-index="1" role="tab" tabindex="-1" aria-selected="false"></div>
      <div class="dot" data-index="2" role="tab" tabindex="-1" aria-selected="false"></div>
    </div>
  </section>

  <section aria-label="티빙에서 꼭 봐야하는 콘텐츠">
    <h3 class="section-title">티빙에서 꼭 봐야하는 콘텐츠</h3>
    <div class="content-row" tabindex="0" aria-label="콘텐츠 리스트">
      <div class="content-item" tabindex="0">
        <img src="https://img.tving.com/uploaded_images/contents/2023/01/20230110123456_0.jpg" alt="해피니스" />
        <div class="content-title">해피니스</div>
      </div>
      <div class="content-item" tabindex="0">
        <img src="https://img.tving.com/uploaded_images/contents/2023/02/20230210123456_0.jpg" alt="러브캐처 인 서울" />
        <div class="content-title">러브캐처 인 서울</div>
      </div>
      <div class="content-item" tabindex="0">
        <img src="https://img.tving.com/uploaded_images/contents/2023/03/20230310123456_0.jpg" alt="술꾼도시여자들" />
        <div class="content-title">술꾼도시여자들</div>
      </div>
      <div class="content-item" tabindex="0">
        <img src="https://img.tving.com/uploaded_images/contents/2023/04/20230410123456_0.jpg" alt="어른연습생" />
        <div class="content-title">어른연습생</div>
      </div>
      <div class="content-item" tabindex="0">
        <img src="https://img.tving.com/uploaded_images/contents/2023/05/20230510123456_0.jpg" alt="가상세계지만 스타가 되고 싶어" />
        <div class="content-title">가상세계지만 스타가 되고 싶어</div>
      </div>
      <div class="content-item" tabindex="0">
        <img src="https://img.tving.com/uploaded_images/contents/2023/06/20230610123456_0.jpg" alt="EMERGENCY" />
        <div class="content-title">EMERGENCY</div>
      </div>
    </div>
  </section>
</main>

<script>
  // 햄버거 메뉴 토글
  const hamburger = document.querySelector('.hamburger');
  const nav = document.querySelector('nav');
  hamburger.addEventListener('click', () => {
    nav.classList.toggle('open');
  });
  hamburger.addEventListener('keydown', e => {
    if(e.key === 'Enter' || e.key === ' ') {
      e.preventDefault();
      nav.classList.toggle('open');
    }
  });

  // 배너 슬라이드 기능
  const bannerImages = [
    {
      src: 'https://img.tving.com/uploaded_images/contents/2022/10/20221020105128_0.jpg',
      title: '지리산',
      desc: '하늘과 만나는 곳, 여수저 지속의 경계'
    },
    {
      src: 'https://img.tving.com/uploaded_images/contents/2023/01/20230110123456_0.jpg',
      title: '두 번째 슬라이드',
      desc: '설명 문구가 들어갑니다'
    },
    {
      src: 'https://img.tving.com/uploaded_images/contents/2023/02/20230210123456_0.jpg',
      title: '세 번째 슬라이드',
      desc: '추가 설명 문구'
    }
  ];
  const bannerImg = document.querySelector('.banner-img');
  const bannerTitle = document.querySelector('.banner-title');
  const bannerDesc = document.querySelector('.banner-desc');
  const dots = document.querySelectorAll('.dot');
  const leftArrow = document.querySelector('.arrow.left');
  const rightArrow = document.querySelector('.arrow.right');
  let currentIndex = 0;
  let slideInterval;

  function updateBanner(index) {
    bannerImg.src = bannerImages[index].src;
    bannerImg.alt = bannerImages[index].title;
    bannerTitle.textContent = bannerImages[index].title;
    bannerDesc.textContent = bannerImages[index].desc;
    dots.forEach((dot, i) => {
      dot.classList.toggle('active', i === index);
      dot.setAttribute('aria-selected', i === index);
      dot.tabIndex = i === index ? 0 : -1;
    });
    currentIndex = index;
  }

  function nextSlide() {
    updateBanner((currentIndex + 1) % bannerImages.length);
  }
  function prevSlide() {
    updateBanner((currentIndex - 1 + bannerImages.length) % bannerImages.length);
  }
  function startAutoSlide() {
    slideInterval = setInterval(nextSlide, 6000);
  }
  function stopAutoSlide() {
    clearInterval(slideInterval);
  }

  dots.forEach(dot => {
    dot.addEventListener('click', () => {
      updateBanner(parseInt(dot.dataset.index));
      stopAutoSlide();
      startAutoSlide();
    });
    dot.addEventListener('keydown', e => {
      if(e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        updateBanner(parseInt(dot.dataset.index));
        stopAutoSlide();
        startAutoSlide();
      }
    });
  });

  rightArrow.addEventListener('click', () => {
    nextSlide();
    stopAutoSlide();
    startAutoSlide();
  });
  rightArrow.addEventListener('keydown', e => {
    if(e.key === 'Enter' || e.key === ' ') {
      e.preventDefault();
      nextSlide();
      stopAutoSlide();
      startAutoSlide();
    }
  });

  leftArrow.addEventListener('click', () => {
    prevSlide();
    stopAutoSlide();
    startAutoSlide();
  });
  leftArrow.addEventListener('keydown', e => {
    if(e.key === 'Enter' || e.key === ' ') {
      e.preventDefault();
      prevSlide();
      stopAutoSlide();
      startAutoSlide();
    }
  });

  // 초기 배너 세팅 및 자동 슬라이드 시작
  updateBanner(0);
  startAutoSlide();
</script>

</body>
</html>
