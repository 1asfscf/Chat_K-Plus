<!DOCTYPE html> <index.html 0.0.2>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Chat k plus</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        
        <!-- ========== 검색 화면 ========== -->
        <div id="search-view">
            <div class="search-content">
                <div class="logo">✦</div>
                <div class="title">
    Chat K plus
    <span class="beta-badge">BETA</span>
</div>
                
                <div class="search-container">
                    <input 
                        type="text" 
                        id="queryInput" 
                        class="search-input" 
                        placeholder="무엇이든 물어보세요"
                        autocomplete="off"
                    >
                    <button id="searchBtn" class="search-btn" disabled>검색</button>
                </div>

                <div class="examples">
                    <p class="examples-title">예시 질문</p>
                    <div class="button-group">
                        <button class="example-btn">아바타 2가 뭐죠?</button>
                        <button class="example-btn">정치</button>
                        <button class="example-btn">사회/정치2</button>
                        <button class="example-btn">너에 대해서</button>
                    </div>
                </div>
            </div>

            <footer class="app-footer">
                <p>Chat K plus 는 실수할 수 있습니다.</p>
            </footer>
        </div>

       <!-- ========== 채팅 화면 ========== -->
<div id="chat-view" class="hidden">
    <header class="chat-header">
        <button id="backBtn" class="back-btn">← 뒤로</button>
    </header>

    <div id="chat-box" class="chat-box"></div>

    <footer class="chat-footer">
        <div class="input-wrapper-modern">
            <div class="input-top">
                <textarea id="chatInput" class="chat-input" placeholder="Ask. 챗케이플러스" rows="1"></textarea>
            </div>
            <div class="input-controls">
                <div class="controls-left">
                    <button id="timetableBtn" class="icon-btn" title="시간표">📅</button>
                    <select id="difficultySelect" class="difficulty-select">
                        <option value="normal">보통</option>
                        <option value="detail">자세히</option>
                        <option value="simple">간단히</option>
                    </select>
                </div>
                <div class="controls-right">
                    <button id="sendBtn" class="send-circle" disabled>↑</button>
                    <button id="stopBtn" class="stop-circle hidden" title="중지">■</button>
                </div>
            </div>
        </div>
    </footer>
</div>

    <!-- 시간표 모달 -->
    <div id="timetableModal" class="modal hidden">
        <div class="modal-backdrop"></div>
        <div class="modal-content timetable-modal">
            <div class="timetable-header">
                <h3>📅 내 시간표</h3>
                <button id="timetableClose" class="close-btn">×</button>
            </div>

            <div class="timetable-tabs">
                <button class="tab active" data-day="mon">월</button>
                <button class="tab" data-day="tue">화</button>
                <button class="tab" data-day="wed">수</button>
                <button class="tab" data-day="thu">목</button>
                <button class="tab" data-day="fri">금</button>
            </div>

            <div id="timetableContent" class="timetable-content">
                <!-- 데모: 월요일 시간표 -->
                <div class="timetable-item">
                    <div class="timetable-time">09:00-10:30</div>
                    <div class="timetable-subject">수학</div>
                    <div class="timetable-room">3-2</div>
                </div>
                <div class="timetable-item">
                    <div class="timetable-time">11:00-12:30</div>
                    <div class="timetable-subject">영어</div>
                    <div class="timetable-room">2-1</div>
                </div>
            </div>

            <div class="timetable-footer">
                <button id="addClassBtn" class="timetable-add">+ 수업 추가</button>
            </div>
        </div>
    </div>

    <!-- 수업 추가 모달 - 이제 형제로 나옴 -->
    <div id="addClassModal" class="modal hidden">
        <div class="modal-backdrop"></div>
        <div class="modal-content add-class-modal">
            <h3>수업 추가</h3>
            <div class="form-group">
                <label>요일</label>
                <select id="classDay">
                    <option value="mon">월요일</option>
                    <option value="tue">화요일</option>
                    <option value="wed">수요일</option>
                    <option value="thu">목요일</option>
                    <option value="fri">금요일</option>
                </select>
            </div>
            <div class="form-group">
                <label>시간</label>
                <input type="text" id="classTime" placeholder="09:00-10:30">
            </div>
            <div class="form-group">
                <label>과목</label>
                <input type="text" id="classSubject" placeholder="수학">
            </div>
            <div class="form-group">
                <label>교실</label>
                <input type="text" id="classRoom" placeholder="3-2">
            </div>
            <div class="modal-buttons">
                <button id="cancelAdd" class="modal-btn cancel">취소</button>
                <button id="saveAdd" class="modal-btn go">저장</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
