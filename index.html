<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>티빙</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

<header>
  <!-- PC 헤더 -->
  <div class="header-pc">
    <div class="logo" aria-label="티빙 로고">TVING</div>
    <nav class="nav-pc" role="navigation" aria-label="주요 메뉴">
      <a href="#" class="active">실시간</a>
      <a href="#">TV프로그램</a>
      <a href="#">영화</a>
      <a href="#">파라운트+</a>
      <a href="#">키즈</a>
    </nav>
    <div class="header-icons">
      <button class="icon-btn" aria-label="캐스트 연결">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M1 18v3h3"></path>
          <path d="M1 14a9 9 0 0 1 9 9h3"></path>
          <path d="M1 10a13 13 0 0 1 13 13h3"></path>
          <path d="M1 6a17 17 0 0 1 17 17h3"></path>
          <circle cx="3.5" cy="18.5" r="1.5"></circle>
        </svg>
      </button>
      <button class="icon-btn" aria-label="장바구니">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="9" cy="21" r="1"></circle>
          <circle cx="20" cy="21" r="1"></circle>
          <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
        </svg>
      </button>
    </div>
  </div>

  <!-- 모바일 헤더 -->
  <div class="header-mobile">
    <button class="hamburger-btn" aria-label="메뉴 열기" aria-expanded="false" aria-controls="mobile-menu">
      <span></span><span></span><span></span>
    </button>
    <div class="logo" aria-label="티빙 로고">TVING</div>
    <button class="icon-btn" aria-label="검색">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="7"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
    </button>
  </div>

  <!-- 모바일 메뉴 -->
  <nav id="mobile-menu" class="mobile-menu" aria-label="모바일 메뉴" hidden>
    <a href="#" class="active">실시간</a>
    <a href="#">TV프로그램</a>
    <a href="#">영화</a>
    <a href="#">파라운트+</a>
    <a href="#">키즈</a>
  </nav>
</header>

<main>
  <!-- 콘텐츠 영역은 이전에 제시한 코드와 동일하게 구성하시면 됩니다 -->
<main>
  <section class="top20" aria-label="오늘의 티빙 TOP 20">
    <h2 class="section-title">오늘의 티빙 TOP 20</h2>
    <div class="top20-list">
      <div class="top20-item">
        <span class="rank">1</span>
        <img src="https://img.tving.com/uploaded_images/contents/2024/07/20240724123456_0.jpg" alt="대탈출" />
        <span class="label new">NEW</span>
        <span class="label age">18+</span>
      </div>
      <div class="top20-item">
        <span class="rank">2</span>
        <img src="https://img.tving.com/uploaded_images/contents/2024/07/20240724123556_0.jpg" alt="눈물의 여왕" />
      </div>
      <div class="top20-item">
        <span class="rank">3</span>
        <img src="https://img.tving.com/uploaded_images/contents/2024/07/20240724123656_0.jpg" alt="웨딩 임파서블" />
        <span class="label only">ONLY</span>
      </div>
      <div class="top20-item">
        <span class="rank">4</span>
        <img src="https://img.tving.com/uploaded_images/contents/2024/07/20240724123756_0.jpg" alt="나는 솔로" />
        <span class="label new">NEW</span>
      </div>
      <div class="top20-item">
        <span class="rank">5</span>
        <img src="https://img.tving.com/uploaded_images/contents/2024/07/20240724123856_0.jpg" alt="유퀴즈" />
        <span class="label new">NEW</span>
      </div>
      <div class="top20-item">
        <span class="rank">6</span>
        <img src="https://img.tving.com/uploaded_images/contents/2024/07/20240724123956_0.jpg" alt="한성" />
      </div>
    </div>
  </section>
</main>

<!-- 모바일 하단 메뉴바 -->
<nav class="mobile-bottom-nav" role="navigation" aria-label="모바일 하단 메뉴">
  <button class="bottom-nav-btn active" aria-label="홈">
    <svg width="24" height="24" fill="white" viewBox="0 0 24 24"><path d="M3 9.5L12 3l9 6.5V21a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1V9.5z"/></svg>
    <span>홈</span>
  </button>
  <button class="bottom-nav-btn" aria-label="공개예정">
    <svg width="24" height="24" fill="white" viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2zm1 15h-2v-6h2zm0-8h-2V7h2z"/></svg>
    <span>공개예정</span>
  </button>
  <button class="bottom-nav-btn" aria-label="검색">
    <svg width="24" height="24" fill="white" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7" stroke="white" stroke-width="2" fill="none"/><line x1="21" y1="21" x2="16.65" y2="16.65" stroke="white" stroke-width="2"/></svg>
    <span>검색</span>
  </button>
  <button class="bottom-nav-btn" aria-label="기록">
