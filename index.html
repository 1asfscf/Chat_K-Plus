<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>AI Chat MVP</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="theme-dark">
  <main class="app" role="application" aria-label="AI 채팅 앱">
    <header class="app-header">
      <div class="logo" aria-hidden="true">AI</div>
      <h1>AI Chat</h1>
    </header>

    <section class="chat" aria-live="polite">
      <div id="messages" class="messages">
        <div class="msg ai">안녕하세요. 무엇을 도와드릴까요?</div>
      </div>
    </section>

    <form id="composer" class="composer" autocomplete="off" aria-label="메시지 입력">
      <input id="input" class="input" type="text" placeholder="메시지를 입력하세요" aria-label="메시지" />
      <button type="submit" class="send">전송</button>
    </form>
  </main>

  <script src="app.js"></script>
</body>
</html>
