<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>공지 상세 - 탈배사 변경 안내 | momQ</title>
  <style>
    /* 기본 리셋 */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: Arial, sans-serif; background: #fdfdfd; color: #333; line-height: 1.6; }
    header {
      background: #fff;
      padding: 20px;
      border-bottom: 1px solid #e5e5e5;
      display: flex;
      align-items: center;
    }
    header a.logo {
      font-size: 24px;
      font-weight: bold;
      color: #333;
      text-decoration: none;
    }
    .container {
      max-width: 800px;
      margin: 40px auto;
      padding: 20px;
      background: #fff;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      border-radius: 5px;
    }
    .notice-title {
      font-size: 28px;
      margin-bottom: 10px;
      font-weight: bold;
    }
    .notice-date {
      color: #777;
      font-size: 14px;
      margin-bottom: 20px;
    }
    .notice-image {
      width: 100%;
      border-radius: 5px;
      margin-bottom: 20px;
    }
    .notice-content {
      font-size: 16px;
      margin-bottom: 40px;
    }
    /* 기존 "목록으로 돌아가기" 링크는 대신 내비게이션 영역으로 대체 */
    .notice-navigation {
      text-align: center;
      margin-bottom: 20px;
    }
    .notice-nav-button {
      display: inline-block;
      background-color: #e63946; /* 고급스러운 레드 계열 */
      color: #fff;
      padding: 10px 20px;
      text-decoration: none;
      border-radius: 5px;
      font-size: 16px;
      transition: background 0.3s;
      margin-bottom: 20px;
    }
    .notice-nav-button:hover {
      background-color: #d62828;
    }
    /* 이전글/다음글 영역 */
    .notice-nav-post {
      display: flex;
      justify-content: space-between;
    }
    .notice-nav-post .nav-post {
      width: 48%;
      background-color: #f0f0f0;
      padding: 15px;
      border-radius: 5px;
      text-align: left;
    }
    .nav-post .post-label {
      font-size: 14px;
      color: #555;
      margin-bottom: 5px;
    }
    .nav-post .post-title {
      font-size: 16px;
      font-weight: bold;
      margin-bottom: 5px;
    }
    .nav-post .post-date {
      font-size: 14px;
      color: #777;
    }
    /* 반응형 처리 */
    @media (max-width: 600px) {
      .notice-nav-post {
        flex-direction: column;
      }
      .notice-nav-post .nav-post {
        width: 100%;
        margin-bottom: 10px;
      }
    }
  </style>
</head>
<body>
  <!-- 헤더: 로고 클릭 시 index.html로 이동 -->
  <header>
    <a href="index.html" class="logo">momQ</a>
  </header>
  <div class="container">
    <div class="notice-title">탈배사 변경 안내</div>
    <div class="notice-date">2025.04.07</div>
    <img src="https://boardimg.momq.co.kr/img/1/2025-04/bab6e16876a.jpg" alt="공지 상세 이미지" class="notice-image">
    <div class="notice-content">
      <p>고객님께 안내 드립니다.</p>
      <p>2025년 4월 8일부터 모든 주문은 CJ대한통운으로 배송됩니다. 이에 따라 기존의 탈배사 배송 방식은 변경되오니, 이용에 불편 없으시길 바랍니다.</p>
      <p>자세한 사항은 고객센터로 문의해 주시기 바랍니다.</p>
    </div>
    <!-- 추가: 내비게이션 영역 -->
    <div class="notice-navigation">
      <a href="notice.html" class="notice-nav-button">목록으로 가기</a>
      <div class="notice-nav-post">
        <div class="nav-post prev-post">
          <div class="post-label">이전글</div>
          <div class="post-title">[발표] 흡그박스 후기사작 2025년 3월 당첨자</div>
          <div class="post-date">2025.03.15</div>
        </div>
        <div class="nav-post next-post">
          <div class="post-label">다음글</div>
          <div class="post-title">[발표] 3월 푸만의 선물위크 당첨자 발표</div>
          <div class="post-date">2025.03.20</div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
